  ['No smoking','Suction dislodges the clot; vasoconstriction and impaired neutrophils delay healing; higher dry-socket risk'],
  ['No sucking through straws or forceful spitting','Negative pressure dislodges the clot'],
  ['Avoid hot drinks and exercise on day 1','Vasodilation can restart bleeding'],
  ['From day 2, gentle warm salt-water rinses','Keeps the socket clean once the clot is stable']]));

C('l4-s11','L4','Ridge after extraction','socket',
 'What happens to the alveolar ridge after extraction, and how does this link to Lecture 2?',
 P('The ridge loses width and height as the socket remodels; the thin buccal wall loses more than the lingual. Most of the change happens in the first few months.') +
 LINK('L2 atrophy: loss of functional stimulus (residual ridge atrophy), with denture pressure adding to it.') +
 BEYOND('About 50% of ridge width is lost over 12 months, two-thirds of it in the first 3 months (Schropp et al. 2003).'));

/* =================== L5A — Hypersensitivity =================== */
C('l5a-01','L5A','Definition and causes','',
 'Define hypersensitivity and give its three general causes, with examples.',
 LEAD('Hypersensitivity is incidental tissue injury resulting from an immune response intended to destroy foreign antigens.') +
 T(['Cause','Examples'],[
  ['Autoimmunity','SLE, Graves disease'],
  ['Microbes','Excessive reaction; persistent microbe (<i>M. tuberculosis</i>); cross-reactivity with self (rheumatic heart disease)'],
  ['Environmental antigens','In genetically susceptible people (about 20% of the population are allergic): pollen, peanuts, penicillin, latex']]) +
 P('<b>Atopy:</b> an inherited tendency to overproduce IgE to common environmental antigens.') +
 P('Tutorial 5a MCQ answer: hypersensitivity reactions are <b>immune responses that cause tissue damage</b>.'));

C('l5a-02','L5A','Gell and Coombs types','t1',
 'Summarise the four types of hypersensitivity: name, mediator, timing and examples.',
 T(['Type','Name','Mediated by','Timing','Examples'],[
  ['I','Immediate','IgE on mast cells and basophils','Minutes (late phase hours later)','Anaphylaxis, asthma, hay fever, food and latex allergy'],
  ['II','Antibody to cell-bound antigen','IgG or IgM against antigen on a cell or tissue','Variable','Haemolytic anaemia, thrombocytopenic purpura, myasthenia gravis, Graves disease, mucous membrane pemphigoid'],
  ['III','Immune complex','IgG complexes with soluble antigen, deposited in tissue; complement','Days (post-streptococcal GN 10–12 days)','SLE, post-streptococcal glomerulonephritis'],
  ['IV','Delayed','T cells (CD4 Th1/Th17, CD8)','24–72 hours','Contact dermatitis, tuberculin reaction, type 1 diabetes, multiple sclerosis']]) +
 P('Types I–III are antibody-mediated; type IV is cell-mediated.') +
 HOOK('ACID: Allergic (I), Cytotoxic (II), Immune complex (III), Delayed (IV).'));

C('l5a-t1','L5A','Type I: sensitisation','t1',
 'Describe the sensitisation phase of type I hypersensitivity.',
 OL(['First exposure: an allergen (inhaled, ingested or injected; e.g. pollen, peanut, penicillin) is presented to CD4 T cells, producing a strong <b>Th2</b> response.',
     'Th2 cytokines: <b>IL-4</b> makes B cells class-switch to <b>IgE</b> (IL-13 also contributes); <b>IL-5</b> activates eosinophils; <b>IL-13</b> stimulates mucus secretion by epithelium.',
     'Plasma cells secrete allergen-specific IgE.',
     'IgE binds by its Fc portion (ε heavy chain) to the high-affinity receptor <b>FcεRI</b> on mast cells (also basophils, eosinophils). The mast cell is now <b>"sensitised"</b>.']) +
 P('No symptoms occur yet. Mast cells sit in all connective tissues, especially beneath epithelia and close to blood vessels.'));

C('l5a-t2','L5A','Type I: re-exposure','t1',
 'What happens when a sensitised person meets the allergen again?',
 OL(['The allergen binds and <b>cross-links two or more IgE</b> molecules on the sensitised mast cell.',
     'The mast cell <b>degranulates</b>, releasing preformed mediators (histamine, proteases, chemokines).',
     'It synthesises new <b>lipid mediators</b> (PGD2, leukotrienes) and <b>cytokines</b>.',
     '<b>Immediate reaction</b> (minutes): vasodilation, increased permeability, smooth muscle contraction, mucus; proteases damage local tissue.',
     '<b>Late-phase reaction</b> (hours): cytokines recruit leukocytes; eosinophils and neutrophils release proteases that damage tissue.']));

C('l5a-t3','L5A','Type I: preformed mediators','t1',
 'Name the preformed mast-cell mediators and their effects.',
 T(['Mediator','Effect'],[
  ['Histamine','Vasodilation, increased vascular permeability, smooth muscle contraction, increased mucus secretion'],
  ['Chemokines','Attract neutrophils and eosinophils'],
  ['Proteases','Tissue damage, generation of kinins, activation of complement (more chemotaxis and inflammation)']]) +
 BEYOND('A raised serum mast-cell tryptase (a protease) taken after an event helps confirm anaphylaxis.'));

C('l5a-t4','L5A','Type I: new mediators','t1',
 'Which newly synthesised mediators matter in type I hypersensitivity, and why are leukotrienes so important?',
 T(['Mediator','Effect'],[
  ['Prostaglandin D2','Most abundant cyclo-oxygenase product in mast cells; intense bronchospasm and mucus secretion'],
  ['Leukotrienes C4 and D4','The most potent vasoactive and spasmogenic agents known: several thousand times more active than histamine at increasing permeability and contracting bronchial smooth muscle'],
  ['Leukotriene B4','Highly chemotactic for neutrophils, eosinophils and monocytes']]) +
 P('This is why an antihistamine alone cannot control anaphylaxis: it blocks histamine but not the leukotrienes or PGD2.'));

C('l5a-t5','L5A','Immediate vs late phase','t1',
 'Compare the immediate and late-phase reactions of type I hypersensitivity.',
 T(['','Immediate','Late phase'],[
  ['Timing','Within minutes','Hours later (typically 2–24 h), without further exposure; can last days'],
  ['Driven by','Histamine, proteases, PGD2, LTC4/LTD4','Cytokines and chemokines, LTB4'],
  ['Cells','Mast cells','Recruited eosinophils, neutrophils, lymphocytes'],
  ['Effect','Vasodilation, leakage, smooth-muscle spasm','Proteases from eosinophils and neutrophils damage tissue']]) +
 BEYOND(''));

C('l5a-t6','L5A','Complement in inflammation','t1',
 'What are the biological effects of complement, and what do C3a, C4a and C5a do?',
 UL(['Lysis of antigen, opsonisation and phagocytosis.',
     'C3a, C4a and C5a (pro-inflammatory mediators): increase vascular permeability, release vasoactive amines from mast cells, induce smooth-muscle spasm.',
     '<b>C5a</b> is a potent chemoattractant.']) +
 P('Mast-cell proteases activate complement, so the two systems amplify each other.'));

C('l5a-t7','L5A','Anaphylaxis: features','t1',
 'Define anaphylaxis and list its clinical features by system.',
 LEAD('Anaphylaxis is a severe, systemic type I reaction: sudden hypotension, severe bronchoconstriction and collapse.') +
 T(['System','Features'],[
  ['Skin','Urticaria, angioedema, pruritus'],
  ['Respiratory','Stridor, wheeze, shortness of breath, upper-airway angioedema, persistent cough'],
  ['Cardiovascular','Hypotension, syncope, arrhythmias, tachycardia'],
  ['CNS','Unconsciousness, dizziness, confusion, headache'],
  ['GI','Nausea, vomiting']]) +
 P('<b>Why:</b> systemic mediator release causes widespread vasodilation and leakage (hypotension, shock, swelling) and bronchoconstriction. Triggers: bee and wasp venom, antimicrobials, peanuts, latex. The name is Greek for "backwards protection".'));

C('l5a-t8','L5A','Anaphylaxis: treatment','t1',
 'What is the first-line treatment for anaphylaxis? Give the doses and the other immediate steps.',
 LEAD('Intramuscular adrenaline into the outer mid-thigh, given immediately.') +
 T(['Device','Dose'],[
  ['EpiPen or Anapen 300','300 µg (adults and children over about 5 years)'],
  ['EpiPen Jr or Anapen 150','150 µg (children under about 5 years)'],
  ['Anapen 500','500 µg (some patients are prescribed this)'],
  ['Ampoule 1 mg/mL (1:1000)','0.01 mg/kg, maximum 0.5 mg']]) +
 UL(['Repeat every <b>5 minutes</b> if symptoms persist.',
     'Stop the procedure, call for help and an ambulance (000).',
     'Lay the patient flat (do not let them stand or walk); let them sit if breathing is difficult.',
     'Give oxygen, monitor, start CPR if needed.',
     'Antihistamines and steroids are adjuncts only, never a substitute for adrenaline.']) +
 FLAG('The slides write "300 mg" and "150 mg". The correct unit is micrograms (µg); 300 mg would be a thousand-fold overdose. Write µg in the exam.') +
 BEYOND(''));

C('l5a-t9','L5A','Why adrenaline works','t1',
 'Why is adrenaline the first-line drug? Explain it by receptor.',
 T(['Receptor','Effect','Reverses'],[
  ['α1','Vasoconstriction','Hypotension and mucosal or airway oedema'],
  ['β1','Increased heart rate and contractility','Low cardiac output'],
  ['β2','Bronchodilation; reduced mediator release from mast cells','Bronchospasm and ongoing degranulation']]) +
 P('Adrenaline counters every major mechanism at once; antihistamines block only one mediator and act too slowly.') +
 BEYOND(''));

C('l5a-t10','L5A','Anaphylaxis in the dental setting','t1',
 'What causes anaphylaxis in dental practice, how common is it, and what is an anaphylactoid reaction?',
 UL(['<b>Incidence:</b> 0.004–0.015 cases per dentist per year: rare, but you must be ready.',
     '<b>Dental triggers (lecture):</b> latex; topical preparations such as povidone-iodine and <b>chlorhexidine</b>; oil of cloves.',
     'Chlorhexidine irrigation of tooth sockets has caused <b>fatal</b> anaphylaxis.']) +
 P('<b>Anaphylactoid reaction:</b> the same mast-cell mediators and clinical picture, but release does not depend on IgE. Treat it exactly the same way.'));

C('l5a-t11','L5A','Anaphylaxis vs faint','t1',
 'A patient becomes pale and light-headed just after a local anaesthetic injection. How do you tell a vasovagal faint from anaphylaxis?',
 T(['','Vasovagal syncope','Anaphylaxis'],[
  ['Pulse','Slow (bradycardia)','Fast, weak (tachycardia)'],
  ['Skin','Pale, clammy','Urticaria, flushing, angioedema'],
  ['Airway','Normal','Wheeze, stridor, hoarseness'],
  ['Lying flat','Recovers quickly','Hypotension persists; worsens']]) +
 P('If in doubt, treat as anaphylaxis: adrenaline cannot be given too early.') +
 BEYOND('True IgE allergy to amide local anaesthetics is very rare; most reactions are vasovagal, effects of the adrenaline in the cartridge, or reactions to additives.'));

C('l5a-t12','L5A','Skin tests','t1',
 'Which skin test investigates type I and which investigates type IV hypersensitivity, and how is each read?',
 T(['','Skin-prick test','Patch test'],[
  ['Type','I (IgE)','IV (T cell)'],
  ['Method','Allergen pricked into the skin','Suspected contact sensitiser applied to normal skin on the back, covered for 48 hours'],
  ['Reading','Wheal and flare within about 15–20 minutes','Inspected at 2 and 4 days; positive = inflammation and induration']]) +
 BEYOND(''));

C('l5a-t13','L5A','Glove reactions','t1',
 'A dental nurse reacts to latex gloves. Which hypersensitivity types can latex cause, and how do they differ?',
 T(['','Type I','Type IV'],[
  ['Antigen','Natural rubber latex proteins','Chemical accelerators used in glove manufacture'],
  ['Onset','Minutes','Hours to days (12–48 h)'],
  ['Picture','Urticaria, rhinitis, asthma, up to anaphylaxis','Eczematous contact dermatitis of the hands'],
  ['Mediators','IgE, mast cells','Sensitised T cells']]) +
 P('Latex is on the lecture\'s list of dental anaphylaxis triggers; switch to non-latex products.') +
 BEYOND(''));

C('l5a-03','L5A','Type II mechanisms','',
 'Describe the mechanisms of tissue injury in type II hypersensitivity and give two examples.',
 LEAD('IgM or IgG antibodies react with antigens that form part of a cell membrane or tissue.') +
 T(['Mechanism','Example'],[
  ['Antibody targets tissue antigen, causing complement activation and inflammation','Mucous membrane pemphigoid (the slide\'s "MMP", not matrix metalloproteinase)'],
  ['Opsonisation, then phagocytosis of the coated cell','Autoimmune haemolytic anaemia'],
  ['Drug or metabolite binds a red cell or platelet; antibody against it destroys the cell too ("bystander lysis")','Drug-induced haemolytic anaemia, thrombocytopenic purpura'],
  ['Antibody <b>blocks</b> a receptor','Myasthenia gravis: anti-acetylcholine receptor, so neuromuscular transmission fails (weakness, paralysis)'],
  ['Antibody <b>stimulates</b> a receptor','Graves disease: anti-TSH receptor drives thyroid hormone without TSH (sometimes called type V)']]));

C('l5a-04','L5A','Type III: immune complexes','',
 'Explain type III hypersensitivity and describe post-streptococcal glomerulonephritis.',
 P('Antibodies against <b>soluble</b> antigen form immune complexes. If these are not cleared, they deposit in <b>blood vessels, joints and glomeruli</b>, fix complement and cause local inflammation: complement activation, platelet aggregation, neutrophil attraction, tissue damage. Damage occurs where complexes lodge, not where the antigen came from.') +
 P('<b>Post-streptococcal glomerulonephritis:</b> 10–12 days after a streptococcal throat or skin infection; antigen fragments from "nephritogenic" strains bind the glomerular basement membrane; IgG and C3 deposit there. A "one-shot" mechanism that usually resolves.') +
 P('<b>Chronic deposition</b> needs persistent antigen, an abnormal host response, or local defects such as complement deficiency. Examples: SLE, rheumatoid arthritis (lecture).') +
 FLAG('Robbins places rheumatoid arthritis mainly under T-cell-mediated (type IV) disease, with immune complexes contributing. Give the lecture\'s answer but know it is debated.'));

C('l5a-05','L5A','SLE','',
 'Summarise SLE: hypersensitivity type, epidemiology, clinical features and key antibodies.',
 UL(['<b>Type III</b>: immune complexes deposit in tissue and activate complement; multisystem inflammation with flares and quiet periods.',
     '<b>Epidemiology:</b> female predominance, peak in child-bearing years; Australian prevalence 45 per 100,000, higher in Indigenous Australians.',
     '<b>Aetiology:</b> over 100 genetic loci; 25% concordance in identical twins vs 2–5% in non-identical; triggers include EBV, UV light and smoking.',
     '<b>Features:</b> butterfly (malar) rash sparing the nasolabial folds, photosensitivity, arthralgia/arthritis, pleuritic pain, pericarditis, anaemia, leukopenia, thrombocytopenia, oral lesions.',
     '<b>Antibodies:</b> ANA almost always positive (sensitive, not specific); anti-dsDNA and anti-Sm highly specific; anti-C1q tracks activity.',
     '<b>Four types of lupus:</b> systemic, neonatal, discoid (skin and oral mucosa, scarring; may progress to SLE), drug-induced (resolves when the drug stops).']));

C('l5a-06','L5A','Type IV mechanism','',
 'Describe the mechanism of type IV (delayed-type) hypersensitivity. Why is it "delayed"?',
 OL(['<b>Sensitisation:</b> Langerhans cells take up antigen, travel to the lymph node and present it with MHC II to CD4 T cells, creating memory cells.',
     '<b>Re-exposure:</b> sensitised CD4 T cells secrete cytokines. Th1 cells release <b>IFN-γ</b>, recruiting and activating macrophages; Th17 cells release <b>IL-17</b>, recruiting neutrophils.',
     'TNF-α and TNF-β switch on endothelial adhesion molecules (ICAM-1, VCAM-1), letting neutrophils, monocytes and macrophages enter the tissue.',
     'Increased permeability causes oedema; macrophage enzymes cause tissue damage and necrosis.',
     'CD8 T cells can also kill antigen-bearing cells directly.']) +
 P('<b>Delayed</b> because circulating effector T cells take 24–48 hours to migrate to the antigen; the reaction develops over 2–3 days, is most visible at 48–72 hours, then diminishes. Infiltrate: T lymphocytes, macrophages, occasional eosinophils.'));

C('l5a-07','L5A','Contact dermatitis','',
 'Explain allergic contact dermatitis, including haptens and the induction and elicitation phases.',
 P('<b>Haptens:</b> certain occupational and other antigens are not immunogenic alone but are highly reactive molecules that bind skin and tissue proteins; the hapten–carrier complex is immunogenic.') +
 T(['Phase','Events'],[
  ['Induction','Langerhans cells present the hapten–carrier complex with MHC II to T lymphocytes (usually months after exposure to small amounts)'],
  ['Elicitation','On re-exposure, effector T cells migrate to the skin and meet the complex presented by Langerhans cells; cytokine release causes inflammation 12–48 hours after contact']]) +
 P('<b>Clinical:</b> erythematous papules and plaques, scaling, fissures, poorly defined margins in the area of exposure; hands most often, also face, lips, eyelids. <b>Histology:</b> spongiosis (oedema separating keratinocytes), lymphocyte exocytosis, superficial perivascular infiltrate with eosinophils. <b>Management:</b> avoid allergen, patch test to confirm, emollients, mild topical steroids.'));

C('l5a-08','L5A','Oral contact allergy','',
 'A patient has burning, erythema and a white lichenoid patch on the mucosa touching an amalgam. What is the mechanism, which materials commonly cause oral contact allergy, and how is it managed?',
 LEAD('Type IV oral contact allergy, here presenting as an oral lichenoid reaction.') +
 P('<b>Symptoms:</b> burning, stinging, tingling, dry mouth, altered taste. <b>Signs:</b> erythema, oedema, desquamation, ulceration of tongue, gingiva or lining mucosa; cheilitis, perioral inflammation.') +
 T(['Group','Examples'],[
  ['Restorative materials','Amalgam, mercury, resins, acrylics, metals (gold, nickel, chromium-cobalt, palladium)'],
  ['Flavourings','Cinnamon, peppermint, spearmint, fragrance mix, balsam of Peru'],
  ['Toothpaste components','Cocamidopropyl betaine, propylene glycol, parabens, sodium laureth sulphate, triclosan']]) +
 P('<b>Diagnosis:</b> temporal relationship to exposure, examination, patch testing. <b>Treatment:</b> replace the restoration, change oral hygiene products, topical steroids if needed.'));

C('l5a-09','L5A','Chlorhexidine and toothpaste','',
 'Which hypersensitivity types can chlorhexidine cause? What is the commonest presentation of toothpaste allergy, and how is it best confirmed?',
 P('<b>Chlorhexidine</b> causes both <b>type I</b> (anaphylaxis, with deaths after socket irrigation: adrenaline and an ambulance) and <b>type IV</b> (contact allergy).') +
 P('<b>Toothpaste allergy</b> is uncommon now. The commonest presentation is <b>cheilitis</b> (dry, red, swollen, cracked lips, angular cheilitis), sometimes without intraoral signs. Flavourings are the commonest allergens. Patch testing supports but may not confirm the diagnosis; the <b>stop–restart method</b> is best.'));

/* =================== L5B — Autoimmunity and transplantation =================== */
C('l5b-01','L5B','Autoimmunity vs autoimmune disease','',
 'Define autoimmunity and autoimmune disease. How can autoimmunity exist without disease?',
 T(['Autoimmunity','Autoimmune disease'],[['An immune response against a self (auto)-antigen or antigens','Tissue damage or disturbed physiological function resulting from an autoimmune response']]) +
 P('<b>Autoimmune responses can occur without disease.</b> Some self-reactive lymphocytes escape into the circulation in everyone and are normally held in check (peripheral tolerance); low-level autoantibodies are common and harmless. Disease needs a sustained response strong enough to damage tissue, usually genetic susceptibility plus an environmental trigger.') +
 P('That is why a positive ANA alone does not diagnose SLE.') +
 BEYOND(''));

C('l5b-02','L5B','Proof and patterns','',
 'How do we show that autoimmunity causes a disease? Distinguish organ-specific from non-organ-specific autoimmune disease.',
 P('<b>Evidence:</b>') +
 OL(['Demonstrate immunological reactivity to a self-antigen.','Characterise or isolate the inciting autoantigen.','Induce reactivity against the same antigen by immunising experimental animals.','Show similar pathological changes in the organs of the sensitised animal.']) +
 T(['Organ-specific','Non-organ-specific'],[
  ['Single organ, commonly an endocrine gland; autoantibody may target a cell-surface or intracellular molecule','Multiple organs; self-antigen widely distributed, particularly intracellular molecules involved in transcription and translation (e.g. SLE)']]));

C('l5b-03','L5B','Epidemiology and aetiology','',
 'Summarise the epidemiology and aetiology of autoimmune disease.',
 P('<b>Epidemiology:</b> about 3% of the population; chronic disabling examples are multiple sclerosis, rheumatoid arthritis, type 1 diabetes; peak onset 15–65 years; almost all more common in women, except ankylosing spondylitis.') +
 T(['Factor','Detail'],[
  ['Genetic','Usually many genes; some single-gene defects of apoptosis; strongest associations with MHC (HLA) alleles'],
  ['Hormones','Female predominance; onset in reproductive years; removing ovaries in animal models of SLE inhibits onset'],
  ['Infection','Molecular mimicry (microbial antigen resembles self); infection also up-regulates co-stimulatory molecules and alters antigen presentation'],
  ['Drugs','Drug–self complex resembles self and bypasses tolerance; some drugs bind the MHC groove directly. HLA-DR2: penicillamine-induced myasthenia; DR3: nephritis. Slow acetylators prone to SLE'],
  ['UV radiation','Modifies self-antigens; causes apoptosis in skin, exposing normally intracellular autoantigens on the cell surface']]));

C('l5b-04','L5B','Mechanisms and Sjögren syndrome','',
 'How do autoimmune diseases damage tissue? Describe Sjögren syndrome and its dental relevance.',
 P('<b>Mechanisms:</b> antibody or immune complexes; CD4 T-cell activation of macrophages or cytotoxic T cells; or a combination. Autoantibodies can bind functional sites such as hormone receptors, neurotransmitter receptors and plasma proteins.') +
 P('<b>Sjögren syndrome:</b> CD4 T-cell reactions against unknown antigens in the ductal epithelium of exocrine glands (salivary, lacrimal), so glands are infiltrated and destroyed, causing dry mouth and dry eyes. Most primary cases have autoantibodies to <b>SS-A (Ro)</b> and <b>SS-B (La)</b>.') +
 P('<b>Treatment of autoimmune disease:</b> replace organ function; immune suppression.') +
 BEYOND('Xerostomia brings caries (especially root and cervical), candidiasis, denture problems and difficulty swallowing; there is an increased risk of B-cell lymphoma, so new persistent gland swelling needs investigating.'));

C('l5b-05','L5B','Transplant vocabulary and MHC','',
 'Define haplotype, allele, allogeneic, autologous and xenogeneic. Where are MHC class I, II and III found?',
 T(['Term','Meaning'],[
  ['Haplotype','A group of genes inherited together from a single parent'],
  ['Allele','A variant form of a gene'],
  ['Allogeneic','Between genetically dissimilar individuals of the same species'],
  ['Autologous','From one part of one\'s own body to another'],
  ['Xenogeneic','Across a species barrier (e.g. pig to human)']]) +
 P('Human MHC antigens are called <b>HLA</b>; extensive polymorphism and co-dominant expression. <b>Class I:</b> most nucleated cells. <b>Class II:</b> antigen-presenting cells. <b>Class III:</b> complement components C2 and C4.'));

C('l5b-06','L5B','How grafts are rejected','',
 'Describe the afferent and effector phases of graft rejection.',
 T(['Phase','Events'],[
  ['Afferent (initiation, sensitisation)','Allorecognition: MHC molecules on donor dendritic cells are recognised by the recipient\'s CD4 T cells, in the graft or in recipient lymphoid organs'],
  ['Effector','CD4 T cells enter the graft and recruit effector cells with IL-2 and IFN-γ: macrophages, CD8 T cells, NK cells, B cells. Targets: endothelium and parenchymal cells']]));

C('l5b-07','L5B','Types of rejection','',
 'Compare hyperacute, acute and chronic rejection of a kidney graft.',
 T(['','Hyperacute','Acute','Chronic'],[
  ['Timing','Minutes to hours after revascularisation','Days to weeks','Months to years'],
  ['Mechanism','Circulating cytotoxic antibody against donor MHC class I; complement, platelet aggregation, neutrophils, vessel obstruction','Increased MHC I and II expression; early CD8 T-cell and NK infiltration; mononuclear infiltrate and necrosis of arterial walls','Lecture: not thought to be immunologically mediated'],
  ['Result','Infarction, anuria; kidney must be removed','Reversed by immunosuppressive treatment','Slowly progressive renal failure and hypertension; no response to immunosuppression']]) +
 FLAG('Current texts (e.g. Robbins) describe chronic rejection as immune-driven (ongoing T-cell and antibody responses causing graft vessel narrowing and fibrosis). Give the lecture\'s wording in the exam.'));

C('l5b-08','L5B','Immunosuppression complications','',
 'What complications of long-term immunosuppression matter for a transplant patient?',
 T(['Complication','Detail'],[
  ['Infection','Viral (mainly CMV); opportunistic fungal (e.g. <i>Cryptococcus</i>)'],
  ['Malignancy','About 40 times higher incidence: Kaposi sarcoma, lymphoma'],
  ['Acute myocardial infarction','From hypertension, hypertriglyceridaemia, insulin-resistant diabetes aggravated by steroids']]) +
 BEYOND('Dental: oral candidiasis and viral lesions, post-extraction infection and poor healing, ciclosporin-associated gingival overgrowth, lip cancer; examine the mucosa carefully.'));

C('l5b-09','L5B','HSCT and GvHD','',
 'What are the complications of haemopoietic stem-cell transplantation, and how does chronic graft-versus-host disease present in the mouth?',
 P('<b>HSCT complications:</b> failure of engraftment, infection, graft-versus-host disease. Graft rejection is common.') +
 P('<b>GvHD:</b> immunocompetent donor T cells recognise the recipient\'s tissues as foreign and attack them (rejection in reverse).') +
 T(['Oral chronic GvHD','Features'],[['Mucosa','Erythema, lichenoid lesions, ulceration, mucoceles'],['Salivary glands','Dysfunction, dry mouth'],['Sclerosis','Oral fibrosis with limited mouth opening']]));

/* =================== L5C — Immunodeficiency =================== */
C('l5c-01','L5C','Primary vs secondary','',
 'Define immune deficiency and distinguish primary from secondary, with examples. How do these patients present?',
 T(['','Primary','Secondary'],[
  ['Cause','Intrinsic defect in the immune system','Due to another underlying condition'],
  ['Examples','Antibody deficiency, cell-mediated defects, chronic granulomatous disease, complement deficiency','HIV/AIDS, immunosuppressive drugs (transplant, steroids, chemotherapy), leukaemia and lymphoma, malnutrition, diabetes']]) +
 P('Patients present with infections that are <b>severe, persistent, unusual and recurrent</b>.') +
 HOOK('SPUR: Severe, Persistent, Unusual, Recurrent.') +
 P('Tutorial 5c MCQs: immune deficiency = defects in immune system function; primary = an intrinsic defect in the immune system.'));

C('l5c-02','L5C','Four primary categories','',
 'Name the four categories of primary immune deficiency and the infections each tends to cause.',
 T(['Category','Typical infections'],[
  ['Antibody deficiency','Recurrent pyogenic bacterial infections (sinusitis, otitis, pneumonia)'],
  ['Cell-mediated (T-cell) defect','Viruses, fungi (<i>Candida</i>), intracellular organisms'],
  ['Phagocyte defect','Staphylococcal and fungal infections of skin and mucosa, abscesses'],
  ['Complement deficiency','Pyogenic and <i>Neisseria</i> infections; C1-inhibitor deficiency causes hereditary angioedema']]) +
 BEYOND(''));

C('l5c-03','L5C','Phagocyte defects and CGD','',
 'What are the clinical features of phagocyte defects? Explain chronic granulomatous disease.',
 P('<b>Phagocyte defects</b> (neutropenia or neutrophil dysfunction): recurrent and persistent infections; severe infection with <b>minimal clinical features</b> (few neutrophils to make pus); poorly responsive to antibiotics; commonly staphylococcal; skin and mucous membranes; complicated by suppurative lymphadenopathy.') +
 P('<b>Chronic granulomatous disease:</b> failure to produce a functional <b>NADPH oxidase</b>, so phagocytes cannot generate the burst of toxic oxygen radicals needed to kill ingested microbes.') +
 UL(['Presents in the first 3 months of life: severe skin sepsis (<i>Staphylococcus aureus</i>) or fungal infection (<i>Candida albicans</i>, <i>Aspergillus fumigatus</i>).',
     'Complications: regional lymphadenopathy, hepatosplenomegaly, hepatic abscesses, osteomyelitis.',
     'Organs show multiple abscesses and <b>non-caseating giant-cell granulomas</b>.']) +
 LINK('L3B: granulomas form when macrophages cannot destroy what they have engulfed.'));

C('l5c-04','L5C','Hereditary angioedema','',
 'A patient reports episodes of lip and throat swelling without hives, one of them after a dental extraction. Why is this not type I hypersensitivity, and why does it matter to a dentist?',
 P('This suggests <b>hereditary angioedema</b>, a primary complement deficiency: lack of functional C1-esterase inhibitor lets bradykinin build up, causing non-itchy swelling of face, lips, gut and larynx. It is not IgE- or histamine-mediated, so there is no urticaria and adrenaline and antihistamines work poorly.') +
 P('Dental trauma (extractions, even long procedures) can trigger laryngeal oedema, so these patients need specialist prophylaxis before treatment.') +
 BEYOND(''));

C('l5c-h3','L5C','HIV: entry and replication','hiv',
 'How does HIV enter a cell and replicate?',
 OL(['<b>Binding:</b> the envelope glycoprotein <b>gp120</b> binds mainly the <b>CD4</b> molecule (helper T cells).',
     '<b>Co-receptor:</b> it also uses chemokine receptors <b>CCR5 and CXCR4</b> (lecture: macrophages, CNS glial cells, gut epithelial cells).',
     '<b>Fusion:</b> viral and cell membranes fuse; the RNA genome enters.',
     '<b>Reverse transcription:</b> reverse transcriptase copies viral RNA into DNA. It is error-prone, so mutations accumulate.',
     '<b>Integration:</b> the viral DNA (provirus) is inserted into the host genome and can lie latent.',
     '<b>Production:</b> when the cell is activated, new viral proteins are made, cut by viral protease and assembled into virions that bud off.']) +
 P('HIV makes <b>10<sup>9</sup>–10<sup>10</sup> new virions per day</b>, with up to <b>10<sup>8</sup> new mutants per day</b>.') +
 BEYOND(''));

C('l5c-h4','L5C','HIV: CD4 loss and its effects','hiv',
 'How does HIV deplete CD4 T cells, and why does that cripple the whole immune system?',
 P('<b>How CD4 cells are lost:</b> direct killing by viral replication and budding; apoptosis of infected and uninfected bystander cells; destruction of infected cells by CD8 cytotoxic T cells; damage to lymphoid tissue.') +
 P('<b>Why it matters:</b> the CD4 helper cell is the master regulator (L3B). Without it:') +
 UL(['CD8 cells kill virus-infected cells poorly.','B cells make poor specific antibody.','Macrophages are not activated (no IFN-γ) and cannot kill intracellular organisms.']) +
 P('Result: opportunistic infections, reactivation of latent viruses (HSV, CMV, EBV) and virus-driven tumours (Kaposi sarcoma, lymphoma). AIDS is usually defined by a CD4 count below 200 cells/µL (normal roughly 500–1500) or an AIDS-defining illness.') +
 BEYOND(''));

C('l5c-h5','L5C','HIV: clinical stages','hiv',
 'Describe the clinical spectrum of HIV infection as taught in the lecture (stages 1–4).',
 T(['Stage','Features'],[
  ['1','Transient acute glandular-fever-like illness in 10–20%, within a few weeks of infection; precedes seroconversion'],
  ['2','Asymptomatic (virus still replicating in lymphoid tissue)'],
  ['3','Persistent generalised lymphadenopathy: enlarged nodes at 2 or more extra-inguinal sites for at least 3 months'],
  ['4','AIDS-related complex (unexplained lymphadenopathy, diarrhoea, night sweats, oral candidiasis, weight loss); neurological disease; opportunistic infections; tumours']]) +
 FLAG('The lecture calls these "WHO stages", but they follow the older Underwood\'s/CDC scheme. Current WHO staging runs from 1 (asymptomatic) to 4 (severe); persistent oral candidiasis and hairy leukoplakia are WHO stage 3. Many texts also put the acute illness at over half of infections, not 10–20%. Use the lecture\'s version in the exam.'));

C('l5c-h6','L5C','HIV: nervous system','hiv',
 'Why is HIV described as neurotropic, and what neurological disease does it cause?',
 P('Neurotropic = localising selectively in nervous tissue.') +
 UL(['<b>At seroconversion:</b> acute aseptic meningitis, encephalopathy, myelopathy, neuropathy.',
     '<b>Later:</b> chronic meningitis, cerebral lymphoma, encephalopathy and dementia (in 70% of AIDS patients, per lecture).']) +

C('l5c-h7','L5C','HIV: opportunistic infections and tumours','hiv',
 'List the opportunistic infections and tumours of AIDS, with the virus behind each tumour.',

C('l5c-h8','L5C','HIV: oral manifestations','hiv',
 'Name the key oral manifestations of HIV and describe how to recognise each.',
 T(['Lesion','Recognise it by'],[
  ['Erythematous candidosis','Red patches, typically palate and dorsum of tongue'],
  ['Pseudomembranous candidosis','White plaques that wipe off, leaving a red base'],
  ['Oral hairy leukoplakia','EBV; white, corrugated plaques on the lateral tongue, often both sides; do not wipe off'],
  ['Herpes simplex','Extensive, persistent or recurrent ulceration'],
  ['Necrotising ulcerative gingivitis / periodontitis','Punched-out necrotic papillae, pain, bleeding, halitosis; periodontitis adds rapid attachment and bone loss'],
  ['Kaposi sarcoma','Red-purple patches or nodules, commonly palate or gingiva']]) +
 P('The lecture\'s four images: erythematous candidosis, hairy leukoplakia, herpes simplex, necrotising ulcerative periodontitis. Any of these unexpectedly in a young, otherwise well patient warrants sensitive discussion and referral for testing.') +
 BEYOND(''));

C('l5c-h9','L5C','HIV: treatment','hiv',
 'How is HIV managed? Why is combination therapy used, and why has a vaccine proved so difficult?',
 P('<b>Antiretroviral therapy (ART / HAART):</b> a combination of drugs attacking different steps.') +
 T(['Drug class','Action'],[
  ['Entry inhibitors','Bind CCR5'],
  ['Fusion inhibitors','Block HIV–cell membrane fusion'],
  ['Reverse transcriptase inhibitors','Stop viral RNA being copied into DNA'],
  ['Protease inhibitors','Prevent assembly of new virions']]) +
 P('<b>Why combine:</b> with up to 10<sup>8</sup> mutants a day, resistance to a single drug appears fast; the virus would need several simultaneous mutations to escape a combination.') +
 P('<b>Why no vaccine:</b> the envelope is fragile and a poor immunogen, and the high mutation rate leaves no stable epitope.') +
 BEYOND('Integrase inhibitors are now central to first-line ART. With sustained undetectable viral load, HIV is not transmitted sexually ("undetectable = untransmittable").'));

C('l5c-h10','L5C','Needle-stick injury','hiv',
 'You sustain a needle-stick injury from a patient known to have HIV. What is your risk, and what do you do?',
 P('<b>Risk</b> about 0.3% per percutaneous exposure; higher with a deep injury, visible blood on the device, a hollow needle that was in a vessel, or a source with high viral load; negligible if the source\'s viral load is undetectable.') +
 OL(['Wash immediately with soap and running water; do not scrub. Rinse eye or mouth splashes with water.',
     'Report it and document it.',
     'Risk-assess the source (status, viral load) and test with consent.',
     'Baseline blood tests for yourself (HIV, hepatitis B and C).',
     '<b>Post-exposure prophylaxis</b> (28 days of antiretrovirals) as soon as possible, ideally within hours and no later than 72 hours.',
     'Follow-up testing.']) +
 BEYOND(''));
