<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOH 233 exam recall: Lectures 1 to 5c</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F2F7; --glass:#FFFFFF; --ink:#221C33; --muted:#655D78; --rule:#DED7E7;
  --haem:#4B3D93; --haem-ink:#FFFFFF; --haem-wash:#ECE8F7;
  --eosin:#C23E6C; --eosin-wash:#FCF1F5;
  --good:#2C7A60; --good-wash:#E6F3EE; --warn:#9C5F12; --warn-wash:#FBF2E4; --bad:#B3334C; --bad-wash:#FBE9ED;
  --frost:#EEEAF3; --frost-dot:rgba(34,28,51,.10); --coverslip:rgba(75,61,147,.14);
  --shadow:rgba(34,28,51,.28);
  --serif:'Literata', Georgia, 'Times New Roman', serif;
  --sans:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15121D; --glass:#1E1A29; --ink:#ECE8F3; --muted:#A9A1BA; --rule:#352E46;
    --haem:#B0A4F4; --haem-ink:#15121D; --haem-wash:#28223D;
    --eosin:#F283A9; --eosin-wash:#2A1A24;
    --good:#72CCA9; --good-wash:#16271F; --warn:#E5AE62; --warn-wash:#2A2014; --bad:#F2879A; --bad-wash:#2C181D;
    --frost:#262134; --frost-dot:rgba(236,232,243,.08); --coverslip:rgba(176,164,244,.16);
    --shadow:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15121D; --glass:#1E1A29; --ink:#ECE8F3; --muted:#A9A1BA; --rule:#352E46;
  --haem:#B0A4F4; --haem-ink:#15121D; --haem-wash:#28223D;
  --eosin:#F283A9; --eosin-wash:#2A1A24;
  --good:#72CCA9; --good-wash:#16271F; --warn:#E5AE62; --warn-wash:#2A2014; --bad:#F2879A; --bad-wash:#2C181D;
  --frost:#262134; --frost-dot:rgba(236,232,243,.08); --coverslip:rgba(176,164,244,.16);
  --shadow:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top, 0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
.wrap{max-width:920px;margin:0 auto;padding:28px 20px 64px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--haem);outline-offset:2px}
kbd{font-family:var(--sans);font-size:.72rem;font-weight:600;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7;margin-left:4px}

/* masthead */
.mast{display:flex;flex-direction:column;gap:18px;margin-bottom:18px}
.hub{display:inline-block;font-size:.86rem;font-weight:600;color:var(--haem);text-decoration:none;margin-bottom:10px}
.hub:hover{text-decoration:underline;text-underline-offset:3px}
.mast h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem, 4.6vw, 2.7rem);line-height:1.08;letter-spacing:-.01em;margin:0;font-variation-settings:'opsz' 72}
.mast .sub{margin:8px 0 0;color:var(--muted);max-width:62ch;font-size:.97rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;font-weight:600;font-size:1rem;color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--haem);border-bottom-color:var(--haem)}
.tab:hover{color:var(--ink)}

/* filters */
.filters{display:flex;flex-direction:column;gap:10px;margin:16px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rowlabel{font-size:.86rem;color:var(--muted);margin-right:4px}
.chip{appearance:none;border:1px solid var(--rule);background:var(--glass);border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:500;cursor:pointer;line-height:1.3}
.chip:hover{border-color:var(--haem)}
.chip[aria-pressed="true"]{background:var(--haem);border-color:var(--haem);color:var(--haem-ink)}
.chip-focus[aria-pressed="false"]{border-color:color-mix(in srgb, var(--eosin) 45%, var(--rule))}
.chip-focus[aria-pressed="true"]{background:var(--eosin);border-color:var(--eosin);color:#fff}
:root[data-theme="dark"] .chip-focus[aria-pressed="true"]{color:#15121D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip-focus[aria-pressed="true"]{color:#15121D}}
.search input{width:100%;max-width:420px;font:inherit;font-size:.95rem;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--glass);color:var(--ink)}

/* tally */
.tally{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:6px 0 22px}
.tbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--rule);flex:1 1 100%}
.tbar .seg{flex-basis:0;min-width:0}
.seg-got{background:var(--good)} .seg-shaky{background:var(--warn)} .seg-missed{background:var(--bad)} .seg-un{background:var(--rule)}
.tleg{margin:0;font-size:.86rem;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.tleg .li{white-space:nowrap;margin-right:12px}
.tleg b{color:var(--ink);font-weight:600}
.tleg .tscope{margin-left:2px}
.k{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.k-got{background:var(--good)} .k-shaky{background:var(--warn)} .k-missed{background:var(--bad)} .k-un{background:var(--rule)}
.linkbtn{appearance:none;background:none;border:0;padding:2px 0;color:var(--haem);font-size:.86rem;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.reset{margin-left:auto;color:var(--muted)}

/* buttons */
.btn{appearance:none;border:1px solid var(--rule);background:var(--glass);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.92rem;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--haem)}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--haem);border-color:var(--haem);color:var(--haem-ink)}
.btn-primary:hover:not(:disabled){filter:brightness(1.08)}
.btn-wide{width:100%;padding:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* bank */
.bank-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.seg-mini{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg-mini button{appearance:none;border:0;background:var(--glass);padding:6px 12px;font-size:.88rem;font-weight:500;cursor:pointer;border-right:1px solid var(--rule)}
.seg-mini button:last-child{border-right:0}
.seg-mini button[aria-pressed="true"]{background:var(--haem-wash);color:var(--haem);font-weight:700}
.check{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer}
.check input{accent-color:var(--haem);width:16px;height:16px}
.count{color:var(--muted);font-size:.88rem;margin-left:auto}
.grp{margin-bottom:28px}
.grp-h{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule);font-variation-settings:'opsz' 40}
.grp-code{color:var(--haem)}
.item{display:grid;grid-template-columns:58px 1fr;background:var(--glass);border:1px solid var(--rule);border-radius:8px;margin-bottom:10px;overflow:hidden}
.item-label{background-color:var(--frost);background-image:radial-gradient(var(--frost-dot) .8px, transparent .9px);background-size:3px 3px;border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px}
.item-label .code{font-family:var(--serif);font-weight:600;font-size:.98rem;color:var(--haem)}
.item-label .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--rule)}
.item.is-got .dot{background:var(--good);border-color:var(--good)}
.item.is-shaky .dot{background:var(--warn);border-color:var(--warn)}
.item.is-missed .dot{background:var(--bad);border-color:var(--bad)}
.item-body{padding:12px 16px 14px;min-width:0}
.meta{margin:0 0 4px;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pred{display:inline-flex;align-items:center;gap:5px;color:var(--eosin);font-weight:600}
.pred i{width:7px;height:7px;border-radius:50%;background:var(--eosin);display:inline-block}
.stype{border:1px solid var(--rule);border-radius:4px;padding:0 5px;font-weight:600}
.q{font-family:var(--serif);font-weight:500;font-size:1.06rem;line-height:1.45;margin:0 0 10px;font-variation-settings:'opsz' 18}
.btn-reveal{padding:5px 12px;font-size:.86rem}

/* answer typography */
.ans{font-family:var(--serif);font-size:.98rem;line-height:1.6;margin-top:12px;padding:14px 16px;background:var(--eosin-wash);border-left:3px solid var(--eosin);border-radius:0 6px 6px 0;font-variation-settings:'opsz' 14}
.ans p{margin:0 0 .6em}
.ans ul,.ans ol{margin:.2em 0 .7em;padding-left:1.3em}
.ans li{margin-bottom:.25em}
.ans .lead{font-weight:600}
.ans b{font-weight:650}
.tw{overflow-x:auto;margin:.3em 0 .8em;-webkit-overflow-scrolling:touch}
.tbl{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:.88rem;line-height:1.45;min-width:420px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule)}
.tbl thead th{font-weight:700;color:var(--haem);border-bottom:1.5px solid var(--haem)}
.tbl tbody th{font-weight:600}
.hook,.flag,.link,.beyond{font-family:var(--sans);font-size:.87rem;line-height:1.5;padding:8px 10px;border-radius:6px;margin:.6em 0 .4em}
.hook span,.flag span,.link span,.beyond span{font-weight:700;margin-right:4px}
.hook{background:var(--glass);border:1px solid color-mix(in srgb, var(--eosin) 40%, var(--rule))}
.hook span{color:var(--eosin)}
.flag{background:var(--warn-wash);border:1px solid color-mix(in srgb, var(--warn) 45%, var(--rule))}
.flag span{color:var(--warn)}
.link{background:var(--haem-wash);border:1px solid color-mix(in srgb, var(--haem) 30%, var(--rule))}
.link span{color:var(--haem)}
.beyond{background:transparent;border:1px dashed var(--rule);color:var(--muted)}
.beyond span{color:var(--ink)}
.beyond-tag{font-family:var(--sans);font-size:.76rem;color:var(--muted);margin:.6em 0 0;display:inline-block;border:1px dashed var(--rule);border-radius:4px;padding:1px 6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pts-h{font-family:var(--sans);font-size:.84rem;font-weight:700;color:var(--haem);margin:.8em 0 .4em}
.pts-h:first-child{margin-top:0}
.pts-plain{font-family:var(--sans);font-size:.9rem}

.grades{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-family:var(--sans)}
.grades-label{font-size:.84rem;color:var(--muted);margin-right:4px}
.gbtn{appearance:none;border:1.5px solid var(--rule);background:var(--glass);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.88rem;cursor:pointer}
.g-missed,.g-again{color:var(--bad)} .g-shaky,.g-hard{color:var(--warn)} .g-got,.g-easy{color:var(--good)} .g-good{color:var(--haem)}
.g-missed:hover,.g-again:hover,.g-missed[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-wash)}
.g-shaky:hover,.g-hard:hover,.g-shaky[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-wash)}
.g-got:hover,.g-easy:hover,.g-got[aria-pressed="true"]{border-color:var(--good);background:var(--good-wash)}
.g-good:hover{border-color:var(--haem);background:var(--haem-wash)}
.grades-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:0}
.grades-4 .gbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px}
.grades-4 small{font-weight:500;color:var(--muted);font-size:.78rem}

/* the glass slide */
.slide{display:grid;grid-template-columns:118px 1fr;background:var(--glass);border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:0 1px 0 var(--rule), 0 22px 44px -30px var(--shadow)}
.slide:focus{outline:none}
.slide:focus-visible{outline:2px solid var(--haem);outline-offset:3px}
.slide-label{background-color:var(--frost);background-image:radial-gradient(var(--frost-dot) .8px, transparent .9px);background-size:3px 3px;border-right:1px solid var(--rule);padding:22px 14px;display:flex;flex-direction:column;gap:8px}
.slide-label .code{font-family:var(--serif);font-weight:650;font-size:2.1rem;line-height:1;color:var(--haem);font-variation-settings:'opsz' 72}
.slide-label .lname{font-size:.8rem;line-height:1.35;color:var(--muted)}
.slide-label .pred{font-size:.78rem;margin-top:4px}
.specimen{position:relative;padding:30px 34px 28px;min-height:280px;min-width:0}
.specimen::before{content:"";position:absolute;inset:12px;border:1px solid var(--coverslip);border-radius:4px;pointer-events:none}
.fq{font-family:var(--serif);font-weight:500;font-size:clamp(1.2rem, 2.6vw, 1.45rem);line-height:1.4;margin:6px 0 0;max-width:48ch;font-variation-settings:'opsz' 32}
.slide-scen .fq{max-width:62ch;font-size:clamp(1.05rem, 2.2vw, 1.2rem)}
.ans-flash{margin-top:22px;animation:stain .28s ease-out}
@keyframes stain{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.ans-flash{animation:none}}
.fs-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px}
.fs-count{margin:0;color:var(--muted);font-size:.9rem}
.fs-count b{color:var(--ink)}
.fs-ctl{margin-top:14px}

/* setup and guide panels */
.setup,.guide,.mockbox{background:var(--glass);border:1px solid var(--rule);border-radius:10px;padding:22px 24px;margin-bottom:16px}
.h2{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:0 0 6px;font-variation-settings:'opsz' 40}
.note{color:var(--muted);margin:0 0 14px;font-size:.93rem;max-width:66ch}
.seg-ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;max-width:520px}
.segbtn{appearance:none;text-align:center;border:1.5px solid var(--rule);background:var(--paper);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.segbtn small{color:var(--muted);font-size:.8rem;line-height:1.35}
.segbtn[aria-pressed="true"]{border-color:var(--haem);background:var(--haem-wash)}
.setup .check{display:flex;width:max-content;margin-bottom:14px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2px 16px;margin-top:18px;padding-top:14px;border-top:1px solid var(--rule);font-size:.85rem;color:var(--muted)}
.keys p{margin:2px 0}
.keys kbd{margin:0 6px 0 0}
.guide-steps{margin:8px 0 0;padding-left:1.3em;font-family:var(--serif);max-width:68ch}
.guide-steps li{margin-bottom:.35em}
.setup.mockbox{background:none;border:0;padding:0;margin-bottom:14px}
.scen-list{margin-top:4px}
.muted{color:var(--muted);font-weight:400;font-family:var(--sans);font-size:.9rem}
.scen-list{display:flex;flex-direction:column;gap:8px}
.scen-item{appearance:none;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:start;text-align:left;background:var(--glass);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;cursor:pointer}
.scen-item:hover{border-color:var(--haem)}
.scen-item .code{font-family:var(--serif);font-weight:650;color:var(--haem)}
.scen-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.scen-q{font-family:var(--serif);font-size:.96rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.best{font-size:.8rem;font-weight:600;color:var(--good);white-space:nowrap}
.best.muted{color:var(--muted);font-weight:500}
.scen-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:10px}
.scen-pos{color:var(--muted);font-size:.9rem}
.timer{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem;color:var(--haem);background:var(--haem-wash);border-radius:6px;padding:3px 10px}
.timer.low{color:var(--bad);background:var(--bad-wash)}
.timer.done{font-size:.88rem;color:var(--good);background:var(--good-wash)}
.ta-label{display:block;font-weight:600;font-size:.88rem;margin:20px 0 6px}
.ta{margin-top:18px;width:100%;font-family:var(--serif);font-size:.98rem;line-height:1.55;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical;min-height:180px}
.wc{margin:4px 0 0;font-size:.8rem;color:var(--muted);text-align:right}
.mark{margin-top:14px}
.checklist{margin-top:14px;padding:14px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.pt{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:.93rem}
.pt:last-of-type{border-bottom:0}
.pt input{accent-color:var(--good);width:17px;height:17px;margin-top:3px;flex:none}
.score{margin:10px 0 0;font-size:.95rem}
.score b{font-size:1.2rem;color:var(--good)}
.scen-nav{justify-content:flex-start}
.empty{color:var(--muted);padding:20px 0}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--rule);font-size:.82rem;color:var(--muted);max-width:70ch}

@media (max-width: 640px){
  .wrap{padding:18px 14px 48px}
  .tab{flex:1 1 auto;padding:10px 6px 9px;font-size:.9rem;text-align:center}
  .in-session .filters,.in-session .tally{display:none}
  .tbl{min-width:0}
  .tbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tbl tr{display:block;padding:8px 0;border-bottom:1px solid var(--rule)}
  .tbl th,.tbl td{display:block;border:0;padding:2px 0}
  .tbl tbody th{color:var(--haem)}
  .tbl td[data-label]:not([data-label=""])::before{content:attr(data-label) ": ";font-weight:600;color:var(--muted)}
  .slide{grid-template-columns:1fr}
  .slide-label{flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:4px 10px;border-right:0;border-bottom:1px solid var(--rule);padding:12px 16px}
  .slide-label .code{font-size:1.5rem}
  .specimen{padding:22px 20px 20px;min-height:220px}
  .specimen::before{inset:8px}
  .item{grid-template-columns:44px 1fr}
  .grades-4{grid-template-columns:repeat(2,1fr)}
  .count{margin-left:0;flex-basis:100%}
  .scen-item{grid-template-columns:40px 1fr}
  .scen-item .best{grid-column:2}
  .reset{margin-left:0}
}
.tab .short{display:none}
@media (max-width: 420px){.tab .long{display:none}.tab .short{display:inline}}
@media print{
  .tabs,.filters,.tally,.bank-tools,.btn-reveal,.grades{display:none}
  .ans[hidden]{display:block !important}
  .item{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <a class="hub" href="index.html">Study hub</a>
      <h1>DOH 233 exam recall</h1>
    </div>
    <div class="tabs" role="tablist" aria-label="Study mode">
      <button class="tab" role="tab" data-tab="bank" aria-controls="view-bank">Question bank</button>
      <button class="tab" role="tab" data-tab="flash" aria-controls="view-flash">Flashcards</button>
      <button class="tab" role="tab" data-tab="scen" aria-controls="view-scen"><span class="long">Exam scenarios</span><span class="short">Scenarios</span></button>
    </div>
  </header>

  <section class="filters" aria-label="Filters">
    <div class="row" id="lecRow" role="group" aria-label="Lecture"></div>
    <div class="row" id="focusRow" role="group" aria-label="Predicted topics"></div>
    <div class="row search"><input type="search" id="q" placeholder="Search" aria-label="Search"></div>
  </section>

  <section class="tally" id="tally" aria-label="Progress"></section>

  <main>
    <section id="view-bank" class="view" role="tabpanel" aria-label="Question bank">
      <div class="bank-tools">
        <div class="seg-mini" id="bankType" role="group" aria-label="Question type">
          <button type="button" data-v="all">Both</button>
          <button type="button" data-v="cards">Cards</button>
          <button type="button" data-v="scen">Scenarios</button>

        <button type="button" class="linkbtn" id="revealAll">Show all answers</button>

      <div id="flashArea"></div>

      <div id="scenArea"></div>
    </section>
  </main>

</div>
<script>
/* ---------- content helpers ---------- */
function T(head, rows){
  var h = '<div class="tw"><table class="tbl"><thead><tr>' + head.map(function(x){return '<th>'+x+'</th>';}).join('') + '</tr></thead><tbody>';
  rows.forEach(function(r){ h += '<tr>' + r.map(function(c,i){
    var lab = String(head[i] || '').replace(/<[^>]+>/g,'').replace(/"/g,'&quot;');
    return i===0 ? '<th scope="row">' + c + '</th>' : '<td data-label="' + lab + '">' + c + '</td>';
  }).join('') + '</tr>'; });
  return h + '</tbody></table></div>';
}
function HOOK(t){ return '<p class="hook"><span>Memory hook</span> ' + t + '</p>'; }
function FLAG(t){ return '<p class="flag"><span>Heads up</span> ' + t + '</p>'; }
function LINK(t){ return '<p class="link"><span>Links to</span> ' + t + '</p>'; }
function BEYOND(t){ return t ? '<p class="beyond"><span>Beyond the slides</span> ' + t + '</p>' : '<p class="beyond-tag">Beyond the slides</p>'; }
function UL(a){ return '<ul>' + a.map(function(x){return '<li>'+x+'</li>';}).join('') + '</ul>'; }
function OL(a){ return '<ol>' + a.map(function(x){return '<li>'+x+'</li>';}).join('') + '</ol>'; }
function LEAD(t){ return '<p class="lead">' + t + '</p>'; }
function P(t){ return '<p>' + t + '</p>'; }

var CARDS = [];
function C(id, l, topic, focus, q, a){ CARDS.push({id:id, l:l, t:topic, f:focus||'', q:q, a:a}); }

/* =================== L1 — Introduction to pathology =================== */
C('l1-01','L1','Defining disease','',
 'Define disease, and name the three ways a disease can vary clinically.',
 LEAD('Disease is a state of abnormal structure and/or abnormal function affecting cells, tissues, organs or systems of the body.') +
 P('The lecture gives two further framings: a condition in which normal <b>homeostasis is disturbed</b>, impairing physiological, biochemical or behavioural function; and a <b>recognisable clinical entity</b> with a consistent pattern of symptoms, signs and pathological abnormalities.') +
 P('Disease varies along three axes:') + UL(['<b>Acute or chronic</b>','<b>Localised or systemic</b>','<b>Reversible or irreversible</b>']) +
 HOOK('Gingivitis is localised and reversible; periodontitis is chronic and its attachment loss is irreversible. One mouth, both ends of the axes.'));

C('l1-02','L1','Signs and symptoms','',
 'A patient says their jaw aches and they feel tired. You see facial swelling and measure a temperature of 38.4 °C. Classify each finding.',
 LEAD('Jaw ache and tiredness are symptoms; swelling and fever are signs.') +
 UL(['<b>Symptom</b> = subjective, what the patient experiences and reports (pain, fatigue, nausea).',
     '<b>Sign</b> = objective, what the clinician observes or measures (swelling, erythema, a recorded temperature).',
     '<b>Pathological abnormality</b> = what the tissue shows, e.g. pus on aspiration or a histological finding.']));

C('l1-03','L1','The three core questions','',
 'What are the three core questions pathology asks? Illustrate them with a periapical abscess.',
 LEAD('Aetiology (cause), pathogenesis (mechanism), and morphologic and functional change (what changes and what it means clinically).') +
 T(['Question','Asks','Periapical abscess'],[
  ['Aetiology','What initiated the disease? Genetic, environmental, lifestyle, immune, multifactorial','Bacteria from a necrotic pulp'],
  ['Pathogenesis','How does the cause produce disease? Pathways, host response, progression','Acute inflammation, neutrophil emigration, liquefaction of tissue into pus'],
  ['Morphologic + functional change','What is seen grossly and microscopically, and how function changes','Pus-filled cavity; swelling, pain, tenderness to percussion']]));

C('l1-04','L1','Why pathology matters','',
 'Give four reasons pathology matters in clinical practice.',
 OL(['<b>Accurate diagnosis</b>: turns signs and symptoms into a specific disease entity and reduces misclassification (e.g. benign vs malignant).',
     '<b>Evidence-based treatment</b>: therapy targets the mechanism; disease is stratified by severity, subtype, stage and risk.',
     '<b>Prevention and public health</b>: identifies causes and modifiable risks, enables screening, provides registry data.',
     '<b>Monitoring and prognosis</b>: biomarkers track response; grade and stage predict outcome.']));

C('l1-05','L1','Structure and function','',
 'Explain the relationship between structure and function in pathology.',
 LEAD('Normal structure underpins normal function, so structural change produces predictable functional impairment.') +
 UL(['Example: loss of periodontal attachment (structure) leads to tooth mobility (function).',
     'But functional change can come <b>first</b>, before any visible structural change (e.g. a biochemical defect).',
     'Pathology is the bridge that explains how altered anatomy becomes clinical disease.']));

C('l1-06','L1','Cellular vs molecular pathology','',
 'Compare cellular pathology with molecular pathology.',
 T(['','Cellular pathology','Molecular pathology'],[
  ['Level','Cells and tissues, seen by microscopy','Genes and proteins'],
  ['Core idea','Disease begins in cells; Virchow: <i>omnis cellula e cellula</i> (all cells from pre-existing cells)','The primary lesion may be molecular before any structural change is visible'],
  ['Key events','Cell injury, adaptation, death','DNA sequence change, chromosomal abnormality, epigenetic change, altered gene expression'],
  ['Consequences','Visible tissue change','Abnormal proteins, enzyme blocks, signalling defects, loss of cell-cycle control (neoplasia)'],
  ['Use','Histopathological diagnosis','Explains congenital disease and cancer biology; precision diagnosis and targeted therapy']]) +
 P('Limit of cellular pathology: some diseases show minimal structural change, and functional or biochemical defects can precede visible injury.'));

C('l1-07','L1','Genetic vs environmental causes','',
 'What clues suggest a disease is genetic rather than environmental, and which kinds of study separate the two?',
 P('<b>Clues:</b> age of onset, pattern within families, stability vs reversibility, geographic and temporal distribution, and response to removal of an exposure.') +
 P('<b>Evidence:</b> family aggregation studies, twin concordance, adoption studies and migrant population studies.') +
 P('Most common chronic diseases are <b>multifactorial</b>: several genetic variants plus environmental exposures, with threshold effects. The lecture\'s model: genetic factors, then environmental exposure, then host susceptibility, then cellular and molecular injury, then clinical disease.'));

/* =================== L2 — Cellular responses to stress and injury =================== */
C('l2-01','L2','Regenerative capacity','',
 'Classify cells by their regenerative capacity, with examples of each.',
 T(['Type','Behaviour','Examples'],[
  ['Labile','Divide throughout life','Epithelia (oral mucosa, epidermis, gut lining), haemopoietic and lymphoid cells'],
  ['Stable','Normally quiescent; divide when needed','Hepatocytes, kidney tubules, fibroblasts'],
  ['Permanent','Divide only in fetal life; replaced by scar','Neurons, cardiac muscle, skeletal muscle (limited satellite-cell repair)']]) +
 FLAG('Smooth muscle is listed as <b>stable</b> in L3A and in Robbins, but the L4 slide calls smooth muscle <b>permanent</b> (with vascular smooth muscle the exception). If asked, give stable and note the L4 wording.') +
 LINK('L4: the cell type decides whether tissue heals by regeneration or by scar.'));

C('l2-02','L2','Hypertrophy vs hyperplasia','',
 'Distinguish hypertrophy from hyperplasia, with an example of each. Why does a hypertensive heart enlarge by only one of these?',
 T(['','Hypertrophy','Hyperplasia'],[
  ['Definition','Increase in cell <b>size</b> (more organelles and proteins)','Increase in cell <b>number</b>'],
  ['Needs','Any cell','Cells that can divide (labile or stable)'],
  ['Physiological','Skeletal muscle with exercise','Breast and endometrium under hormones'],
  ['Pathological','Cardiac myocytes in hypertension','Endometrial or benign prostatic hyperplasia']]) +
 P('Cardiac myocytes are <b>permanent</b> cells and cannot divide, so a heart under pressure load can only enlarge by hypertrophy. The gravid uterus shows both (smooth muscle cells enlarge and multiply).'));

C('l2-03','L2','Atrophy','',
 'Define atrophy and give physiological and pathological causes. Why does the residual alveolar ridge atrophy after tooth loss?',
 LEAD('Atrophy is a decrease in the size and/or number of cells.') +
 T(['Physiological','Pathological'],[['Development, ageing','Decreased function (disuse), loss of innervation, loss of blood supply, pressure, lack of nutrition, loss of stimulation']]) +
 P('<b>Residual ridge:</b> once the tooth is gone, the bone loses its functional stimulus (load is no longer transmitted through the periodontal ligament) and resorbs; pressure from a denture adds to it.') +
 P('Mechanism: reduced protein synthesis and increased protein breakdown, with autophagy, so the cell lowers its demands to match reduced supply or stimulation.'));

C('l2-04','L2','Metaplasia','',
 'Define metaplasia. Give two examples and explain why it is an adaptation that comes at a cost.',
 LEAD('Metaplasia is the transformation of one mature (differentiated) tissue type into another, usually one better able to withstand a chronic stress.') +
 UL(['<b>Barrett oesophagus:</b> stratified squamous epithelium replaced by intestinal-type columnar epithelium under chronic acid reflux.',
     '<b>Smoker\'s bronchus:</b> ciliated columnar epithelium replaced by stratified squamous epithelium.']) +
 P('It arises by <b>reprogramming of stem or reserve cells</b>, not by mature cells changing type. It is in principle reversible if the stimulus is removed.') +
 P('<b>The cost:</b> the original function is lost (the smoker loses mucociliary clearance), and if the stimulus persists, the metaplastic field can progress to dysplasia and carcinoma (Barrett oesophagus to adenocarcinoma).'));

C('l2-05','L2','Causes of cell injury','',
 'List the four causes of cell injury given in the lecture, with an example of each.',
 OL(['<b>Physicochemical agents:</b> trauma, heat, ionising radiation, chemicals (e.g. aspirin burn on mucosa).',
     '<b>Biological agents:</b> bacteria, viruses, fungi (e.g. herpes simplex infecting epithelium).',
     '<b>Loss of hormonal or growth-factor stimulation:</b> target tissue atrophies.',
     '<b>Oxygen and glucose deprivation:</b> ischaemia (atherosclerosis) or hypoxia (pneumonia).']));

C('l2-06','L2','Targets of cell injury','',
 'What are the three cellular targets of injury, and which does ischaemia mainly affect?',
 LEAD('Cell and organelle membranes; metabolic pathways; DNA and proteins.') +
 P('These are interdependent, so an insult to one derails the others.') +
 P('<b>Ischaemia</b> hits <b>membranes and metabolic pathways</b> (Tutorial 2 MCQ answer d): ATP falls, ion pumps fail, the cell swells and membranes are damaged.'));

C('l2-07','L2','Ischaemia vs hypoxia','',
 'Why is ischaemia more damaging than hypoxia alone?',
 UL(['<b>Hypoxia</b> = reduced oxygen supply (pneumonia, anaemia). Glucose still arrives, so cells can make some ATP by anaerobic glycolysis.',
     '<b>Ischaemia</b> = reduced blood supply (atherosclerosis). It cuts off oxygen <b>and</b> glucose, and toxic metabolites are not washed away.']) +
 P('So ischaemic injury is faster and more severe.'));

C('l2-08','L2','Reversible injury','',
 'Describe the microscopic changes of reversible cell injury.',
 T(['Change','Cause','Appearance'],[
  ['Hydropic degeneration (cell swelling)','Failure of ion and fluid homeostasis: ATP falls, the Na+/K+ pump fails, sodium and water enter','Swollen cells; the lecture describes a more eosinophilic appearance'],
  ['Fatty change','Accumulation of lipid through dissociation of lipid from protein','Clear vacuoles in the cytoplasm (typically liver)']]) +
 P('Swelling is the first and most common sign of injury. Both changes reverse if the stimulus is removed in time.'));

C('l2-09','L2','Reversible vs irreversible injury','',
 'What marks the transition from reversible to irreversible cell injury?',
 P('Irreversibility follows a persistent or severe stimulus. Two textbook hallmarks mark the "point of no return":') +
 UL(['<b>Inability to restore mitochondrial function</b>: no ATP generation even after the stimulus is removed.',
     '<b>Profound membrane damage</b>: plasma and lysosomal membranes rupture, enzymes leak and digest the cell.']) +
 P('Nuclear signs of cell death: <b>pyknosis</b> (shrinkage), <b>karyorrhexis</b> (fragmentation), <b>karyolysis</b> (fading).') +
 BEYOND(''));

C('l2-10','L2','Apoptosis vs necrosis','',
 'Compare apoptosis with necrosis.',
 T(['','Apoptosis','Necrosis'],[
  ['Nature','Programmed cell death','Unprogrammed, unintended cell death'],
  ['Context','Physiological or pathological','Always pathological'],
  ['Cell','Shrinks and fragments into apoptotic bodies','Swells and ruptures'],
  ['Contents','Contained (lysosomal contents do not escape)','Leak into tissue'],
  ['Inflammation','None','Elicits inflammation']]) +
 HOOK('Apoptosis is a tidy resignation; necrosis is a messy explosion that calls in the inflammatory clean-up crew.'));

C('l2-11','L2','Regulation of apoptosis','',
 'Name the two apoptotic pathways and the key regulatory proteins.',
 UL(['<b>Intrinsic (mitochondrial)</b>: integrates internal signals such as DNA damage, growth-factor withdrawal and free radicals.',
     '<b>Extrinsic (death receptor)</b>: ligands bind cell-surface receptors of the TNF family, e.g. Fas.',
     'Both pathways activate <b>caspases</b> (proteases).']) +
 T(['Anti-apoptotic','Pro-apoptotic','p53'],[['Bcl-2, Bcl-xL','Bak, Bax','Pauses the cell for DNA repair; triggers apoptosis if repair fails']]) +
 P('<b>Inhibitors:</b> growth factors, extracellular matrix, sex steroids, some viral proteins. <b>Inducers:</b> growth-factor withdrawal, loss of matrix attachment, glucocorticoids, some viruses, free radicals, ionising radiation, DNA damage, ligand binding at death receptors.'));

C('l2-12','L2','Ionising radiation','',
 'How does ionising radiation injure cells? Distinguish deterministic from stochastic effects.',
 P('Ionising radiation forms ions as it passes through matter: electromagnetic (X-rays, gamma rays) or particulate (alpha particles, beta particles, neutrons).') +
 P('<b>Mode of action:</b> mainly through reactive oxygen species (radiolysis of water), and also by direct damage to DNA and proteins.') +
 T(['','Deterministic','Stochastic'],[
  ['Relation to dose','Predictable: severity rises with dose above a threshold','Only the probability rises with dose'],
  ['Examples','Mucositis, xerostomia, skin erythema','Cancer, heritable mutation']]) +
 P('A DNA-damaged cell may die (immediately or at the next attempted mitosis), be repaired with no consequence, or carry a permanent change in genotype. Stochastic risk is why dental radiographs are kept as low as reasonably achievable.'));

C('l2-13','L2','Radiotherapy and mucositis','',
 'Why does head and neck radiotherapy cause oral mucositis?',
 P('Radiotherapy aims to damage rapidly dividing tumour cells, but <b>normal cells that divide rapidly are the most sensitive</b>. Oral epithelium is labile: its basal cells divide constantly to replace surface cells. Killing them stops renewal, so the mucosa thins, reddens and ulcerates.') +
 LINK('L2 regenerative capacity: labile tissues are the first casualties of radiation and chemotherapy.'));

C('l2-14','L2','Autophagy','',
 'What is autophagy?',
 P('The cell digests its own organelles and uses the products as nutrients, a survival response to stress such as nutrient deprivation. If the cell can no longer cope, it proceeds to apoptosis.'));

/* =================== L3A — Acute inflammation =================== */
C('l3a-01','L3A','Inflammation defined','',
 'Define inflammation and state its purpose.',
 LEAD('Inflammation is the connective tissue response to injury: a reaction of blood vessels leading to accumulation of fluid and leukocytes in the tissues.') +
 P('<b>Purpose:</b> destroy, dilute or isolate the injurious agent, then heal or replace the damaged tissue, ridding the organism of the initial cause and its consequences.') +
 P('It is protective but can be harmful, and it is fundamentally the same reaction whatever the tissue or cause.'));

C('l3a-02','L3A','Five cardinal signs','',
 'Name the five cardinal signs of acute inflammation and the tissue change behind each.',
 T(['Sign','Meaning','Underlying change'],[
  ['Rubor','Redness','Vasodilation, increased blood flow'],
  ['Calor','Heat','Increased flow of warm blood'],
  ['Tumor','Swelling','Increased permeability, so exudate accumulates (oedema)'],
  ['Dolor','Pain','Prostaglandins and bradykinin sensitise nerve endings; tissue pressure'],
  ['Functio laesa','Loss of function','Pain, swelling and tissue damage combined']]) +
 LINK('L3B: gingivitis shows all five.'));

C('l3a-03','L3A','Vascular flow and calibre','',
 'Describe, in order, the changes in vascular flow and calibre in acute inflammation.',
 OL(['<b>Transient vasoconstriction</b> of arterioles: seconds to minutes.',
     '<b>Vasodilation</b>: first arterioles, then previously closed capillary beds open. Blood flow rises, giving heat and redness.',
     '<b>Increased permeability</b>: protein-rich fluid leaves the vessels, plasma volume falls and red cells concentrate.',
     '<b>Stasis</b> (slowing): within minutes for a severe injury, 15 to 30 minutes for a mild one.']) +
 P('Stasis lets leukocytes move to the vessel wall (margination). The three tissue events of acute inflammation are: flow and calibre change, permeability change, and leukocyte exudation.'));

C('l3a-04','L3A','Mechanisms of vascular leakage','',
 'List the mechanisms of increased vascular permeability. Which one causes the immediate transient response?',
 T(['Mechanism','Features'],[
  ['Endothelial gaps','Most common; reversible, short-term; <b>the immediate transient response</b>'],
  ['Cytoskeletal reorganisation','Cytokine-induced; reversible leakage'],
  ['Direct endothelial injury','Necrotising injuries; immediate leakage lasting several hours (immediate sustained)'],
  ['Leukocyte-dependent injury','Activated leukocytes damage the vessel wall'],
  ['Leakage from new vessels','During repair; new capillaries are leaky']]) +
 P('Tutorial 3 MCQ: the immediate transient response is caused by <b>endothelial gaps</b>.'));

C('l3a-05','L3A','Exudate, transudate, oedema, pus','',
 'Distinguish exudate from transudate with an example of each. Define oedema and pus.',
 T(['','Exudate','Transudate'],[
  ['Protein','High','Low (an ultrafiltrate of plasma)'],
  ['Vessel permeability','Significantly increased','Normal'],
  ['Cause','Inflammation','Hydrostatic imbalance across the endothelium'],
  ['Example','Inflamed tissue, abscess','Left-sided heart failure (pulmonary oedema)']]) +
 UL(['<b>Oedema</b>: excess fluid in the interstitial spaces, either exudate or transudate.',
     '<b>Pus</b>: a purulent exudate rich in leukocytes (mainly neutrophils) and cellular debris.']));

C('l3a-06','L3A','Leukocyte emigration','',
 'Describe, in sequence, how neutrophils get from the blood to the site of injury.',
 OL(['<b>Margination and pavementing</b>: with stasis, white cells move from the central stream to the vessel wall and line it.',
     '<b>Adhesion</b>: cells attach to activated endothelium. Textbook detail: selectins slow them (rolling), then integrins bind ICAM-1 and VCAM-1 for firm adhesion.',
     '<b>Diapedesis</b>: amoeboid movement between endothelial cells into the tissue.',
     '<b>Chemotaxis</b>: unidirectional migration up a chemical gradient (not random), e.g. toward bacterial products, C5a, LTB4.',
     '<b>Phagocytosis</b> and intracellular degradation.',
     '<b>Extracellular release</b> of leukocyte products.']) +
 P('Neutrophils dominate early; macrophages accumulate at about 48 hours.'));

C('l3a-07','L3A','Phagocytosis and self-harm','',
 'What are the steps of phagocytosis, and how do phagocytes damage the host\'s own tissue?',
 P('<b>Steps:</b> recognition, adhesion, engulfment into a phagosome, then fusion with a lysosome (phagolysosome) for killing or degradation.') +
 P('<b>Self-harm:</b> destructive lysosomal products escape into the extracellular space by:') +
 UL(['<b>Regurgitation during feeding</b>: the phagocytic vacuole is not completely closed.',
     '<b>Frustrated phagocytosis</b>: the cell tries to digest non-digestible material such as a flat surface.']) +
 P('This damages tissue and further stimulates inflammation.') + LINK('L3B: neutrophil enzymes contribute to periodontal destruction.'));

C('l3a-08','L3A','Chemical mediators','',
 'Match mediators to effects: vasodilation, increased permeability, chemotaxis, fever, pain, tissue damage.',
 T(['Effect','Mediators (lecture)'],[
  ['Vasodilation','Prostaglandins'],
  ['Increased vascular permeability','Histamine, bradykinin, leukotrienes'],
  ['Chemotaxis','Complement (C5a), leukotrienes (LTB4)'],
  ['Fever','Prostaglandins'],
  ['Pain','Prostaglandins, bradykinin'],
  ['Tissue damage','Neutrophil and macrophage contents']]) +
 HOOK('Prostaglandins appear three times: dilation, fever, pain. That is why NSAIDs (COX inhibitors) relieve all three.'));

C('l3a-09','L3A','Outcomes of acute inflammation','',
 'What are the four outcomes of acute inflammation, and which is most common?',
 T(['Outcome','When'],[
  ['Resolution','Complete restoration; rare; minor injury with labile cells and intact stroma'],
  ['Suppuration','Pus formation, abscess; pyogenic bacteria'],
  ['Regeneration and repair','<b>Most common</b>; lost tissue replaced by parenchymal division or by connective tissue (organisation, scar)'],
  ['Chronic inflammation','The stimulus persists']]) +
 P('Requirements for resolution: neutralise the agent, decay of mediators, return of normal permeability, end of leukocyte infiltration, neutrophil death by apoptosis, removal of debris by lymphatics.'));

C('l3a-10','L3A','Inflammatory cells','',
 'Summarise the roles of neutrophils, eosinophils, basophils, monocytes/macrophages and lymphocytes.',
 T(['Cell','Role'],[
  ['Neutrophil','Phagocytic specialist, first-line defender, scavenger; about two-thirds of circulating leukocytes'],
  ['Eosinophil','Allergic conditions, defence against parasites (worms); red-staining granules'],
  ['Basophil','Least common; like mast cells, stores histamine and heparin'],
  ['Monocyte / macrophage','Precursor phagocyte that matures into a macrophage in tissue; survives months to years'],
  ['Lymphocyte','B cells make antibody; T cells give cell-mediated immunity (virus-infected and tumour cells)']]));

C('l3a-11','L3A','Wound types','',
 'Name and define the six wound types from the lecture. Which gives ideal conditions for healing?',
 T(['Wound','Features'],[
  ['Contusion','Bruise; blunt injury damaging deep tissues, haemorrhage'],
  ['Abrasion','Superficial friction injury removing surface epithelium (carpet burn)'],
  ['Avulsion','Large open wound with extensive loss of tissue volume; includes a tooth dislodged from its socket'],
  ['Puncture','Small, deep wound from a sharp object (needle-stick, dog bite)'],
  ['Laceration','Ragged edges, deep, crushed tissue, necrotic debris and clot; contaminated'],
  ['Incisional / surgical','Clean, aseptic, minimal tissue loss, sharp margins that can be approximated']]) +
 P('<b>Incisional wounds</b> provide ideal conditions and heal by first intention (L4).'));

/* =================== L3B — Chronic inflammation =================== */
C('l3b-01','L3B','Acute vs chronic','',
 'Distinguish acute from chronic inflammation in terms of onset, duration, cells and tissue damage.',
 T(['','Acute','Chronic'],[
  ['Onset','Immediate response to injury','Delayed; may follow acute or arise de novo'],
  ['Duration','Minutes to a maximum of about 2 days (lecture)','Weeks to months'],
  ['Main cells','Neutrophils (polymorphs)','Lymphocytes, plasma cells, macrophages, plus fibroblasts'],
  ['Vascular picture','Vasodilation, exudate, oedema','Angiogenesis'],
  ['Tissue damage','Usually limited, self-resolving','Ongoing destruction <b>while</b> the body attempts to heal (fibrosis)'],
  ['Outcome','Resolution, suppuration, repair or chronicity','Fibrosis and scarring']]) +
 P('There is temporal and cellular overlap, and chronic inflammation can have acute exacerbations.') +
 P('Tutorial 3B MCQs: chronic inflammation = prolonged duration and tissue damage; <b>neutrophils</b> are NOT a characteristic chronic cell; activated CD4 T cells release <b>cytokines</b>.'));

C('l3b-02','L3B','Causes of chronic inflammation','',
 'Give the main causes of chronic inflammation, and examples of chronic inflammation arising de novo.',
 T(['Cause','Example'],[
  ['Persistent infection','Tuberculosis (tubercle bacilli), syphilis (<i>Treponema pallidum</i>)'],
  ['Prolonged exposure to toxic agents','Exogenous: silica, causing silicosis. Endogenous: plasma lipids, causing atherosclerosis'],
  ['Autoimmunity','Rheumatoid arthritis, lupus erythematosus']]) +
 P('It persists because the body cannot remove or destroy the stimulus, because of features of the stimulus itself, or because of immune reactions.') +
 P('<b>De novo (no acute phase):</b> sterile foreign bodies (sutures, implants), asbestos, <i>M. tuberculosis</i>, <i>M. leprae</i>, idiopathic disease (sarcoidosis).'));

C('l3b-03','L3B','Cells of chronic inflammation','',
 'Describe the roles of macrophages, lymphocytes and plasma cells in chronic inflammation. Why does it become self-perpetuating?',
 T(['Cell','Role'],[
  ['Macrophage','Key player: phagocytoses, presents antigen to T cells, secretes toxic products (oxygen radicals, NO), proteases, cytokines and growth factors for fibrosis and new vessels'],
  ['Lymphocyte','Activated by antigen; produces lymphokines that stimulate monocytes and macrophages'],
  ['Plasma cell','Activated B cell that secretes antibody'],
  ['Fibroblast','Lays down collagen (fibrosis)']]) +
 P('<b>The loop:</b> activated lymphocytes release lymphokines that activate macrophages; macrophage cytokines (monokines) activate lymphocytes. This reciprocal relationship keeps the reaction going as long as antigen persists.'));

C('l3b-04','L3B','Macrophage kinetics','',
 'How do macrophages accumulate in chronic inflammation, and how long do they live?',
 UL(['Monocytes have a blood half-life of about 1 day; as tissue macrophages they live several months.',
     'They accumulate about 48 hours after the stimulus.',
     'In short-lived inflammation they die or leave via lymphatics to the nodes.',
     'With a long-term stimulus they accumulate by <b>continued recruitment</b> of monocytes, <b>local proliferation</b> and <b>immobilisation</b>.']) +
 P('Activation (by cytokines, bacterial endotoxin, T cells) makes them larger, richer in lysosomal enzymes and better killers, but unchecked their products cause tissue injury and fibrosis. Tissue residents include Kupffer cells (liver), sinus histiocytes (lymph nodes) and alveolar macrophages (lung).'));

C('l3b-05','L3B','Histological features','',
 'What are the three histological hallmarks of chronic inflammation?',
 OL(['<b>Mononuclear cell infiltrate</b>: macrophages, lymphocytes, plasma cells.',
     '<b>Tissue destruction</b>, induced by the inflammatory cells themselves.',
     '<b>Attempts at healing</b> by connective tissue replacement: angiogenesis and fibrosis.']) +
 HOOK('Destroy and repair at the same time: that simultaneous tug-of-war is the signature of chronic inflammation.'));

C('l3b-06','L3B','Granulomas','',
 'What is a granuloma, how does it form, and how does it differ from granulation tissue?',
 LEAD('A granuloma is a focal aggregate of macrophages transformed into epithelioid cells, surrounded by a collar of lymphocytes and some plasma cells.') +
 UL(['<b>Epithelioid cells</b>: flat, elongated, oval nucleus, eosinophilic cytoplasm; they cannot phagocytose but release inflammatory and immune mediators.',
     '<b>Giant cells</b>: very large, multinucleate, formed by fusion of macrophages where particles are hard to destroy. Langhans giant cell: nuclei in a horseshoe. Foreign-body giant cell: nuclei scattered.',
     'Some have central necrosis, e.g. <b>caseous necrosis in TB</b>. Continued mediator release maintains them; they can coalesce and destroy tissue.']) +
 T(['Cause','Examples'],[['Infectious','TB, leprosy, fungal, syphilis, parasites'],['Chemical','Talc, asbestos'],['Autoimmune','Rheumatoid nodule, Crohn disease'],['Idiopathic','Sarcoidosis, orofacial granulomatosis']]) +
 P('<b>Granulation tissue</b> is different: new capillaries and fibroblasts forming the scaffold of repair (L4).'));

C('l3b-07','L3B','Morphological forms','',
 'Name the five morphological forms of inflammation, with an example of each.',
 T(['Form','Features','Example'],[
  ['Serous','Thin fluid from serum or mesothelial secretions','Burn blister, pleurisy, pericarditis, synovitis'],
  ['Fibrinous (the lecture\'s "fibrous")','More severe injury; fibrin leaks out. Removed by fibrinolysis (resolution) or organised into scar','Fibrinous pericarditis, adhesions, TMJ ankylosis'],
  ['Suppurative','Pus: neutrophils, necrotic cells, oedema fluid','Staphylococcal abscess'],
  ['Ulcerative','Localised loss of epithelium exposing connective tissue','Traumatic oral ulcer, oesophageal ulcer'],
  ['Granulomatous','Granuloma formation','Tuberculosis']]));

C('l3b-08','L3B','Sinus vs fistula','',
 'What is the difference between a sinus and a fistula? Why is a draining dental sinus often painless?',
 T(['Sinus','Fistula'],[
  ['A tract leading from an abscess cavity to an epithelial surface (one opening at the surface)','An abnormal tract connecting two epithelial surfaces (e.g. oro-antral fistula)']]) +
 P('A draining sinus relieves pressure, so it is often <b>painless</b>. The abscess has not resolved; it has found an escape route and still needs treatment.') +
 FLAG('The slide text reads "Fistula: a non-epithelial lined tract" and "Sinus: an epithelial lined channel joining the abscess cavity to an epithelial surface". Standard texts define them by their openings (sinus: abscess to one surface; fistula: joins two surfaces). If asked, anchor your answer on the openings.'));

C('l3b-09','L3B','CD4 vs CD8 T cells','',
 'Compare CD4+ and CD8+ T cells, including the MHC class each recognises.',
 T(['','CD4+ helper','CD8+ cytotoxic'],[
  ['Binds','MHC class II (antigen-presenting cells)','MHC class I (all nucleated cells)'],
  ['Main job','Master regulator: secretes cytokines that direct T cells, B cells, macrophages, NK cells','Kills infected or abnormal cells'],
  ['Effector tools','Th1: IFN-γ activates macrophages. Th2: IL-4, IL-5, IL-13 drive IgE and eosinophils. Th17: IL-17 recruits neutrophils','Perforin and granulysin form pores so ions and water rush in and the cell lyses; can also induce apoptosis'],
  ['Clinical','Selectively destroyed by HIV','Key antiviral and antitumour defence']]) +
 P('T cells can only be activated by antigen presented on a cell surface, not soluble antigen. B cells can recognise soluble antigen.'));

C('l3b-10','L3B','Natural killer cells','',
 'What are NK cells and how do they decide which cells to kill?',
 UL(['Large granular lymphocytes with <b>no T-cell receptor and no surface immunoglobulin</b>.',
     'Kill tumour cells, virus-infected cells and some normal cells <b>without prior sensitisation</b>.',
     'Have an Fc receptor for IgG, so they lyse IgG-coated cells (antibody-dependent cytotoxicity).',
     '<b>MHC class I protects normal cells.</b> Cells that lose MHC class I (common in viral infection and tumours) become targets.']) +
 FLAG('The slide calls NK cells "a type of T lymphocyte". Current immunology classifies them as innate lymphoid cells, not T cells (they lack a T-cell receptor). In an answer, describe their features rather than calling them T cells.'));

C('l3b-11','L3B','Antibodies and immunoglobulins','',
 'Describe antibody structure and name the five immunoglobulin classes with their main role.',
 P('Two heavy and two light chains. The <b>heavy chain</b> determines the class. <b>Fab</b> (variable region) binds antigen; <b>Fc</b> binds cell receptors, causing opsonisation, cell lysis and mast-cell degranulation. Antibodies are made by plasma cells (activated B cells).') +
 T(['Class','Role'],[['IgA','Mucosal surfaces (secretory IgA in saliva)'],['IgD','Antigen receptor on B cells'],['IgE','Binds allergens and triggers histamine release from mast cells'],['IgG','Majority of antibody-based immunity against pathogens'],['IgM','Early antibody, secreted before enough IgG is available']]) +
 FLAG('The slide says IgM has "high affinity". Textbooks describe IgM as <b>low affinity</b> per binding site but <b>high avidity</b>, because it is a pentamer with ten binding sites.'));

C('l3b-12','L3B','Acquired causes of oral lesions','',
 'Give the nine categories of acquired causes of oral lesions, with an example of each.',
 OL(['Physical and chemical agents: biting, burn','Infectious organisms: HSV','Inflammatory processes','Immune diseases: bullous pemphigoid','Nutritional deficiency and metabolic disease: B-vitamin deficiency','Neoplastic disease: squamous cell carcinoma','Psychological factors: self-harm','Iatrogenic factors: numb-lip trauma, dental procedure injury','Idiopathic: Stevens–Johnson syndrome (lecture\'s example)']) +
 P('Walk through these for any lesion of unclear cause; neoplasia is the one that must never be missed.'));

/* ---------- Periodontal disease (predicted) ---------- */
C('l3b-p1','L3B','Gingivitis vs periodontitis','perio',
 'Define gingivitis and periodontitis. What single finding separates them?',
 LEAD('Both are inflammatory responses to plaque bacteria at or below the gum line. The dividing line is loss of attachment (and alveolar bone).') +
 T(['','Gingivitis','Periodontitis'],[
  ['Tissue','Gingiva only','Supporting tissues: periodontal ligament, cementum, alveolar bone'],
  ['Inflammation','Acute (lecture framing)','Chronic'],
  ['Attachment loss','None','Present'],
  ['Bone loss','None','Present'],
  ['Reversible?','Yes, with plaque control','Lost attachment and bone do not return; inflammation can be controlled']]) +
 P('Periodontal disease is the second most common cause of tooth loss; genetic and environmental factors raise risk.') +
 FLAG('Tutorials say "chronic periodontitis". Since the 2017 World Workshop classification, "chronic" and "aggressive" periodontitis are merged into a single "periodontitis", described by stage (severity) and grade (rate of progression). Using the tutorial term is fine in this exam.'));

C('l3b-p2','L3B','How plaque starts inflammation','perio',
 'How does dental plaque initiate gingival inflammation?',
 OL(['Aerobic and anaerobic plaque bacteria collect at the tooth–gingiva interface.',
     'They release <b>metabolic acids, extracellular enzymes and lipopolysaccharide (LPS)</b>.',
     'These damage the sulcular epithelium and underlying connective tissue, directly and indirectly.',
     'The host releases mediators, activating the vascular events of acute inflammation: vasodilation, increased permeability (more gingival crevicular fluid) and leukocyte migration.']));

C('l3b-p3','L3B','Cardinal signs in gingivitis','perio',
 'Map the five cardinal signs of inflammation onto clinical gingivitis.',
 T(['Cardinal sign','In gingivitis'],[
  ['Rubor + tumor','Red, swollen gingiva'],
  ['Calor','Raised intracrevicular temperature'],
  ['Dolor','Pain on probing'],
  ['Functio laesa','The papilla no longer deflects food debris']]) +
 P('Add <b>bleeding on probing</b>: dilated, fragile vessels under a thin, ulcerated sulcular epithelium.'));

C('l3b-p4','L3B','Neutrophils in gingivitis','perio',
 'What do neutrophils do in gingivitis, and why can\'t they clear the plaque?',
 P('Neutrophils migrate into the sulcus and form a <b>barrier between the plaque mass and the crevicular epithelium</b>. They phagocytose some bacteria, but this is <b>not a critical mechanism</b> for controlling plaque: the biofilm is large, organised and sits on a non-shedding tooth surface outside the tissues.') +
 P('If the neutrophil influx is overwhelmed, a periodontal abscess can form. Their released enzymes also damage host tissue (L3A frustrated phagocytosis).'));

C('l3b-p5','L3B','Why periodontitis is chronic','perio',
 'Why does periodontal inflammation become chronic rather than resolving?',
 LEAD('Resolution requires removal of the stimulus, and the subgingival biofilm cannot be removed by the host.') +
 UL(['The plaque is attached to the tooth: technically <b>outside the body</b>, with <b>no blood supply directly to the infected site</b>, so immune cells, antibody and antibiotics cannot clear it.',
     'The stimulus persists, which is the definition of a chronic inflammatory cause (L3B).',
     'A large infiltrate of macrophages, lymphocytes and plasma cells develops; the lymphocyte–macrophage loop sustains it.',
     'Bacterial <b>and</b> host products damage the tissues, while fibrosis and repair are attempted at the same time.']));

C('l3b-p6','L3B','Histological stages','perio',
 'Describe the histological stages from healthy gingiva to periodontitis.',
 T(['Stage','Timing','Histology'],[
  ['Initial lesion','2–4 days of plaque','Acute vasculitis beneath the junctional epithelium; more crevicular fluid; neutrophils migrate into the sulcus; some perivascular collagen loss. Subclinical'],
  ['Early lesion','About 1 week','Lymphocyte-rich infiltrate (mainly T cells); fibroblast damage; collagen loss in the infiltrated zone; junctional epithelium proliferates. Clinical gingivitis: redness, bleeding on probing'],
  ['Established lesion','2–3 weeks','Plasma cells (B cells) predominate; continued collagen loss; gingival (false) pocket may form; <b>no bone loss</b>. Can stay stable for years'],
  ['Advanced lesion = periodontitis','Variable, often years','Lesion extends into PDL and alveolar bone; junctional epithelium migrates apically onto the root, forming a true pocket; attachment and bone loss; plasma cells dominate']]) +
 BEYOND('Page and Schroeder, 1976.'));

C('l3b-p7','L3B','Histological differences','perio',
 'Tabulate the key histological differences between gingivitis and periodontitis.',
 T(['Feature','Gingivitis','Periodontitis'],[
  ['Extent','Gingival connective tissue','Periodontal ligament, cementum, alveolar bone'],
  ['Junctional epithelium','Stays at the cemento-enamel junction','Migrates apically onto the root; pocket lining thin and ulcerated'],
  ['Pocket','Gingival (false) pocket from swelling','True periodontal pocket'],
  ['Infiltrate','Neutrophils, then T lymphocytes, then plasma cells','Dense plasma cells, lymphocytes, macrophages'],
  ['Collagen','Local loss, recoverable','Extensive destruction of gingival and PDL fibres'],
  ['Alveolar bone','Intact crest','Osteoclastic resorption of the crest'],
  ['Reversibility','Reversible','Irreversible tissue loss']]));

C('l3b-p8','L3B','Mechanism of tissue destruction','perio',
 'By what mechanisms are collagen and alveolar bone destroyed in periodontitis?',
 LEAD('Bacteria trigger it, but the host response causes most of the destruction.') +
 UL(['Bacterial products (LPS, proteases) injure tissue directly and stimulate host cells.',
     'Macrophages, fibroblasts and lymphocytes release <b>IL-1, TNF-α and prostaglandin E2</b>.',
     '<b>Collagen:</b> matrix metalloproteinases (MMPs, e.g. neutrophil collagenase) degrade gingival and PDL collagen.',
     '<b>Bone:</b> cytokines increase <b>RANKL</b> relative to its decoy receptor <b>OPG</b>. RANKL binds RANK on osteoclast precursors, driving osteoclast formation and resorption of the alveolar crest.']) +
 LINK('L3B macrophage products: "toxic to extracellular matrix: proteases".') +
 BEYOND(''));

C('l3b-p9','L3B','Why only some progress','perio',
 'A patient has persistent gingivitis despite regular brushing. Why might it progress to periodontitis in them but not in someone else?',
 LEAD('Gingivitis always precedes periodontitis, but not every gingivitis progresses; the balance between biofilm and host decides.') +
 T(['Factor','How it tips the balance'],[
  ['Subgingival plaque, calculus, overhangs, crowding','Plaque persists where brushing cannot reach'],
  ['Dysbiosis','Shift toward Gram-negative anaerobes (e.g. <i>Porphyromonas gingivalis</i>, <i>Tannerella forsythia</i>, <i>Treponema denticola</i>)'],
  ['Smoking','Impairs neutrophils and healing; vasoconstriction masks bleeding'],
  ['Diabetes','Impaired neutrophils, exaggerated inflammation, advanced glycation end-products'],
  ['Genetics, stress, immunosuppression','Altered host response; HIV can cause necrotising disease']]));

C('l3b-p10','L3B','Periodontal abscess','perio',
 'How does a periodontal abscess form?',
 UL(['If the neutrophil influx is <b>overwhelmed</b>, many neutrophils degranulate in a confined area, attacking host tissue and causing marked local destruction.',
     '<b>Blockage of the gingival crevicular orifice</b> stops crevicular fluid flowing from the sulcus to the mouth, trapping the exudate.']) +
 LINK('L3A: suppuration is an outcome of acute inflammation, here superimposed on chronic periodontitis.'));

/* =================== L4 — Healing and repair =================== */
C('l4-01','L4','Healing vs repair','',
 'Define healing and repair. What terminology trap did the lecturer warn about?',
 T(['','Healing (regeneration)','Repair (organisation)'],[
  ['Result','Complete restoration with no, or minimal, residual defect','Restoration with fibrovascular connective tissue (scar)'],
  ['Follows','Loss of part of a labile cell population','Loss of specialised cell populations'],
  ['Needs','Cells that can divide and an intact stromal framework','Granulation tissue and collagen']]) +
 FLAG('Robbins uses "healing" for both regeneration and repair. Underwood\'s uses healing to mean regeneration. The lecture follows Underwood\'s, so define your terms in any answer.'));

C('l4-02','L4','Stem cells','',
 'Define totipotent, pluripotent, multipotent and unipotent stem cells. Where are adult epithelial stem cells found?',
 T(['Potency','Can become'],[
  ['Totipotent','All cells of the embryo and placenta (a complete organism)'],
  ['Pluripotent','All cells of the three embryonic layers, but not the supporting tissue of the embryo'],
  ['Multipotent','A number of cell types'],
  ['Unipotent','Only one cell type']]) +
 P('<b>Locations:</b> epidermis, in the basal layer next to the basement membrane; intestinal mucosa, near the bottom of the crypts. Dental stem cells (pulp, PDL) are the basis of periodontal regeneration research.'));

C('l4-03','L4','Healing of an abrasion','',
 'Describe how an abrasion heals by regeneration. What stops the epithelial cells from overgrowing?',
 OL(['An abrasion removes surface epithelium.',
     'A <b>scab</b> (a layer of fibrin) forms and protects the area while the epidermis grows to cover the defect.',
     'Epithelial cells proliferate and spread out as a thin sheet beneath the scab until the defect is covered.',
     'They stop when they form a confluent layer: <b>contact inhibition</b>.',
     'The epidermis is then rebuilt from the base upwards.']) +
 P('Contact inhibition is lost in neoplasia, allowing tumour cells to keep proliferating.') +
 HOOK('Scab over skin, clot in a socket: the fibrin layer is the protective scaffold that epithelium creeps under.'));

C('l4-04','L4','Organisation','',
 'List the steps of organisation (repair).',
 OL(['Fibrin deposition.',
     'Granulation tissue formation.',
     'Removal of dead tissue by neutrophils and macrophages.',
     'Contraction of the granulation tissue.',
     'Collagen accumulation to form the scar.']) +
 P('Organisation = repair of specialised tissues by the formation of mature fibrovascular connective tissue. Infection and inflammation increase scarring.'));

C('l4-05','L4','Granulation tissue','',
 'What is granulation tissue, why is it called that, and why must it not be confused with a granuloma?',
 LEAD('Granulation tissue is the hallmark of repair: new thin-walled capillaries plus proliferating fibroblasts and myofibroblasts in a loose, oedematous matrix, with macrophages and other inflammatory cells.') +
 UL(['Grossly it is pink, soft and granular (the capillary loops look like granules), and it bleeds easily.',
     'It fills the defect, supplies oxygen and nutrients, contracts, and lays down collagen; it later matures into a relatively avascular scar.',
     'A <b>granuloma</b> is a chronic inflammatory aggregate of epithelioid macrophages (L3B): an entirely different thing.']) +
 BEYOND(''));

C('l4-06','L4','Wound contraction and scarring','',
 'What causes wound contraction, and what problems can scarring and contraction cause?',
 P('Contraction results from <b>myofibroblasts</b> in granulation tissue, attached to each other and to adjacent matrix. It aims to reduce the volume of tissue needing repair. Collagen is then secreted and forms a scar replacing the lost specialised tissue.') +
 T(['Problem','Example'],[
  ['Stenosis or obstruction','Stricture narrowing a tube lumen (oesophagus, bowel)'],
  ['Contracture','Tissue distortion with permanent shortening of a muscle'],
  ['Cosmetic damage, impaired mobility','Contraction after burns to the skin'],
  ['Abnormal scars','Hypertrophic scar or keloid (TGF-β abnormalities)']]) +
 P('Tutorial 4 MCQ: wound contraction is mediated by <b>myofibroblasts</b>.'));

C('l4-07','L4','First intention','',
 'An incisional biopsy wound is sutured. Describe healing by first intention and its approximate timeline.',
 LEAD('First intention: a clean incision with very little damage either side and edges closely approximated, so healing is prompt and uneventful with minimal granulation tissue and scar.') +
 T(['Time','Events'],[
  ['Immediately','Narrow gap fills with blood clot; surface dries to a scab (eschar)'],
  ['24 h','Neutrophils at the margins; basal epithelial cells start dividing'],
  ['24–48 h','Epithelium migrates from both edges and meets beneath the scab: a thin continuous layer'],
  ['Day 3','Macrophages replace neutrophils; granulation tissue invades'],
  ['Day 5','New capillaries peak; collagen fibres bridge the incision'],
  ['Week 2','Collagen accumulates; inflammation and oedema subside; scar blanches'],
  ['1 month','Cellular connective tissue scar under intact epidermis']]) +
 P('Lecture points: capillaries proliferate (neovascularisation); fibroblasts migrate into the fibrin network and secrete collagen; the <b>elastic fibre network is not reconstructed</b>.') +
 BEYOND('Wound strength is about 10% of normal at 1 week (suture removal) and plateaus at about 70–80% by 3 months; it never returns to 100%.'));

C('l4-08','L4','Second intention','',
 'Describe healing by second intention and how it differs from first intention.',
 P('<b>Occurs with:</b> tissue loss, gaping wound margins, haemorrhage and infection (large lacerations, ulcers, burns, extraction sockets).') +
 P('<b>Process:</b> large fibrin clot; more intense inflammation with phagocytosis of debris; abundant granulation tissue fills the defect from the base; epithelium regenerates from the margins across it; marked contraction by myofibroblasts; collagen forms a larger scar.') +
 T(['','First intention','Second intention'],[
  ['Tissue loss','Minimal','Significant'],
  ['Wound edges','Approximated','Gaping'],
  ['Inflammation','Mild','Intense'],
  ['Granulation tissue','Little','Abundant'],
  ['Contraction','Minimal','Marked (myofibroblasts)'],
  ['Scar','Thin, linear','Large; may cause contracture'],
  ['Time and infection risk','Short, low','Longer, higher']]) +
 BEYOND('Large skin defects can shrink to 5–10% of their original size within about 6 weeks, largely by contraction.'));

C('l4-09','L4','Growth factors','',
 'Match the growth factors to their source and action: EGF/KGF, VEGF, PDGF, TGF-β.',
 P('Healing is a complex interplay of cytokines: one cell can make many, and each has many functions. Initiating signals include <b>hypoxia</b> and <b>growth factors released by platelet degranulation</b>.') +
 T(['Factor','Main source (lecture)','Action'],[
  ['EGF, KGF','Platelets, macrophages, fibroblasts','Keratinocyte proliferation and mobility (re-epithelialisation)'],
  ['VEGF','Keratinocytes, macrophages','Angiogenesis'],
  ['PDGF','Platelets, macrophages, keratinocytes','Activates macrophages; fibroblast proliferation; matrix production'],
  ['TGF-β','(Platelets, macrophages)','Controls myofibroblasts and collagen formation; abnormalities contribute to hypertrophic scars and keloids']]) +
 P('Tutorial 4 MCQ: the growth factor primarily involved in epithelial regeneration is <b>EGF</b>.'));

C('l4-10','L4','Mucosal ulcers','',
 'How does a mucosal ulcer heal, and what happens with chronic ulceration?',
 OL(['Bleeding and covering by fibrin (the yellow-white slough of an oral ulcer).','Removal of necrotic tissue by macrophages.','Granulation tissue formation.','Epithelial regeneration from the ulcer edges.']) +
 P('<b>Chronic ulceration:</b> alternating ulceration and repair, progressive tissue destruction, fibrous scar replacing muscle, and contraction of the scar (e.g. chronic gastric ulcer).'));

C('l4-11','L4','Bone healing','',
 'Describe the stages of fracture healing and the factors that impair it.',
 OL(['<b>Haematoma</b> from ruptured vessels in the periosteum and marrow cavity.',
     '<b>Organisation</b> of the haematoma and removal of dead bone.',
     '<b>Callus</b>, internal and external: a mass of new <b>woven bone</b> (irregular pattern, made fast).',
     '<b>Lamellar bone</b> replaces woven bone and is <b>remodelled along lines of mechanical stress</b>.']) +
 T(['Impairing factor','Result'],[
  ['Mobility','Fibrous union, false joint'],
  ['Interposed soft tissue','Non-union'],
  ['Misalignment','Impaired function; osteoarthrosis in adjacent joints'],
  ['Infection','Delayed healing (e.g. compound fracture)'],
  ['Pre-existing bone disease','Pathological fracture; poor healing']]) +
 P('<b>Pathological fracture:</b> through bone weakened by primary or secondary disease. <b>Compound fracture:</b> involves the overlying skin. <b>Distraction osteogenesis:</b> bone is cut and gradually pulled apart so new bone forms in the gap.'));

C('l4-12','L4','Liver, nerve and muscle','',
 'How do liver, nervous tissue and muscle respond to injury?',
 T(['Tissue','Response'],[
  ['Liver','Regenerates from three sources: hepatocytes, liver progenitor (stem) cells, bone-marrow-derived stem cells'],
  ['Central nervous system','Does not repair effectively; adult neurons have low replicative capacity; <b>gliosis</b> (glial proliferation) fills the defect'],
  ['Peripheral nerve','Connective tissue sheaths: epineurium (outer), perineurium (around fascicles), endoneurium (around fibres)'],
  ['Cardiac and smooth muscle','Permanent per the L4 slide (vascular smooth muscle can form new vessels); damaged muscle replaced by scar'],
  ['Skeletal muscle','Limited regeneration from satellite cells; if only contractile proteins are lost, new ones form within the old endomysium']]));

C('l4-13','L4','Peripheral nerve injury','',
 'Classify peripheral nerve injuries (Seddon). Why does this matter for inferior alveolar or lingual nerve damage?',
 T(['Injury','What is damaged','Recovery'],[
  ['Neurapraxia','Conduction block; axon intact','Full, within days to weeks'],
  ['Axonotmesis','Axon disrupted; connective tissue sheath intact; Wallerian degeneration distally','Usually good but slow, as the axon regrows along its tube (about 1 mm per day)'],
  ['Neurotmesis','Nerve completely divided','Poor without surgical repair; neuroma may form']]) +
 BEYOND(''));

C('l4-14','L4','Factors affecting healing','',
 'List the factors that impair wound healing, and explain how corticosteroids impair it.',
 T(['Factor (lecture)','Why it impairs healing'],[
  ['Age','Reduced capacity and cellular reserves'],
  ['Nutrition','Protein synthesis impaired (vitamin C is needed for collagen)'],
  ['Neoplastic disorders','General debility, local tissue destruction'],
  ['Cushing syndrome, steroid therapy','Immunosuppression makes injury or infection more severe; steroids interfere with granulation tissue formation and so with wound contraction'],
  ['Diabetes, immunosuppression','Infection, impaired neutrophil function, ischaemia, neuropathy'],
  ['Vascular disturbance','Poor oxygen and nutrient delivery'],
  ['Denervation','Unresponsive to repeated minor trauma; no pain from infection or inflammation']]) +
 P('Local factors also matter: infection, poor blood supply, foreign bodies, mobility or tension, previous irradiation. Smoking impairs healing via vasoconstriction and impaired neutrophil function.'));

C('l4-15','L4','Diabetes and healing','',
 'How does diabetes impair wound healing?',
 UL(['Hypoxia and ischaemia from vascular disease','Dysfunction of fibroblasts and epidermal cells','Impaired angiogenesis','High levels of MMPs (excess matrix breakdown)','Damage from reactive oxygen species and advanced glycation end-products','Decreased host immune resistance (impaired neutrophils, so more infection)','Neuropathy (unnoticed trauma)']) +
 P('Dental consequence: slower socket healing, more post-operative infection, worse periodontitis.'));

C('l4-16','L4','Stress and healing','',
 'How does psychological stress slow wound healing?',
 P('Stress raises glucocorticoids (cortisol). These suppress the pro-inflammatory cytokines (IL-1β, IL-6, TNF-α) needed early at the wound, blunting the inflammatory phase so the later phases start late. Stress also brings behaviours that impair healing: smoking, poor sleep and diet.') +
 BEYOND('Palatal wounds in dental students healed about 40% (roughly 3 days) slower during exams than in the summer vacation (Marucha et al. 1998).'));

/* ---------- Tooth socket (predicted) ---------- */
C('l4-s1','L4','Socket: first hours','socket',
 'What happens in the first hours after an extraction, and why is the patient told not to rinse for 24 hours?',
 OL(['Normal clotting produces a <b>loose clot</b> that fills the bony and soft-tissue socket.',
     '<b>Platelets retract the clot</b>, expressing fluid so it hardens and shrinks below the level of the adjacent soft tissue, pulling mobile soft tissue inwards to reduce the exposed clot area.',
     'Clot retraction is usually <b>complete in about 4 hours</b>; the clot surface changes from <b>shiny to matt</b>.',
     'After retraction the clot keeps stabilising by <b>fibrin cross-linking</b>, so rinsing is avoided for <b>24 hours</b>.']));

C('l4-s2','L4','Socket: day 2','socket',
 'What is happening in the socket at 2 days, and why is this the danger point?',
 UL(['<b>Fibrinolysis has started.</b>','Inflammatory cells have begun to emigrate into the clot.']) +
 P('The clot is starting to break down but is <b>not yet well anchored</b> to the socket wall (organisation has not begun). The risk of <b>dry socket from clot lysis or loss is highest now</b>.') +
 HOOK('Day 2 is the gap between the scaffold starting to dissolve and new tissue arriving to hold it.'));

C('l4-s3','L4','Socket: day 4','socket',
 'Describe the socket at 4 days after extraction.',
 UL(['<b>Macrophages</b> remove debris.','<b>Organisation</b> of the clot begins.','Bacterial enzymes lyse the surface fibrin.','<b>Epithelial cells</b> begin to grow beneath the surface debris, over the intact clot.']));

C('l4-s4','L4','Socket: day 8','socket',
 'Describe the socket at 8 days after extraction.',
 UL(['Socket filled with <b>granulation tissue</b>.','Superficial layers contain inflammatory cells.','<b>Lamina dura</b> still intact, but <b>resorption has begun</b>.']));

C('l4-s5','L4','Socket: day 18','socket',
 'Describe the socket at 18 days after extraction.',
 UL(['Collagen deposition.','<b>Woven bone</b> formation.','An <b>osteogenic front</b> advancing into the socket.']));

C('l4-s6','L4','Socket: 6 weeks','socket',
 'Describe the socket at 6 weeks after extraction.',
 UL(['Bone <b>remodelling to lamellar bone</b>.','<b>Lamina dura still visible</b> (the socket outline persists on radiographs).']) +
 LINK('L4 bone healing: woven bone first because it is made fast, then lamellar bone remodelled to load.'));

C('l4-s7','L4','Socket timeline','socket',
 'Put the events of tooth socket healing in order with their timings.',
 T(['When','Key event'],[
  ['0–4 hours','Clot forms and is retracted by platelets; surface shiny to matt'],
  ['First 24 hours','Fibrin cross-linking stabilises the clot: no rinsing'],
  ['2 days','Fibrinolysis begins; inflammatory cells enter the clot; <b>peak dry-socket risk</b>'],
  ['4 days','Macrophages clear debris; organisation begins; epithelium grows over the intact clot'],
  ['8 days','Granulation tissue fills the socket; lamina dura resorption begins'],
  ['18 days','Collagen, woven bone, osteogenic front'],
  ['6 weeks','Remodelling to lamellar bone; lamina dura still visible']]) +
 HOOK('4 hours, 24 hours, 2, 4, 8, 18 days, 6 weeks: "clot, cross-link, crisis, clean-up, granulation, woven, lamellar".'));

C('l4-s8','L4','Socket: type of healing','socket',
 'By which type of healing does an extraction socket heal, and which processes are involved?',
 LEAD('Second intention: there is tissue loss, the margins cannot be closely apposed, and the defect fills from the clot upwards.') +
 UL(['<b>Soft tissue:</b> gingival epithelium (labile) regenerates from the margins over the clot and granulation tissue.',
     '<b>Bone:</b> the clot is organised into granulation tissue, then woven bone, then lamellar bone, the same sequence as fracture healing (haematoma, callus, remodelling).',
     'The clot is the scaffold, just as the scab is in an abrasion; losing it (dry socket) exposes bone and stalls healing.']));

C('l4-s9','L4','Dry socket','socket',
 'Three days after a lower third molar extraction a patient has severe throbbing pain radiating to the ear and bad breath. What is it, and what is the pathology?',
 LEAD('Dry socket (alveolar osteitis): premature loss or lysis of the blood clot, exposing the bony socket wall.') +
 UL(['<b>Pathology:</b> excess local fibrinolysis dissolves the clot at the stage when fibrinolysis has begun but the clot is not anchored (day 2 onward). Bare bone is exposed to the mouth, the bony wall becomes inflamed and healing stalls.',
     '<b>Features:</b> severe pain usually starting 2–4 days after extraction, often radiating to the ear; halitosis and bad taste; an empty socket with exposed bone and debris. Swelling and fever are not typical.',
     '<b>Risk factors:</b> smoking, oral contraceptives, difficult or traumatic extraction, mandibular (especially third) molars, previous dry socket, pre-existing infection, disturbing the clot by rinsing, spitting or sucking.',
     '<b>Management:</b> local anaesthetic, gentle saline irrigation, an antiseptic and sedative dressing, analgesia and review. The socket then heals by second intention.']) +
 BEYOND(''));

C('l4-s10','L4','Post-extraction advice','socket',
 'Give post-extraction instructions and the pathological reason for each.',
 T(['Instruction','Reason'],[
  ['Bite on gauze for about 30 minutes','Pressure aids haemostasis and clot formation'],
  ['No rinsing for 24 hours','The clot is still stabilising by fibrin cross-linking'],
