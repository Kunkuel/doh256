var SCENS = [];
function S(id, l, topic, focus, stem, model, pts){ SCENS.push({id:id, l:l, t:topic, f:focus||'', q:stem, a:model, pts:pts, s:true}); }

S('sc-socket1','L4','Socket healing','socket',
 'A 52-year-old patient has a lower first molar extracted this morning. Describe the sequence of healing in the socket from the moment of extraction to six weeks. When is the patient most at risk of a dry socket, and why?',
 LEAD('The socket heals by second intention: the clot is the scaffold, epithelium regenerates over it, and bone forms beneath it.') +
 T(['When','Events'],[
  ['0–4 h','Loose clot fills the socket; platelets retract it, expressing fluid so it hardens and shrinks below the soft tissue, pulling soft tissue in; retraction complete at about 4 h, surface shiny to matt'],
  ['24 h','Fibrin cross-linking stabilises the clot: no rinsing'],
  ['2 days','Fibrinolysis begins; inflammatory cells (neutrophils) emigrate into the clot'],
  ['4 days','Macrophages remove debris; organisation begins; bacterial enzymes lyse surface fibrin; epithelium grows under surface debris over the intact clot'],
  ['8 days','Granulation tissue fills the socket; superficial inflammatory cells; lamina dura intact but resorption begun'],
  ['18 days','Collagen deposition; woven bone; osteogenic front'],
  ['6 weeks','Remodelling to lamellar bone; lamina dura still visible']]) +
 P('<b>Dry socket risk</b> is highest at about <b>2 days</b>: fibrinolysis has started but the clot is not yet anchored to the socket wall, so it can lyse or be lost, exposing bone (alveolar osteitis).') +
 P('Healing is delayed by smoking, disturbing the clot, infection, diabetes, steroids, poor nutrition and age.'),
 ['States second-intention healing with the clot as scaffold',
  'Clot retraction by platelets, complete by about 4 h (shiny to matt)',
  'Fibrin cross-linking, so no rinsing for 24 h',
  'Day 2: fibrinolysis begins, inflammatory cells enter the clot',
  'Day 4: macrophages clear debris, organisation begins, epithelium grows over intact clot',
  'Day 8: granulation tissue fills socket; lamina dura resorption begins',
  'Day 18: collagen, woven bone, osteogenic front',
  '6 weeks: remodelling to lamellar bone; lamina dura still visible',
  'Dry-socket risk peaks at 2 days, with the correct reason',
  'Names factors that would impair healing']);

S('sc-socket2','L4','Dry socket','socket',
 'Three days after surgical removal of a lower third molar, a 28-year-old who smokes 15 cigarettes a day returns with severe throbbing pain radiating to the ear and a foul taste. The socket looks empty, with exposed bone. Explain the likely diagnosis in terms of normal socket healing, identify the contributing factors, and outline management.',
 LEAD('Dry socket (alveolar osteitis): the clot has been lost or lysed, leaving the bony wall exposed.') +
 P('<b>Normal healing:</b> the clot retracts within about 4 h and stabilises over 24 h. At about 2 days fibrinolysis begins and inflammatory cells enter the clot, but organisation (from day 4) has not yet anchored it to the wall. This is the peak-risk window. Here excess fibrinolysis or mechanical loss removed the scaffold, so granulation tissue has nothing to grow into; the exposed bone becomes inflamed, causing intense pain, and healing stalls.') +
 P('<b>Contributing factors:</b> smoking (suction dislodges the clot; vasoconstriction and impaired neutrophil function); surgical trauma; mandibular third molar site (dense bone, poorer blood supply). Others to ask about: oral contraceptive, previous dry socket, pre-existing infection, early rinsing or spitting.') +
 P('<b>Management:</b> local anaesthetic, gentle saline irrigation, an antiseptic and sedative dressing, analgesia, review; the socket then heals by second intention. Advise stopping smoking. Next time: minimise trauma, give clear post-operative instructions.'),
 ['Names dry socket / alveolar osteitis',
  'Explains premature clot loss or lysis by fibrinolysis',
  'Links timing to the 2-day window before organisation anchors the clot',
  'Exposed bone becomes inflamed: pain and delayed healing',
  'Smoking as a factor, with mechanism',
  'Surgical trauma and mandibular third molar site as factors',
  'Other risk factors (oral contraceptive, previous dry socket, infection, rinsing)',
  'Management: LA, irrigation, dressing, analgesia, review',
  'Heals by second intention once granulation tissue forms',
  'Prevention advice']);

S('sc-socket3','L4','Healing with comorbidities','socket',
 'A 68-year-old with poorly controlled type 2 diabetes, who takes long-term prednisolone for rheumatoid arthritis, needs two extractions. Explain how her medical history could affect socket healing.',
 P('<b>Normal requirement:</b> socket healing needs a stable clot, a controlled inflammatory phase, granulation tissue with new vessels, then bone formation and remodelling.') +
 T(['Factor','Effect on healing'],[
  ['Diabetes','Impaired neutrophil function, so more infection; microvascular disease, hypoxia and impaired angiogenesis; fibroblast and epithelial dysfunction; high MMPs; damage from reactive oxygen species and glycation end-products; neuropathy'],
  ['Corticosteroids','Immunosuppression makes infection more severe and can mask its signs; interfere with granulation tissue formation and hence wound contraction'],
  ['Age','Reduced capacity and cellular reserves'],
  ['Rheumatoid arthritis','Chronic disease, possible poor nutrition, other immunosuppressive drugs']]) +
 P('<b>Practical points:</b> liaise to optimise glucose control, atraumatic technique, clear post-operative advice, early review with a low threshold to treat infection.'),
 ['Outlines what normal socket healing needs',
  'Diabetes: impaired neutrophils, infection risk',
  'Diabetes: vascular disease, hypoxia, impaired angiogenesis',
  'Diabetes: MMPs, glycation end-products, fibroblast dysfunction or neuropathy',
  'Steroids: immunosuppression, more severe or masked infection',
  'Steroids: impaired granulation tissue and wound contraction',
  'Age: reduced cellular reserves',
  'Practical management points']);

S('sc-perio1','L3B','Gingivitis to periodontitis','perio',
 'A 40-year-old has persistent gingivitis despite regular brushing. Explain why this gingivitis might progress to chronic periodontitis, and describe the key histological differences between gingivitis and periodontitis.',
 P('<b>Gingivitis</b> is plaque-induced inflammation confined to the gingiva. Plaque bacteria at the tooth–gingiva interface release metabolic acids, enzymes and LPS that damage the sulcular epithelium and connective tissue; host mediators trigger vasodilation, increased permeability and neutrophil migration. Neutrophils form a barrier between plaque and epithelium but cannot eliminate the biofilm.') +
 P('<b>Why it progresses:</b> the subgingival biofilm is attached to the tooth, outside the body with no blood supply, so the stimulus persists. Persistence converts acute into <b>chronic inflammation</b>: macrophages, lymphocytes and plasma cells accumulate and sustain each other. Host cells release IL-1, TNF-α and PGE2; MMPs destroy collagen and PDL; RANKL activates osteoclasts that resorb the alveolar crest. Susceptibility decides whether this happens: smoking, diabetes, genetics, stress, immunosuppression, subgingival plaque and calculus, and a shift toward Gram-negative anaerobes.') +
 T(['Feature','Gingivitis','Periodontitis'],[
  ['Extent','Gingiva','PDL, cementum, alveolar bone'],
  ['Junctional epithelium','At the CEJ','Migrates apically; ulcerated pocket lining'],
  ['Pocket','False (gingival)','True periodontal pocket'],
  ['Infiltrate','Neutrophils, T cells, then plasma cells','Dense plasma cells, macrophages, lymphocytes'],
  ['Bone','Intact','Osteoclastic crestal resorption'],
  ['Reversibility','Reversible','Irreversible attachment loss']]),
 ['Defines gingivitis as reversible plaque-induced inflammation of the gingiva',
  'Plaque products (acids, enzymes, LPS) damage epithelium and connective tissue',
  'Stimulus persists (biofilm outside the body, no blood supply): acute becomes chronic',
  'Chronic infiltrate and the lymphocyte–macrophage loop',
  'Host-mediated collagen destruction (cytokines, MMPs)',
  'Bone loss via osteoclasts (RANKL)',
  'Risk factors: smoking, diabetes, genetics, calculus, dysbiosis',
  'Histology: junctional epithelium position and pocket type',
  'Histology: infiltrate and bone differences',
  'Reversibility contrasted']);

S('sc-perio2','L3B','Two patients compared','perio',
 'Patient A (22) has red, swollen gingivae that bleed on brushing, with 3–4 mm probing depths and no attachment loss. Patient B (55, smoker) has 6 mm pockets, recession and horizontal bone loss on radiographs. Explain the pathological difference between these conditions, including the cells involved, why the signs arise, and which is reversible.',
 P('<b>Patient A: gingivitis</b>, an inflammation of the gingiva with the features of acute inflammation.') +
 UL(['Redness and swelling (rubor, tumor): vasodilation and exudate from increased permeability.',
     'Bleeding: dilated, fragile vessels under a thin, ulcerated sulcular epithelium.',
     'The 3–4 mm depths are <b>false pockets</b>: the gingival margin has swollen coronally; the junctional epithelium is still at the CEJ.',
     'Cells: neutrophils early, then T lymphocytes, then plasma cells, limited to the gingiva.',
     'Reversible with plaque control.']) +
 P('<b>Patient B: periodontitis</b>, a chronic inflammation of the supporting tissues.') +
 UL(['The persistent biofilm cannot be cleared, so macrophages, lymphocytes and plasma cells accumulate.',
     'Cytokines and MMPs destroy collagen and PDL; the junctional epithelium migrates apically: <b>true pockets</b> and attachment loss.',
     'RANKL-driven osteoclasts resorb the crest: radiographic bone loss.',
     'Smoking impairs neutrophils and healing and masks bleeding.',
     'Tissue loss is irreversible, though inflammation can be controlled.']),
 ['Identifies A as gingivitis and B as periodontitis',
  'Explains A\'s signs through acute inflammatory mechanisms',
  'A\'s depths are false pockets (junctional epithelium at CEJ)',
  'Bleeding mechanism explained',
  'A\'s cells: neutrophils, lymphocytes, plasma cells in gingiva',
  'B: chronic infiltrate of macrophages, lymphocytes, plasma cells',
  'B: apical migration of junctional epithelium, true pocket, attachment loss',
  'B: osteoclastic bone loss and MMP collagen destruction',
  'Role of smoking',
  'Reversibility: A reversible, B irreversible']);

S('sc-t1a','L5A','Bee-sting anaphylaxis','t1',
 'A patient has a severe allergic reaction (anaphylaxis) after a bee sting. Explain the immunological mechanisms underlying this immediate hypersensitivity reaction, including the mediators involved and the resulting clinical manifestations. What is the first-line treatment?',
 P('<b>Type I (immediate) hypersensitivity</b>, IgE-mediated.') +
 P('<b>Sensitisation</b> (an earlier sting): venom proteins are presented to CD4 T cells, producing a Th2 response. IL-4 (and IL-13) switch B cells to IgE; IL-5 activates eosinophils; IL-13 increases mucus. IgE binds FcεRI on mast cells and basophils, sensitising them.') +
 P('<b>This sting:</b> venom cross-links IgE on sensitised mast cells throughout the body, causing degranulation and mediator synthesis:') +
 T(['Mediator','Effect','Clinical result'],[
  ['Histamine','Vasodilation, permeability, smooth-muscle contraction, mucus','Hypotension, urticaria, angioedema, wheeze'],
  ['LTC4, LTD4','Thousands of times more potent than histamine at leakage and bronchoconstriction','Bronchospasm, oedema'],
  ['PGD2','Bronchospasm, mucus','Wheeze'],
  ['Proteases, chemokines, LTB4','Tissue damage, complement activation, recruitment of cells','Late-phase reaction hours later']]) +
 P('Systemic vasodilation and leakage cause distributive shock (hypotension, tachycardia, collapse); airway oedema and bronchospasm cause stridor and wheeze; nausea and vomiting may occur.') +
 P('<b>First-line treatment:</b> IM adrenaline into the lateral thigh (300 µg autoinjector for an adult, 150 µg for a young child), repeated every 5 minutes if needed; call an ambulance; lay flat; oxygen; CPR if required. Antihistamines and steroids are adjuncts only.'),
 ['Names type I, IgE-mediated hypersensitivity',
  'Sensitisation: Th2, IL-4/IL-13 class switch to IgE, IL-5 eosinophils',
  'IgE on FcεRI of mast cells and basophils',
  'Re-exposure cross-links IgE, causing degranulation',
  'Preformed mediators: histamine, proteases, chemokines, with effects',
  'Newly made mediators: leukotrienes and PGD2, with effects',
  'Links mediators to shock, urticaria and angioedema, bronchospasm',
  'Mentions the late-phase reaction',
  'IM adrenaline, correct dose in µg, repeat every 5 minutes',
  'Supportive steps: ambulance, positioning, oxygen; antihistamine and steroid adjunct only']);

S('sc-t1b','L5A','Anaphylaxis in the dental chair','t1',
 'Five minutes after you irrigate an extraction socket with chlorhexidine, your patient complains of itching, develops facial swelling and wheeze, and becomes pale and dizzy. Pulse 124 bpm, BP 78/40. What is happening, why, and what do you do?',
 P('<b>Anaphylaxis</b>, a type I hypersensitivity to <b>chlorhexidine</b>. Irrigating an open socket puts the allergen straight into a vascular bed; fatal cases after socket irrigation are documented.') +
 P('<b>Mechanism:</b> the patient was previously sensitised (chlorhexidine is in many mouthwashes, skin preparations and catheters), so IgE is already bound to mast cells. Chlorhexidine cross-links it, releasing histamine, proteases, leukotrienes and PGD2.') +
 UL(['Tachycardia and hypotension: systemic vasodilation and leakage (distributive shock).',
     'Facial swelling: angioedema from increased permeability.',
     'Wheeze: bronchospasm from leukotrienes, PGD2 and histamine.',
     'Itching: histamine on sensory nerves.']) +
 P('<b>Action:</b> stop, call for help and 000; IM adrenaline 300 µg (autoinjector) or 0.5 mg of 1 mg/mL into the lateral thigh; repeat every 5 minutes if no improvement; lay flat (sit up if breathing is hard); oxygen; monitor; CPR if needed. This is not a faint: vasovagal syncope has a slow pulse and no rash or wheeze.') +
 P('<b>Afterwards:</b> hospital observation; document it; refer for allergy testing; record chlorhexidine allergy prominently and avoid all chlorhexidine products.'),
 ['Recognises anaphylaxis (type I) to chlorhexidine',
  'Explains the open socket as a direct vascular route',
  'Prior sensitisation and IgE cross-linking on mast cells',
  'Tachycardia and hypotension explained by vasodilation and leakage',
  'Wheeze and angioedema explained by mediators',
  'Stop, call for help and ambulance',
  'IM adrenaline with correct dose and route; repeat every 5 minutes',
  'Positioning, oxygen, monitoring, CPR readiness',
  'Distinguishes from vasovagal syncope',
  'Follow-up: document, allergy referral, avoid chlorhexidine']);

S('sc-hiv1','L5C','HIV presentation','hiv',
 'A patient presents with a history of recurrent oral candidiasis, unexplained weight loss and persistent lymphadenopathy. What is a potential diagnosis given this presentation? What are the key steps in its pathogenesis?',
 P('<b>Likely diagnosis:</b> HIV infection progressing to AIDS. Recurrent oral candidiasis, weight loss and lymphadenopathy are features of the AIDS-related complex (lecture stage 4), after a stage of persistent generalised lymphadenopathy. Confirm with an HIV test, CD4 count and viral load; consider other causes of immunosuppression.') +
 P('<b>Pathogenesis:</b>') +
 OL(['Transmission, most often sexual; also shared needles, blood products, vertical.',
     'gp120 on the viral envelope binds <b>CD4</b> on helper T cells, then the co-receptor <b>CCR5 or CXCR4</b> (also on macrophages, glia, gut epithelium).',
     'Membranes fuse; <b>reverse transcriptase</b> copies viral RNA into DNA, which is <b>integrated</b> into the host genome as a latent provirus.',
     'Massive replication (10<sup>9</sup>–10<sup>10</sup> virions per day, up to 10<sup>8</sup> mutants per day) evades immunity.',
     'Progressive <b>CD4 depletion</b> by direct viral killing, apoptosis, cytotoxic T-cell killing and lymphoid tissue damage.',
     'Loss of the "master regulator" means CD8, B-cell and macrophage functions fail: cell-mediated immunity collapses.']) +
 P('<b>Linking to the signs:</b> candidiasis reflects failed cell-mediated control of fungi; lymphadenopathy reflects viral replication in lymphoid tissue; weight loss reflects chronic immune activation and opportunistic infection. Next come opportunistic infections (<i>Pneumocystis</i>, CMV), neurological disease and tumours (Kaposi sarcoma from HHV-8, lymphoma from EBV).') +
 P('<b>As a dentist:</b> sensitive discussion and referral for testing, treat the candidiasis, standard precautions. Treatment is combination ART.'),
 ['Suggests HIV infection / AIDS (AIDS-related complex)',
  'Notes the need to confirm by testing, or considers differentials',
  'gp120 binds CD4, with CCR5/CXCR4 co-receptors',
  'Reverse transcription and integration (latent provirus)',
  'High replication and mutation rate',
  'Mechanisms of CD4 depletion',
  'Consequences of losing CD4 help (cell-mediated immunity fails)',
  'Links candidiasis, weight loss, lymphadenopathy to pathogenesis',
  'Clinical stages or later complications (opportunistic infections, tumours)',
  'Management or dental role (referral, ART, treat candida)']);

S('sc-hiv2','L5C','Oral lesions suggesting HIV','hiv',
 'A 30-year-old man has white, corrugated patches on both lateral borders of the tongue that cannot be wiped off, and red patches on the palate. He mentions night sweats. What are the lesions, what do they suggest, and what is your approach?',
 P('<b>Lesions:</b> oral hairy leukoplakia (EBV; bilateral, corrugated, lateral tongue, does not wipe off) and erythematous candidosis (red palatal patches).') +
 P('<b>Significance:</b> both are strongly associated with HIV and other immunosuppression. With night sweats (part of the AIDS-related complex), advanced HIV is a real possibility. CD4 loss removes the cell-mediated control that normally keeps EBV latent and <i>Candida</i> commensal.') +
 P('<b>Examine for other lesions:</b> pseudomembranous candidosis, angular cheilitis, herpes simplex, necrotising gingivitis or periodontitis, Kaposi sarcoma, lymphadenopathy.') +
 P('<b>Approach:</b> take a careful, non-judgemental history (risk factors, weight loss, other infections); consider other causes of immunosuppression (diabetes, steroids, leukaemia); refer sensitively to his GP or a sexual health service for HIV testing; treat the candidiasis with an antifungal; standard precautions apply to every patient, so infection control does not change.'),
 ['Identifies oral hairy leukoplakia with its features',
  'Identifies erythematous candidosis',
  'Links both to HIV / immunosuppression',
  'Night sweats as a systemic (AIDS-related complex) feature',
  'Explains via loss of CD4 cell-mediated control (EBV reactivation, fungal overgrowth)',
  'Looks for other HIV-associated oral lesions',
  'Considers other causes of immunosuppression',
  'Sensitive referral for testing',
  'Treats the candidiasis; standard precautions']);

S('sc-hiv3','L5C','Needle-stick injury','hiv',
 'While clearing up after treating a patient with known HIV, you sustain a deep needle-stick injury from a used local anaesthetic needle. Discuss the risk of transmission and your management.',
 P('<b>Risk:</b> about 0.3% seroconversion per percutaneous exposure. It is higher with a deep injury, visible blood, a hollow needle that was in a vessel, or a source with high viral load, and negligible if the source\'s viral load is undetectable on treatment. Hepatitis B and C carry higher risks than HIV.') +
 OL(['First aid: wash with soap and running water; do not scrub.',
     'Report to a supervisor and document the incident.',
     'Assess the source: viral load, treatment, co-infections (test with consent).',
     'Baseline tests for yourself: HIV, hepatitis B (and immunity), hepatitis C.',
     'Post-exposure prophylaxis: 28 days of antiretrovirals, started as soon as possible and no later than 72 hours.',
     'Follow-up testing and counselling.']) +
 P('<b>Prevention:</b> standard precautions, no recapping by hand, immediate sharps disposal, hepatitis B vaccination.'),
 ['Quotes about 0.3% risk',
  'Factors that increase risk',
  'Undetectable source viral load means negligible risk',
  'First aid: soap and water, no scrubbing',
  'Report and document',
  'Source assessment',
  'Baseline tests for the injured person',
  'PEP started early, within 72 h, for 28 days',
  'Follow-up testing',
  'Prevention measures']);

S('sc-first','L4','Biopsy wound (first intention)','',
 'A patient has a surgical incision for a biopsy. Describe the expected healing process, including cellular and tissue events. Why does this wound heal by first intention? What factors could impair this healing?',
 P('<b>Why first intention:</b> a clean surgical incision with very little damage either side, edges closely approximated by sutures, aseptic conditions.') +
 T(['Time','Events'],[
  ['Immediately','Clot (fibrin) fills the narrow gap; scab forms'],
  ['24 h','Neutrophils at margins; basal epithelial cells divide'],
  ['24–48 h','Epithelium migrates from both edges (EGF, KGF) and meets beneath the scab; contact inhibition stops it'],
  ['Day 3','Macrophages replace neutrophils; granulation tissue begins'],
  ['Day 5','Capillaries proliferate (VEGF); fibroblasts migrate into the fibrin network (PDGF) and secrete collagen that bridges the gap'],
  ['Weeks','Collagen accumulates and remodels (TGF-β); inflammation subsides; thin linear scar; elastic fibres not reconstructed']]) +
 P('<b>Impairing factors:</b> local (infection, tension or mobility, foreign bodies, poor blood supply, previous irradiation) and systemic (diabetes, steroids, immunosuppression, age, poor nutrition, smoking, stress).'),
 ['Explains why it is first intention (clean, approximated, minimal loss)',
  'Clot and scab formation',
  'Neutrophils then macrophages',
  'Epithelial migration and bridging in 24–48 h; contact inhibition',
  'Neovascularisation and fibroblast collagen synthesis',
  'Growth factors named with roles',
  'Maturation to a thin scar; elastic fibres not rebuilt',
  'Local impairing factors',
  'Systemic impairing factors']);

S('sc-second','L4','Deep laceration (second intention)','',
 'A patient suffers a large, deep laceration on the leg with significant tissue loss. Describe how this wound heals. Why does it heal by second intention, and how will the outcome differ from healing by first intention?',
 P('<b>Why second intention:</b> tissue loss, gaping margins that cannot be approximated, haemorrhage, contamination and infection.') +
 OL(['Large fibrin clot fills the defect.',
     'Intense acute inflammation: neutrophils, then macrophages phagocytose debris and dead tissue.',
     'Abundant granulation tissue grows up from the base: new capillaries (VEGF), fibroblasts (PDGF), macrophages.',
     'Epithelium regenerates slowly from the margins across the granulation tissue (EGF, KGF).',
     'Myofibroblasts contract the wound (TGF-β), reducing its size.',
     'Collagen is deposited and remodelled into a scar.']) +
 T(['Outcome','Compared with first intention'],[
  ['Scar','Larger, may be depressed or hypertrophic'],
  ['Time','Longer'],
  ['Contraction','Marked; risk of contracture and impaired mobility'],
  ['Infection','Higher risk'],
  ['Function','Permanent tissues (skeletal muscle, nerve) replaced by scar, so function may be lost']]),
 ['Explains why it is second intention',
  'Large clot and intense inflammation with debris removal',
  'Abundant granulation tissue from the base',
  'Slow re-epithelialisation from margins',
  'Wound contraction by myofibroblasts',
  'Collagen deposition, larger scar',
  'Compares outcome: time, scar, contraction or contracture, infection',
  'Permanent cells replaced by scar']);

S('sc-abscess','L3A','Abscess','',
 'A patient presents with a localised collection of pus (abscess). Explain the pathophysiological process leading to abscess formation and what this represents in terms of the outcomes of acute inflammation. What are the potential complications if it is left untreated?',
 P('<b>Process:</b> pyogenic bacteria (e.g. staphylococci) cause acute inflammation: vasodilation, increased permeability and exudate, then neutrophil emigration (margination, adhesion, diapedesis, chemotaxis). Neutrophils phagocytose bacteria, many die, and their lysosomal enzymes liquefy the surrounding tissue. The result is <b>pus</b>: neutrophils (living and dead), necrotic debris, bacteria and oedema fluid.') +
 P('The pus is walled off by a zone of neutrophils, then granulation tissue and fibrosis: the body\'s attempt to contain it. Defence cells and antibiotics cannot reach the centre, so drainage is needed.') +
 P('<b>Represents:</b> <b>suppuration</b>, one of the four outcomes of acute inflammation (with resolution, repair and chronic inflammation). Once drained, it heals by organisation and scarring.') +
 P('<b>Complications:</b> spread (cellulitis, fascial-space infection), sinus or fistula formation, bacteraemia and sepsis, a chronic abscess, osteomyelitis if bone is involved.'),
 ['Pyogenic bacteria trigger acute inflammation',
  'Vascular changes and neutrophil emigration',
  'Neutrophil death and enzyme release liquefy tissue',
  'Defines pus',
  'Walling off by granulation tissue and fibrosis',
  'Identifies suppuration as an outcome of acute inflammation',
  'Centre inaccessible, so drainage needed',
  'Complications: spread, sinus or fistula, sepsis, chronicity, osteomyelitis']);

S('sc-atrophy','L2','Atrophy after bed rest','',
 'A patient has significant muscle wasting in the legs after prolonged bed rest following a hip fracture. Explain the process underlying this atrophy. Is it physiological or pathological?',
 P('<b>Atrophy</b> is a decrease in the size and/or number of cells. Here it is <b>disuse atrophy</b> from decreased function.') +
 P('<b>Mechanism:</b> reduced workload lowers the demand for contractile protein. Protein synthesis falls and breakdown rises (with autophagy of organelles), so muscle fibres shrink. This is an adaptation: the cell reduces its size and metabolic needs to match lower demand, and survives.') +
 P('<b>Classification:</b> <b>pathological</b> atrophy (the lecture\'s pathological causes include decreased function, loss of innervation, loss of blood supply, pressure, lack of nutrition, loss of stimulation). Physiological atrophy is part of development and ageing.') +
 P('<b>Outcome:</b> reversible with remobilisation and physiotherapy if the stimulus is restored in time. Dental parallel: residual ridge atrophy after tooth loss.'),
 ['Defines atrophy',
  'Identifies disuse (decreased function) as the cause',
  'Mechanism: less protein synthesis, more breakdown, autophagy',
  'Frames it as adaptation to lower demand',
  'Classifies as pathological, with reasoning',
  'Contrasts physiological atrophy (development, ageing)',
  'Reversibility with remobilisation']);

S('sc-barrett','L2','Barrett oesophagus','',
 'A patient is diagnosed with Barrett oesophagus, where the normal oesophageal lining is replaced with intestinal-type epithelium (metaplasia). What are the implications of this metaplastic change, and what are the contributing factors?',
 P('<b>Metaplasia:</b> transformation of one mature tissue type into another, here stratified squamous into intestinal-type columnar epithelium. It arises by reprogramming of stem or reserve cells, not by mature cells changing.') +
 P('<b>Why it happens:</b> chronic acid (and bile) reflux injures squamous epithelium; columnar mucus-secreting epithelium resists acid better, so the change is adaptive.') +
 P('<b>Implications:</b> loss of the normal squamous lining; persistent stimulus can lead to <b>dysplasia and oesophageal adenocarcinoma</b>, so patients are placed under endoscopic surveillance. Metaplasia is in principle reversible if the stimulus is removed, but established Barrett oesophagus often persists.') +
 P('<b>Contributing factors:</b> chronic gastro-oesophageal reflux disease, hiatus hernia, obesity, smoking, male sex, older age.'),
 ['Defines metaplasia',
  'Squamous to intestinal-type columnar change',
  'Arises from stem or reserve cell reprogramming',
  'Chronic acid reflux as the stimulus; adaptive advantage',
  'Risk of dysplasia and adenocarcinoma',
  'Surveillance implication',
  'Reversibility discussed',
  'Other contributing factors listed']);

S('sc-contact','L5A','Toothpaste contact allergy','',
 'Two days after starting a new cinnamon-flavoured toothpaste, a patient develops dry, cracked, swollen lips with angular cracking and burning of the tongue. What type of reaction is this, what is the mechanism, and how would you confirm and manage it?',
 P('<b>Type IV (delayed-type) hypersensitivity</b>: allergic contact reaction to a flavouring (cinnamon). Cheilitis is the commonest presentation of toothpaste allergy.') +
 P('<b>Mechanism:</b> the flavouring acts as a <b>hapten</b>, binding mucosal proteins to form an immunogenic complex.') +
 UL(['<b>Induction</b> (an earlier exposure, e.g. cinnamon in food): Langerhans cells present the complex with MHC II to T cells in the lymph node, creating sensitised memory T cells.',
     '<b>Elicitation</b> (now): effector T cells migrate to the site, Th1 cells release IFN-γ to activate macrophages, TNF upregulates adhesion molecules, and inflammation develops over 12–48 hours.']) +
 P('A reaction within 2 days fits elicitation in someone already sensitised. It differs from type I, which appears within minutes as urticaria or angioedema.') +
 P('<b>Confirm:</b> temporal relationship; patch testing (48 h under cover, read at 2 and 4 days); the stop–restart method is the most reliable.') +
 P('<b>Manage:</b> stop the product; use an unflavoured or bland toothpaste; emollient for lips; topical steroid if needed.'),
 ['Identifies type IV hypersensitivity',
  'Hapten concept',
  'Induction phase: Langerhans cells, MHC II, T-cell sensitisation',
  'Elicitation phase: effector T cells, cytokines, 12–48 h',
  'Explains the need for prior sensitisation',
  'Cheilitis as the typical toothpaste presentation; flavourings as common allergens',
  'Patch test method and reading',
  'Stop–restart as best confirmation',
  'Management',
  'Distinguishes from type I']);

S('sc-transplant','L5B','Transplant patient','',
 'A 50-year-old kidney transplant recipient on long-term immunosuppression attends for treatment. Explain how the graft could be rejected and what types of rejection occur. Which complications of immunosuppression matter to you as a dentist?',
 P('<b>Pathogenesis:</b> afferent phase: allorecognition, where donor MHC on donor dendritic cells is recognised by the recipient\'s CD4 T cells. Effector phase: CD4 cells enter the graft and recruit macrophages, CD8 T cells, NK cells and B cells with IL-2 and IFN-γ; the targets are the endothelium and parenchymal cells.') +
 T(['Type','Timing','Features'],[
  ['Hyperacute','Minutes–hours','Pre-formed antibody against donor MHC class I; complement, platelets, vessel obstruction, infarction; graft removed'],
  ['Acute','Days–weeks','CD8 T cells and NK cells; reversed by immunosuppression'],
  ['Chronic','Months–years','Slowly progressive failure and hypertension; unresponsive to immunosuppression']]) +
 P('<b>Complications that matter:</b> infection (CMV, fungal such as <i>Candida</i> and <i>Cryptococcus</i>) and poor healing after extractions; malignancy about 40 times more common (Kaposi sarcoma, lymphoma), so examine the mucosa and lips carefully; cardiovascular risk (MI) from steroid-aggravated hypertension, lipids and diabetes.'),
 ['Afferent phase: allorecognition by recipient CD4 T cells',
  'Effector phase: recruited cells and targets',
  'Hyperacute rejection correctly described',
  'Acute rejection correctly described',
  'Chronic rejection correctly described',
  'Infection risk (CMV, fungal)',
  'Malignancy risk about 40 times (Kaposi sarcoma, lymphoma)',
  'Cardiovascular risk',
  'Dental implications (healing, mucosal examination)']);

</script>
<script>
(function(){
'use strict';
var LECS = [
  {k:'L1', n:'Introduction to pathology'},
  {k:'L2', n:'Cell injury and adaptation'},
  {k:'L3A', n:'Acute inflammation'},
  {k:'L3B', n:'Chronic inflammation'},
  {k:'L4', n:'Healing and repair'},
  {k:'L5A', n:'Hypersensitivity'},
  {k:'L5B', n:'Autoimmunity and transplantation'},
  {k:'L5C', n:'Immunodeficiency and HIV'},
  {k:'Mix', n:'Across lectures'}
];
var LECNAME = {}; LECS.forEach(function(x){ LECNAME[x.k]=x.n; });
var FOCI = [
  {k:'socket', n:'Socket healing'},
  {k:'perio', n:'Gingivitis vs periodontitis'},
  {k:'t1', n:'Type I hypersensitivity'},
  {k:'hiv', n:'HIV'}
];
var KEY = 'doh233-exam-recall-v1';
var MOCK_MIN = 60;

var ALL = CARDS.concat(SCENS);
var BYID = {};
ALL.forEach(function(it){
  BYID[it.id] = it;
  var tmp = document.createElement('div'); tmp.innerHTML = it.a;
  it.txt = (it.t + ' ' + it.q + ' ' + tmp.textContent + ' ' + (it.pts ? it.pts.join(' ') : '')).toLowerCase();
});

/* ---------- storage ---------- */
var store = {c:{}, sc:{}, tab:'bank'};
try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && typeof p === 'object') { store.c = p.c || {}; store.sc = p.sc || {}; store.tab = p.tab || 'bank'; } } } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }

/* ---------- state ---------- */
var st = { tab: store.tab, lec:'all', focus:'all', q:'', bankType:'all', hideGot:false, revealAll:false,
  fsSource:'due', fsShuffle:true, fs:null, sv:{mode:'list', ids:[], i:0, mock:null} };

function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function matches(it){
  if (st.lec !== 'all' && it.l !== st.lec) return false;
  if (st.focus !== 'all' && it.f !== st.focus) return false;
  if (st.q && it.txt.indexOf(st.q) === -1) return false;
  return true;
}
function statusOf(id){ var r = store.c[id]; return r ? r.s : ''; }

/* ---------- scheduling ---------- */
function nextIvl(id, g){
  var r = store.c[id] || {ivl:0};
  if (g === 'good') return r.ivl > 0 ? Math.max(r.ivl*2.5, 1) : 1/3;
  if (g === 'easy') return r.ivl > 0 ? Math.max(r.ivl*3.5, 2) : 2;
  return 0;
}
function fmtIvl(d){ if (d < 1) return Math.round(d*24) + ' h'; return Math.round(d) + (Math.round(d) === 1 ? ' day' : ' days'); }
function applyGrade(id, g){
  var now = Date.now();
  var r = store.c[id] || {ivl:0, n:0};
  r.n = (r.n||0) + 1;
  if (g === 'again' || g === 'missed'){ r.s='missed'; r.ivl=0; r.due=now; }
  else if (g === 'hard' || g === 'shaky'){ r.s='shaky'; r.ivl=0; r.due=now + 10*60*1000; }
  else { var gg = (g === 'got') ? 'good' : g; r.ivl = nextIvl(id, gg); r.s='got'; r.due = now + r.ivl*864e5; }
  store.c[id] = r; save();
}

/* ---------- header, tabs, filters ---------- */
function buildFilters(){
  var lr = $('#lecRow'); lr.innerHTML = '';
  var chips = [{k:'all', n:'All lectures'}].concat(LECS);
  chips.forEach(function(x){
    var b = el('button', 'chip', x.k === 'all' ? 'All' : esc(x.k));
    b.type = 'button'; b.dataset.lec = x.k; b.title = x.n || 'All lectures';
    b.setAttribute('aria-pressed', st.lec === x.k ? 'true' : 'false');
    b.addEventListener('click', function(){ st.lec = x.k; buildFilters(); refresh(); });
    lr.appendChild(b);
  });
  var fr = $('#focusRow'); fr.innerHTML = '';
  var lab = el('span', 'rowlabel', 'Predicted'); fr.appendChild(lab);
  [{k:'all', n:'All'}].concat(FOCI).forEach(function(x){
    var b = el('button', 'chip' + (x.k !== 'all' ? ' chip-focus' : ''), esc(x.n));
    b.type = 'button'; b.setAttribute('aria-pressed', st.focus === x.k ? 'true' : 'false');
    b.addEventListener('click', function(){ st.focus = x.k; buildFilters(); refresh(); });
    fr.appendChild(b);
  });
}
function setTab(t){
  st.tab = t; store.tab = t; save();
  if (t !== 'flash') document.body.classList.remove('in-session');
  $$('.tab').forEach(function(b){ var on = b.dataset.tab === t; b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; });
  $$('.view').forEach(function(v){ v.hidden = v.id !== 'view-' + t; });
  refresh();
}
function refresh(){
  renderTally();
  if (st.tab === 'bank') renderBank();
  else if (st.tab === 'flash') renderFlash();
  else renderScen();
}

/* ---------- tally ---------- */
function renderTally(){
  var items = CARDS.filter(matches);
  var c = {got:0, shaky:0, missed:0, un:0};
  items.forEach(function(it){ var s = statusOf(it.id); if (s) c[s]++; else c.un++; });
  var n = items.length || 1;
  var t = $('#tally');
  t.innerHTML = '';
  var bar = el('div', 'tbar');
  [['got','Got it'],['shaky','Shaky'],['missed','Missed'],['un','Not yet seen']].forEach(function(p){
    var seg = el('span', 'seg seg-' + p[0]); seg.style.flexGrow = c[p[0]]; bar.appendChild(seg);
  });
  bar.setAttribute('role','img');
  bar.setAttribute('aria-label', c.got + ' got it, ' + c.shaky + ' shaky, ' + c.missed + ' missed, ' + c.un + ' not yet seen');
  t.appendChild(bar);
  var leg = el('p', 'tleg',
    '<span class="li"><span class="k k-got"></span>Got it <b>' + c.got + '</b></span>' +
    '<span class="li"><span class="k k-shaky"></span>Shaky <b>' + c.shaky + '</b></span>' +
    '<span class="li"><span class="k k-missed"></span>Missed <b>' + c.missed + '</b></span>' +
    '<span class="li"><span class="k k-un"></span>Not yet seen <b>' + c.un + '</b></span>');
  t.appendChild(leg);
  var rb = el('button', 'linkbtn reset', 'Reset progress'); rb.type = 'button';
  var armed = false, tm;
  rb.addEventListener('click', function(){
    if (!armed){ armed = true; rb.textContent = 'Click again to erase all progress'; tm = setTimeout(function(){ armed = false; rb.textContent = 'Reset progress'; }, 3500); return; }
    clearTimeout(tm); store.c = {}; store.sc = {}; save(); st.fs = null; refresh();
  });
  t.appendChild(rb);
}

/* ---------- shared card pieces ---------- */
function topicLine(it){
  return '<span class="topic">' + esc(it.t) + '</span>' + (it.f ? '<span class="pred"><i aria-hidden="true"></i>Predicted</span>' : '') + (it.s ? '<span class="stype">Scenario</span>' : '');
}
function pointsHTML(it){
  return '<h4 class="pts-h">Marking points</h4>' + '<ul class="pts-plain">' + it.pts.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
}

/* ---------- question bank ---------- */
function renderBank(){
  var list = $('#bankList');
  list.innerHTML = '';
  var items = ALL.filter(function(it){
    if (!matches(it)) return false;
    if (st.bankType === 'cards' && it.s) return false;
    if (st.bankType === 'scen' && !it.s) return false;
    if (st.hideGot && statusOf(it.id) === 'got') return false;
    return true;
  });
  $$('#bankType button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.v === st.bankType ? 'true' : 'false'); });
  $('#hideGot').checked = st.hideGot;
  $('#revealAll').textContent = st.revealAll ? 'Hide all answers' : 'Show all answers';
  if (!items.length){
    list.appendChild(el('p', 'empty', 'No matches.'));
    return;
  }
  var cur = null, grp;
  items.forEach(function(it){
    if (it.l !== cur){
      cur = it.l;
      grp = el('section', 'grp');
      grp.appendChild(el('h2', 'grp-h', '<span class="grp-code">' + esc(it.l) + '</span> ' + esc(LECNAME[it.l])));
      list.appendChild(grp);
    }
    grp.appendChild(bankItem(it));
  });
}
function bankItem(it){
  var art = el('article', 'item');
  art.dataset.id = it.id;
  var s = statusOf(it.id); if (s) art.classList.add('is-' + s);
  var lab = el('div', 'item-label', '<span class="code">' + esc(it.l) + '</span><span class="dot" aria-hidden="true"></span>');
  var body = el('div', 'item-body');
  body.appendChild(el('p', 'meta', topicLine(it)));
  body.appendChild(el('h3', 'q', esc(it.q)));
  var btn = el('button', 'btn btn-reveal', 'Show answer'); btn.type = 'button';
  btn.setAttribute('aria-expanded', 'false');
  var ans = el('div', 'ans');
  ans.hidden = true;
  var ansId = 'ans-' + it.id; ans.id = ansId; btn.setAttribute('aria-controls', ansId);
  ans.innerHTML = (it.s ? '<h4 class="pts-h">Model answer</h4>' : '') + it.a + (it.s ? pointsHTML(it) : '');
  var gr = el('div', 'grades grades-3');
  [['missed','Missed it'],['shaky','Shaky'],['got','Got it']].forEach(function(p){
    var b = el('button', 'gbtn g-' + p[0], p[1]); b.type = 'button';
    b.setAttribute('aria-pressed', s === p[0] ? 'true' : 'false');
    b.addEventListener('click', function(){
      applyGrade(it.id, p[0]);
      art.classList.remove('is-got','is-shaky','is-missed'); art.classList.add('is-' + p[0]);
      $$('.gbtn', gr).forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      renderTally();
    });
    gr.appendChild(b);
  });
  ans.appendChild(gr);
  function setOpen(open){ ans.hidden = !open; btn.textContent = open ? 'Hide answer' : 'Show answer'; btn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  btn.addEventListener('click', function(){ setOpen(ans.hidden); });
  if (st.revealAll) setOpen(true);
  body.appendChild(btn); body.appendChild(ans);
  art.appendChild(lab); art.appendChild(body);
  return art;
}

/* ---------- flashcards ---------- */
function flashPool(){
  var now = Date.now();
  return CARDS.filter(matches).filter(function(it){
    var r = store.c[it.id];
    if (st.fsSource === 'due') return !r || !r.due || r.due <= now;
    if (st.fsSource === 'weak') return r && (r.s === 'missed' || r.s === 'shaky');
    return true;
  });
}
function renderFlash(){
  var v = $('#flashArea'); v.innerHTML = '';
  document.body.classList.toggle('in-session', !!(st.tab === 'flash' && st.fs && st.fs.cur));
  if (st.fs && st.fs.cur) return renderSession(v);
  if (st.fs && !st.fs.cur) return renderSummary(v);
  renderSetup(v);
}
function renderSetup(v){
  var pool = flashPool();
  var box = el('div', 'setup');
  var seg = el('div', 'seg-ctl'); seg.setAttribute('role','group'); seg.setAttribute('aria-label','Which cards');
  [['due','Due now'],['all','Everything'],['weak','Weak only']].forEach(function(p){
    var b = el('button', 'segbtn', '<b>' + p[1] + '</b>'); b.type = 'button';
    b.setAttribute('aria-pressed', st.fsSource === p[0] ? 'true' : 'false');
    b.addEventListener('click', function(){ st.fsSource = p[0]; renderFlash(); });
    seg.appendChild(b);
  });
  box.appendChild(seg);
  var opt = el('label', 'check', '<input type="checkbox" id="fsShuffle"' + (st.fsShuffle ? ' checked' : '') + '> Shuffle');
  box.appendChild(opt);
  $('input', opt).addEventListener('change', function(e){ st.fsShuffle = e.target.checked; });
  var go = el('button', 'btn btn-primary', pool.length ? 'Start ' + pool.length + (pool.length === 1 ? ' card' : ' cards') : 'Nothing due');
  go.type = 'button'; go.disabled = !pool.length;
  go.addEventListener('click', function(){ startSession(pool.map(function(x){ return x.id; })); });
  box.appendChild(go);
  v.appendChild(box);
}
function startSession(ids){
  if (st.fsShuffle) shuffle(ids);
  st.fs = {queue: ids, cur: null, revealed: false, done: 0, total: ids.length, tally:{again:0, hard:0, good:0, easy:0}};
  st.fs.cur = st.fs.queue.shift();
  renderFlash();
  var s = $('.slide'); if (s){ s.focus({preventScroll:true}); var top = $('#flashArea').getBoundingClientRect().top; if (top < 0 || top > window.innerHeight * 0.5) $('#flashArea').scrollIntoView({block:'start'}); }
}
function renderSession(v){
  var fs = st.fs, it = BYID[fs.cur];
  var top = el('div', 'fs-top');
  top.appendChild(el('p', 'fs-count', '<b>' + (fs.queue.length + 1) + '</b> left, <b>' + fs.done + '</b> done'));
  var end = el('button', 'linkbtn', 'End session'); end.type = 'button';
  end.addEventListener('click', function(){ st.fs.cur = null; renderFlash(); renderTally(); });
  top.appendChild(end);
  v.appendChild(top);
  var slide = el('article', 'slide'); slide.tabIndex = -1;
  slide.setAttribute('aria-label', 'Flashcard, ' + it.l + ', ' + it.t);
  slide.appendChild(el('div', 'slide-label', '<span class="code">' + esc(it.l) + '</span><span class="lname">' + esc(LECNAME[it.l]) + '</span>' + (it.f ? '<span class="pred"><i aria-hidden="true"></i>Predicted</span>' : '')));
  var spec = el('div', 'specimen');
  spec.appendChild(el('p', 'meta', '<span class="topic">' + esc(it.t) + '</span>'));
  spec.appendChild(el('h3', 'fq', esc(it.q)));
  if (fs.revealed){
    var ans = el('div', 'ans ans-flash', it.a);
    spec.appendChild(ans);
  }
  slide.appendChild(spec);
  v.appendChild(slide);
  var ctl = el('div', 'fs-ctl');
  if (!fs.revealed){
    var rb = el('button', 'btn btn-primary btn-wide', 'Show answer <kbd>Space</kbd>'); rb.type = 'button';
    rb.addEventListener('click', reveal);
    ctl.appendChild(rb);
  } else {
    var g = el('div', 'grades grades-4');
    [['again','Again','soon',1],['hard','Hard','later today',2],['good','Good',fmtIvl(nextIvl(it.id,'good')),3],['easy','Easy',fmtIvl(nextIvl(it.id,'easy')),4]].forEach(function(p){
      var b = el('button', 'gbtn g-' + p[0], '<span>' + p[1] + ' <kbd>' + p[3] + '</kbd></span><small>' + p[2] + '</small>'); b.type = 'button';
      b.addEventListener('click', function(){ gradeFlash(p[0]); });
      g.appendChild(b);
    });
    ctl.appendChild(g);
  }
  v.appendChild(ctl);
}
function reveal(){ if (!st.fs || !st.fs.cur || st.fs.revealed) return; st.fs.revealed = true; renderFlash(); var s = $('.slide'); if (s) s.focus({preventScroll:true}); }
function gradeFlash(g){
  var fs = st.fs; if (!fs || !fs.cur || !fs.revealed) return;
  applyGrade(fs.cur, g);
  fs.tally[g]++;
  if (g === 'again') fs.queue.splice(Math.min(2, fs.queue.length), 0, fs.cur);
  else if (g === 'hard') fs.queue.splice(Math.min(6, fs.queue.length), 0, fs.cur);
  else fs.done++;
  fs.cur = fs.queue.shift() || null;
  fs.revealed = false;
  renderTally();
  renderFlash();
  var s = $('.slide'); if (s) s.focus({preventScroll:true});
  var area = $('#flashArea'); if (area && area.getBoundingClientRect().top < 0) area.scrollIntoView({block:'start'});
}
function renderSummary(v){
  var fs = st.fs;
  var box = el('div', 'setup');
  box.appendChild(el('h2', 'h2', 'Done'));
  box.appendChild(el('p', 'note', 'Again ' + fs.tally.again + ', Hard ' + fs.tally.hard + ', Good ' + fs.tally.good + ', Easy ' + fs.tally.easy));
  var row = el('div', 'btnrow');
  var w = el('button', 'btn btn-primary', 'Weak cards'); w.type = 'button';
  w.addEventListener('click', function(){ st.fsSource = 'weak'; var p = flashPool(); if (p.length) startSession(p.map(function(x){return x.id;})); else { st.fs = null; renderFlash(); } });
  var b = el('button', 'btn', 'Back'); b.type = 'button';
  b.addEventListener('click', function(){ st.fs = null; renderFlash(); });
  row.appendChild(w); row.appendChild(b); box.appendChild(row);
  v.appendChild(box);
}
document.addEventListener('keydown', function(e){
  if (st.tab !== 'flash' || !st.fs || !st.fs.cur) return;
  var tg = e.target && e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!st.fs.revealed && (e.key === ' ' || e.key === 'Enter')){ if (tg === 'BUTTON' && e.key === 'Enter') return; e.preventDefault(); reveal(); return; }
  if (st.fs.revealed){ var m = {'1':'again','2':'hard','3':'good','4':'easy'}[e.key]; if (m){ e.preventDefault(); gradeFlash(m); } }
});

/* ---------- scenarios ---------- */
var timerId = null;
function scenList(){ return SCENS.filter(matches); }
function renderScen(){
  var v = $('#scenArea'); v.innerHTML = '';
  if (st.sv.mode === 'one') return renderOneScen(v);
  var mock = el('div', 'setup mockbox');
  var mb = el('button', 'btn btn-primary', 'Start ' + MOCK_MIN + '-minute mock (5 scenarios)'); mb.type = 'button';
  mb.addEventListener('click', startMock);
  mock.appendChild(mb);
  v.appendChild(mock);
  var list = scenList();
  if (!list.length){ v.appendChild(el('p', 'empty', 'No matches.')); return; }
  var ul = el('div', 'scen-list');
  list.forEach(function(it, idx){
    var r = store.sc[it.id];
    var best = r && r.best != null ? '<span class="best">' + r.best + '/' + it.pts.length + '</span>' : '<span></span>';
    var b = el('button', 'scen-item', '<span class="code">' + esc(it.l) + '</span><span class="scen-txt"><span class="meta">' + topicLine(it).replace('<span class="stype">Scenario</span>','') + '</span><span class="scen-q">' + esc(it.q) + '</span></span>' + best);
    b.type = 'button';
    b.addEventListener('click', function(){ st.sv = {mode:'one', ids:list.map(function(x){return x.id;}), i:idx, mock:null}; renderScen(); window.scrollTo(0, $('#scenArea').offsetTop - 12); });
    ul.appendChild(b);
  });
  v.appendChild(ul);
}
function startMock(){
  var ids = [];
  FOCI.forEach(function(f){ var c = SCENS.filter(function(s){ return s.f === f.k; }); ids.push(c[Math.floor(Math.random()*c.length)].id); });
  var other = SCENS.filter(function(s){ return !s.f; });
  ids.push(other[Math.floor(Math.random()*other.length)].id);
  shuffle(ids);
  st.sv = {mode:'one', ids:ids, i:0, mock:{end: Date.now() + MOCK_MIN*60000, finished:false}};
  ids.forEach(function(id){ var r = store.sc[id] || {}; r.ans = ''; r.ticks = []; r.shown = false; store.sc[id] = r; });
  save();
  startTimer();
  renderScen();
  window.scrollTo(0, $('#scenArea').offsetTop - 12);
}
function startTimer(){
  if (timerId) clearInterval(timerId);
  timerId = setInterval(function(){
    var m = st.sv.mock;
    if (!m || m.finished){ clearInterval(timerId); timerId = null; return; }
    var left = m.end - Date.now();
    var t = $('#mockTimer');
    if (left <= 0){ finishMock(true); return; }
    if (t){ t.textContent = fmtClock(left); t.classList.toggle('low', left < 5*60000); }
  }, 1000);
}
function fmtClock(ms){ var s = Math.max(0, Math.round(ms/1000)); var m = Math.floor(s/60); s = s % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
function finishMock(timeUp){
  var m = st.sv.mock; if (!m) return;
  m.finished = true; m.timeUp = !!timeUp; st.sv.i = 0;
  if (timerId){ clearInterval(timerId); timerId = null; }
  if (st.tab === 'scen') renderScen();
}
function renderOneScen(v){
  var sv = st.sv, it = BYID[sv.ids[sv.i]];
  var rec = store.sc[it.id] || {}; store.sc[it.id] = rec;
  var mock = sv.mock, locked = mock && !mock.finished;
  var bar = el('div', 'scen-bar');
  var back = el('button', 'linkbtn', mock ? (mock.finished ? 'Exit mock' : 'Quit mock') : 'Back'); back.type = 'button';
  back.addEventListener('click', function(){ if (timerId){ clearInterval(timerId); timerId = null; } st.sv = {mode:'list', ids:[], i:0, mock:null}; renderScen(); });
  bar.appendChild(back);
  bar.appendChild(el('span', 'scen-pos', (sv.i+1) + ' of ' + sv.ids.length));
  if (locked){ var tmr = el('span', 'timer', fmtClock(mock.end - Date.now())); tmr.id = 'mockTimer'; bar.appendChild(tmr); }
  else if (mock && mock.finished){ bar.appendChild(el('span', 'timer done', mock.timeUp ? 'Time up' : 'Finished')); }
  v.appendChild(bar);
  var slide = el('article', 'slide slide-scen');
  slide.appendChild(el('div', 'slide-label', '<span class="code">' + esc(it.l) + '</span><span class="lname">' + esc(LECNAME[it.l]) + '</span>' + (it.f ? '<span class="pred"><i aria-hidden="true"></i>Predicted</span>' : '')));
  var spec = el('div', 'specimen');
  spec.appendChild(el('p', 'meta', '<span class="topic">' + esc(it.t) + '</span>'));
  spec.appendChild(el('h3', 'fq', esc(it.q)));
  var lab = el('label', 'sr', 'Your answer'); lab.htmlFor = 'ta-' + it.id;
  var ta = el('textarea', 'ta'); ta.id = 'ta-' + it.id; ta.rows = 10; ta.value = rec.ans || '';
  ta.placeholder = 'Your answer';
  var tmo;
  ta.addEventListener('input', function(){ clearTimeout(tmo); tmo = setTimeout(function(){ rec.ans = ta.value; save(); }, 400); });
  ta.addEventListener('blur', function(){ rec.ans = ta.value; save(); });
  spec.appendChild(lab); spec.appendChild(ta);
  var wc = el('p', 'wc', ''); spec.appendChild(wc);
  function upd(){ var n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0; wc.textContent = n + (n === 1 ? ' word' : ' words'); }
  ta.addEventListener('input', upd); upd();
  var markArea = el('div', 'mark');
  if (!locked){
    var shown = rec.shown;
    var mb = el('button', 'btn btn-primary', shown ? 'Hide model answer' : 'Mark'); mb.type = 'button';
    mb.addEventListener('click', function(){ rec.ans = ta.value; rec.shown = !rec.shown; save(); renderScen(); });
    markArea.appendChild(mb);
    if (shown){
      var model = el('div', 'ans ans-flash', '<h4 class="pts-h">Model answer</h4>' + it.a);
      markArea.appendChild(model);
      var ticks = rec.ticks || [];
      var cl = el('div', 'checklist');
      var score = el('p', 'score', '');
      function upScore(){ var n = ticks.filter(Boolean).length; score.innerHTML = '<b>' + n + '</b>/' + it.pts.length; if (rec.best == null || n > rec.best) rec.best = n; save(); }
      cl.appendChild(el('h4', 'pts-h', 'Marking points'));
      it.pts.forEach(function(p, i){
        var id = 'pt-' + it.id + '-' + i;
        var row = el('label', 'pt', '<input type="checkbox" id="' + id + '"' + (ticks[i] ? ' checked' : '') + '><span>' + esc(p) + '</span>');
        $('input', row).addEventListener('change', function(e){ ticks[i] = e.target.checked; rec.ticks = ticks; upScore(); });
        cl.appendChild(row);
      });
      cl.appendChild(score);
      markArea.appendChild(cl);
      upScore();
    }
  }
  spec.appendChild(markArea);
  slide.appendChild(spec);
  v.appendChild(slide);
  var nav = el('div', 'btnrow scen-nav');
  var prev = el('button', 'btn', 'Previous'); prev.type = 'button'; prev.disabled = sv.i === 0;
  prev.addEventListener('click', function(){ rec.ans = ta.value; save(); sv.i--; renderScen(); window.scrollTo(0, $('#scenArea').offsetTop - 12); });
  var next = el('button', 'btn', 'Next'); next.type = 'button'; next.disabled = sv.i === sv.ids.length - 1;
  next.addEventListener('click', function(){ rec.ans = ta.value; save(); sv.i++; renderScen(); window.scrollTo(0, $('#scenArea').offsetTop - 12); });
  nav.appendChild(prev); nav.appendChild(next);
  if (locked){ var fin = el('button', 'btn btn-primary', 'Finish mock'); fin.type = 'button'; fin.addEventListener('click', function(){ rec.ans = ta.value; save(); finishMock(false); }); nav.appendChild(fin); }
  v.appendChild(nav);
}

/* ---------- wiring ---------- */
function init(){
  buildFilters();
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){ setTab(b.dataset.tab); });
    b.addEventListener('keydown', function(e){
      var tabs = $$('.tab'), i = tabs.indexOf(b);
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ e.preventDefault(); var j = (i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length; tabs[j].focus(); setTab(tabs[j].dataset.tab); }
    });
  });
  var qt;
  $('#q').addEventListener('input', function(e){ clearTimeout(qt); qt = setTimeout(function(){ st.q = e.target.value.trim().toLowerCase(); refresh(); }, 180); });
  $$('#bankType button').forEach(function(b){ b.addEventListener('click', function(){ st.bankType = b.dataset.v; renderBank(); }); });
  $('#hideGot').addEventListener('change', function(e){ st.hideGot = e.target.checked; renderBank(); });
  $('#revealAll').addEventListener('click', function(){ st.revealAll = !st.revealAll; renderBank(); });
  setTab(['bank','flash','scen'].indexOf(st.tab) >= 0 ? st.tab : 'bank');
}
init();
})();

</script>
