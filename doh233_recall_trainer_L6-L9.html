<script>
const D={"ch": {"1": "Oral infectious disease", "2": "Neoplasia 1", "3": "Neoplasia 2", "4": "Carcinogens", "5": "Cardiovascular & blood", "6": "Respiratory & musculoskeletal"}, "cards": [{"ch": 1, "t": "qa", "q": "Define an opportunistic infection, with an oral example.", "a": "Disease caused by a normally harmless organism, made possible by a change in the host (immunity, saliva, antibiotics, dentures). E.g. candidosis after inhaled steroids; oral hairy leukoplakia in HIV.", "id": "q76"}, {"ch": 1, "t": "qa", "q": "Latent infection — define and name three oral examples.", "a": "The organism persists dormant without disease and can reactivate. HSV-1 (trigeminal ganglion), VZV (shingles), EBV; also latent TB.", "id": "q77"}, {"ch": 1, "t": "qa", "q": "Actinomycosis: organism type, spread, pathognomonic finding, nickname.", "a": "Gram-positive branching anaerobic/micro-aerophilic commensal (A. israelii); spreads by direct extension forming sinuses and fistulae; sulphur granules (colonies surrounded by neutrophils); 'lumpy jaw' — hard, board-like swelling.", "id": "q78"}, {"ch": 1, "t": "qa", "q": "Name the oral treponeme behind ANUG, periodontal disease and syphilis.", "a": "ANUG — T. vincentii (with fusiforms); periodontal disease — T. denticola; syphilis — T. pallidum.", "id": "q79"}, {"ch": 1, "t": "qa", "q": "Give the oral lesion of each stage of syphilis.", "a": "Primary: chancre. Secondary: mucous patches and snail-track ulcers (+ lymphadenopathy). Latent: often none (non-specific white patches). Tertiary: gumma, typically destroying the hard palate; syphilitic leukoplakia.", "id": "q80"}, {"ch": 1, "t": "qa", "q": "Why doesn't M. tuberculosis Gram-stain, and how is it shown?", "a": "Its cell wall is rich in long-chain mycolic acids; it is acid- and alcohol-fast and shown with the Ziehl–Neelsen (or Kinyoun) stain.", "id": "q81"}, {"ch": 1, "t": "qa", "q": "Typical oral lesion of tuberculosis and how it arises.", "a": "A painless ulcer on the dorsum of the tongue (<1% of cases), thought to be implanted from coughed sputum.", "id": "q82"}, {"ch": 1, "t": "qa", "q": "TB numbers: latent prevalence, lifetime risk, treatment.", "a": "~1 in 4 people latent; 5–15% risk of falling ill; 6 months of combination therapy — isoniazid, rifampicin, pyrazinamide, ethambutol.", "id": "q83"}, {"ch": 1, "t": "qa", "q": "What is a prion, and why does it matter for dental instruments?", "a": "A misfolded, protease-resistant form of a normal membrane protein that converts normal protein into itself; no nucleic acid. It resists conventional sterilisation.", "id": "q84"}, {"ch": 1, "t": "qa", "q": "Acquired vs variant CJD.", "a": "Acquired: exposure to brain/nervous tissue, usually medical procedures. Variant: eating meat from cattle with BSE ('mad cow').", "id": "q85"}, {"ch": 1, "t": "qa", "q": "Why can't a positive Candida culture diagnose candidosis?", "a": "Candida is a common commensal; no test distinguishes carriage (saprophytism) from disease. Diagnosis is clinical with a predisposing factor.", "id": "q86"}, {"ch": 1, "t": "qa", "q": "The six categories predisposing to candidal pathogenicity.", "a": "Immune-modulating medications; blood dyscrasias and malignancy; dietary factors; endocrine disorders; immunological disorders; salivary changes.", "id": "q87"}, {"ch": 1, "t": "qa", "q": "The three primary forms of oral candidosis.", "a": "Pseudomembranous (thrush), erythematous, chronic hyperplastic.", "id": "q88"}, {"ch": 1, "t": "qa", "q": "Pseudomembranous candidosis: appearance, wipe test, pseudomembrane composition.", "a": "Creamy-white non-adherent patches that wipe off leaving a red bleeding base; pseudomembrane = hyphae with desquamated cells, fibrin, keratin, necrotic tissue and bacteria.", "id": "q89"}, {"ch": 1, "t": "qa", "q": "Chronic hyperplastic candidosis: appearance, site, patient, significance.", "a": "White well-demarcated plaque that cannot be removed; post-commissural buccal mucosa, tongue, palate; smokers over 35; associated with dysplasia — biopsy.", "id": "q90"}, {"ch": 1, "t": "qa", "q": "List the five Candida-related conditions.", "a": "Denture-associated stomatitis, palatal papillary hyperplasia, angular cheilitis, median rhomboid glossitis, linear gingival erythema.", "id": "q91"}, {"ch": 1, "t": "qa", "q": "Median rhomboid glossitis — site and associations.", "a": "Rhomboid erythematous area of posterior dorsal tongue just anterior to the circumvallate papillae, loss of filiform papillae; smoking and inhaled steroids; hyphae in >85% of biopsies.", "id": "q92"}, {"ch": 1, "t": "qa", "q": "Angular cheilitis — contributors.", "a": "Candida plus staphylococci/streptococci; chronic moisture from loss of OVD or wrinkling, lip licking; iron-deficiency anaemia, B12 deficiency.", "id": "q93"}, {"ch": 1, "t": "qa", "q": "Linear gingival erythema.", "a": "A non-plaque-induced 2–3 mm erythematous band along the gingival margin; mixed fungal/bacterial; markedly more prevalent in HIV.", "id": "q94"}, {"ch": 1, "t": "qa", "q": "Denture hygiene advice for candidosis.", "a": "Remove at night, clean, leave out to dry; weekly soak — 1% sodium hypochlorite for acrylic, chlorhexidine for chrome.", "id": "q95"}, {"ch": 1, "t": "qa", "q": "Miconazole gel: dose and the key interaction.", "a": "2% gel, 2.5 mL QID after meals for 14–21 days. Potentiates warfarin (raises INR) — also some statins.", "id": "q96"}, {"ch": 1, "t": "qa", "q": "Explain how a recurrent HSV-1 infection occurs.", "a": "Primary infection → virus enters sensory nerve endings and travels up the axon → DNA latent in the trigeminal ganglion neuron → trigger (sunlight, stress, illness, hormones) → replication and travel down the nerve → lesion in the same area.", "id": "q97"}, {"ch": 1, "t": "qa", "q": "Primary herpetic gingivostomatitis vs herpes labialis.", "a": "Primary: childhood, prodrome, painful vesicles/ulcers on all mucosa including gingivae, 7–10 days, supportive care. Labialis: reactivation (30–40%), mucocutaneous junction, prodrome → vesicle → pustule → ulcer, aciclovir 5% cream 4-hourly in prodrome.", "id": "q98"}, {"ch": 1, "t": "qa", "q": "Shingles: distribution and commonest trigeminal division; Ramsay Hunt.", "a": "Unilateral dermatomal vesicles after a burning prodrome; ophthalmic division most common. Ramsay Hunt: facial nerve (VII) — vesicles of ear, anterior 2/3 tongue and soft palate with facial palsy.", "id": "q99"}, {"ch": 1, "t": "qa", "q": "Oral hairy leukoplakia: virus, site, appearance, significance.", "a": "EBV; bilateral lateral borders of tongue; white corrugated, does not wipe off; benign, marker of immunosuppression (HIV, ciclosporin, steroids, diabetes).", "id": "q100"}, {"ch": 1, "t": "qa", "q": "Cancers associated with EBV.", "a": "Non-Hodgkin's lymphoma, Burkitt's lymphoma, nasopharyngeal carcinoma.", "id": "q101"}, {"ch": 1, "t": "qa", "q": "HHV-8: tumour and cell of origin.", "a": "Kaposi's sarcoma — malignant neoplasm of lymphatic endothelial cells; most common neoplasm in HIV.", "id": "q102"}, {"ch": 1, "t": "qa", "q": "Herpangina vs primary herpetic gingivostomatitis.", "a": "Herpangina (Coxsackie): small vesicles at the back of the mouth (fauces, uvula, tonsils, soft palate), gingivae spared, no recurrence. HSV: all mucosa including gingivae, recurs.", "id": "q103"}, {"ch": 1, "t": "qa", "q": "What distinguishes hand, foot and mouth disease from HSV?", "a": "Lesions on the palms and soles; preschool outbreaks; Coxsackie, so no recurrence.", "id": "q104"}, {"ch": 1, "t": "qa", "q": "Measles and mumps oral signs.", "a": "Measles: Koplik spots (red with blue-white specks, buccal mucosa) in the prodrome. Mumps: bilateral parotid swelling with normal saliva.", "id": "q105"}, {"ch": 1, "t": "qa", "q": "Name the four benign oral HPV lesions with their types.", "a": "Squamous papilloma (6, 11); verruca vulgaris (lecture 1, 57; texts 2, 4); condyloma acuminatum (6, 11; sexually transmitted, multiple); multifocal epithelial hyperplasia/Heck's (13, 32).", "id": "q106"}, {"ch": 1, "t": "qa", "q": "HPV and oropharyngeal cancer — the key numbers.", "a": "40–80% of oropharyngeal cancers HPV+; 90% HPV 16; base of tongue and tonsil; neck mass; only ~3.6% of oral cavity cancers.", "id": "q107"}, {"ch": 1, "t": "qa", "q": "PrEP, PEP and U=U.", "a": "PrEP: tenofovir + emtricitabine taken by HIV-negative people. PEP: 28 days, started within 72 h. U=U: undetectable viral load is untransmittable (Opposites Attract).", "id": "q108"}, {"ch": 1, "t": "qa", "q": "The most common oral manifestations of HIV.", "a": "Candidosis (all forms), oral hairy leukoplakia, aphthous-like ulcers, Kaposi's sarcoma, herpes simplex and zoster, HPV warts, periodontal disease (LGE, NUG, NUP).", "id": "q109"}, {"ch": 1, "t": "qa", "q": "Hepatitis C: course, needlestick risk, vaccine, oral findings.", "a": "Acute → chronic hepatitis → cirrhosis → HCC; needlestick ~3%; no vaccine; Sjögren-like sialadenitis, xerostomia, salivary lymphoma, lichen planus.", "id": "q110"}, {"ch": 1, "t": "mcq", "q": "Which bacterial infection is nicknamed 'lumpy jaw disease'?", "o": ["Tuberculosis", "Actinomycosis", "Syphilis", "Candidosis"], "k": 1, "w": "Actinomycosis forms a hard, board-like lumpy swelling with sinuses discharging sulphur granules.", "id": "m111"}, {"ch": 1, "t": "mcq", "q": "Which oral manifestation is most commonly associated with HIV infection?", "o": ["Oral hairy leukoplakia", "Median rhomboid glossitis", "Pyostomatitis vegetans", "Amalgam tattoo"], "k": 0, "w": "OHL (EBV) is a marker of HIV-related immunosuppression.", "id": "m112"}, {"ch": 1, "t": "mcq", "q": "A hallmark feature of pseudomembranous candidosis is:", "o": ["White plaques that cannot be wiped off", "Vesicles on the soft palate", "Erythematous lesions only", "White patches that are easily wiped off, leaving a red surface"], "k": 3, "w": "The pseudomembrane lifts off an erythematous, bleeding base.", "id": "m113"}, {"ch": 1, "t": "mcq", "q": "In tuberculosis, oral lesions typically appear as:", "o": ["Vesicles with clear fluid", "Deep fissures on the dorsal tongue", "Painless ulcers on the dorsum of the tongue", "Gingival hyperplasia"], "k": 2, "w": "Oral TB (<1%) is usually a painless dorsal tongue ulcer from implanted sputum.", "id": "m114"}, {"ch": 1, "t": "mcq", "q": "Which HPV subtype is most strongly associated with oropharyngeal cancer?", "o": ["HPV 6", "HPV 11", "HPV 16", "HPV 57"], "k": 2, "w": "90% of HPV-positive oropharyngeal cancers are HPV 16; 6 and 11 cause papillomas.", "id": "m115"}, {"ch": 1, "t": "mcq", "q": "The gumma of tertiary syphilis most typically involves:", "o": ["Lower lip", "Hard palate", "Floor of mouth", "Gingival margin"], "k": 1, "w": "A crater-type ulcer destroying bone, typically the hard palate.", "id": "m116"}, {"ch": 1, "t": "mcq", "q": "M. tuberculosis is best demonstrated with:", "o": ["Gram stain", "PAS stain", "Ziehl–Neelsen stain", "Congo red"], "k": 2, "w": "Mycolic acid makes it acid-fast; it does not take up the Gram stain.", "id": "m117"}, {"ch": 1, "t": "mcq", "q": "HSV-1 lies latent in the:", "o": ["Oral epithelium", "Submandibular lymph nodes", "Trigeminal ganglion", "Salivary glands"], "k": 2, "w": "Viral DNA persists in sensory neurons of the trigeminal ganglion.", "id": "m118"}, {"ch": 1, "t": "mcq", "q": "Vesicles confined to the soft palate, fauces and tonsils, sparing the gingivae, in a febrile child suggest:", "o": ["Primary herpetic gingivostomatitis", "Herpangina", "Measles", "Shingles"], "k": 1, "w": "Coxsackie herpangina affects the back of the mouth; HSV involves the gingivae.", "id": "m119"}, {"ch": 1, "t": "mcq", "q": "Koplik spots are a sign of:", "o": ["Mumps", "Measles", "Chickenpox", "Infectious mononucleosis"], "k": 1, "w": "Red spots with blue-white specks on the buccal mucosa in the measles prodrome.", "id": "m120"}, {"ch": 1, "t": "mcq", "q": "Multifocal epithelial hyperplasia (Heck's disease) is caused by HPV:", "o": ["6 and 11", "16 and 18", "13 and 32", "1 and 57"], "k": 2, "w": "Multiple soft nodules in children that disappear when the mucosa is stretched.", "id": "m121"}, {"ch": 1, "t": "mcq", "q": "Which antifungal must be used with caution in a patient taking warfarin?", "o": ["Nystatin", "Amphotericin B", "Miconazole", "Chlorhexidine"], "k": 2, "w": "Miconazole inhibits warfarin metabolism and raises the INR, even as an oral gel.", "id": "m122"}, {"ch": 1, "t": "mcq", "q": "Post-exposure prophylaxis for HIV must be started within:", "o": ["6 hours", "24 hours", "72 hours", "7 days"], "k": 2, "w": "A 28-day course begun within 72 hours of exposure.", "id": "m123"}, {"ch": 1, "t": "mcq", "q": "A white, corrugated, bilateral lesion of the lateral tongue that cannot be wiped off in an HIV patient is caused by:", "o": ["Candida albicans", "EBV", "HPV 16", "CMV"], "k": 1, "w": "Oral hairy leukoplakia.", "id": "m124"}, {"ch": 1, "t": "mcq", "q": "Which statement about hepatitis C is correct?", "o": ["A vaccine is available", "Needlestick transmission risk is about 30%", "It is associated with oral lichen planus and Sjögren-like sialadenitis", "It never becomes chronic"], "k": 2, "w": "No vaccine; needlestick ~3%; most infections become chronic.", "id": "m125"}, {"ch": 1, "t": "mcq", "q": "Kaposi's sarcoma is caused by:", "o": ["HHV-6", "HHV-8", "EBV", "CMV"], "k": 1, "w": "HHV-8 resides in endothelial cells; immunosuppression permits proliferation.", "id": "m126"}, {"ch": 1, "t": "cloze", "s": "The oral microbiome contains more than {{700}} bacterial species.", "h": "number", "id": "c127"}, {"ch": 1, "t": "cloze", "s": "Sulphur granules are colonies of {{Actinomyces}} surrounded by {{neutrophils}}.", "h": "lumpy jaw", "id": "c128"}, {"ch": 1, "t": "cloze", "s": "Secondary syphilis produces {{mucous patches}} and {{snail-track}} ulcers.", "h": "highly infectious stage", "id": "c129"}, {"ch": 1, "t": "cloze", "s": "About {{1 in 4}} people worldwide has latent TB, with a {{5–15%}} lifetime risk of disease.", "h": "WHO figures", "id": "c130"}, {"ch": 1, "t": "cloze", "s": "Pseudomembranous candidosis wipes off to leave an {{erythematous}} base; chronic hyperplastic candidosis {{cannot}} be removed.", "h": "wipe test", "id": "c131"}, {"ch": 1, "t": "cloze", "s": "Median rhomboid glossitis lies just anterior to the {{circumvallate papillae}}.", "h": "posterior dorsal tongue", "id": "c132"}, {"ch": 1, "t": "cloze", "s": "Linear gingival erythema is a {{2–3 mm}} red band along the gingival margin, more common in {{HIV}}.", "h": "Candida-related", "id": "c133"}, {"ch": 1, "t": "cloze", "s": "Acrylic dentures are soaked weekly in {{1% sodium hypochlorite}}; chrome dentures in {{chlorhexidine}}.", "h": "denture hygiene", "id": "c134"}, {"ch": 1, "t": "cloze", "s": "Herpes labialis is treated with {{aciclovir 5%}} cream started in the {{prodrome}}.", "h": "reactivation", "id": "c135"}, {"ch": 1, "t": "cloze", "s": "Oral hairy leukoplakia is caused by {{EBV}}.", "h": "lateral tongue", "id": "c136"}, {"ch": 1, "t": "cloze", "s": "Squamous papilloma is caused by HPV {{6}} and {{11}}; Heck's disease by HPV {{13}} and {{32}}.", "h": "benign HPV lesions", "id": "c137"}, {"ch": 1, "t": "cloze", "s": "About {{90%}} of HPV-positive oropharyngeal cancers are HPV {{16}}.", "h": "oropharynx", "id": "c138"}, {"ch": 1, "t": "cloze", "s": "HIV PEP is a {{28}}-day course started within {{72}} hours.", "h": "post-exposure", "id": "c139"}, {"ch": 1, "t": "cloze", "s": "The needlestick transmission risk for hepatitis C is about {{3%}}, and there is {{no}} vaccine.", "h": "blood-borne", "id": "c140"}, {"id": "q0", "ch": 2, "t": "qa", "q": "Define a neoplasm.", "a": "A lesion resulting from the autonomous abnormal growth of cells that persists in the absence of the initiating stimulus."}, {"id": "q1", "ch": 2, "t": "qa", "q": "Why is 'tumour' a loose term?", "a": "It means any swelling — an abscess or haematoma qualifies. Every neoplasm is a tumour, not every tumour a neoplasm."}, {"id": "q2", "ch": 2, "t": "qa", "q": "The only absolute discriminators of malignancy.", "a": "Invasion and metastasis. Everything else is a tendency with exceptions."}, {"id": "q3", "ch": 2, "t": "qa", "q": "Three microscopic features of malignancy.", "a": "Frequent/atypical mitoses; anaplasia (poor differentiation); nuclear pleomorphism, hyperchromatism, high N:C ratio, prominent nucleoli."}, {"id": "q4", "ch": 2, "t": "qa", "q": "Three macroscopic features distinguishing benign from malignant.", "a": "Border (circumscribed/encapsulated vs infiltrative); surface growth (exophytic vs endophytic, ulcerated, indurated); necrosis/haemorrhage (rare vs common)."}, {"id": "q5", "ch": 2, "t": "qa", "q": "Carcinoma vs sarcoma.", "a": "Carcinoma: malignant epithelial. Sarcoma: malignant mesenchymal/connective tissue."}, {"id": "q6", "ch": 2, "t": "qa", "q": "Benign and malignant names for glandular epithelium, fat, cartilage, bone.", "a": "Adenoma/adenocarcinoma; lipoma/liposarcoma; chondroma/chondrosarcoma; osteoma/osteosarcoma."}, {"id": "q7", "ch": 2, "t": "qa", "q": "Four '-oma' names that are malignant.", "a": "Lymphoma, melanoma, mesothelioma, seminoma."}, {"id": "q8", "ch": 2, "t": "qa", "q": "Define differentiation and anaplasia.", "a": "Differentiation: how closely the neoplasm resembles its cells of origin. Anaplasia: lack of differentiation — a reliable indicator of malignancy."}, {"id": "q9", "ch": 2, "t": "qa", "q": "Two most characteristic architectural features of oral epithelial dysplasia.", "a": "Drop-shaped rete ridges and abnormally superficial mitotic figures."}, {"id": "q10", "ch": 2, "t": "qa", "q": "Five ways a benign neoplasm harms.", "a": "Pressure, obstruction, hormone production, transformation to malignancy, anxiety."}, {"id": "q11", "ch": 2, "t": "qa", "q": "What extra effects does a malignant neoplasm add?", "a": "Destruction of adjacent tissue, metastasis, bleeding from ulcerated surfaces, paraneoplastic effects, pain."}, {"id": "q12", "ch": 2, "t": "qa", "q": "Define cachexia.", "a": "Progressive loss of fat and lean mass with weakness, anorexia and anaemia — cytokine-driven."}, {"id": "q13", "ch": 2, "t": "qa", "q": "Define a paraneoplastic syndrome and name the three commonest.", "a": "Symptom complex not explained by spread or by hormones native to the tissue of origin. Hypercalcaemia, Cushing syndrome, non-bacterial thrombotic endocarditis."}, {"id": "q14", "ch": 2, "t": "qa", "q": "Why do paraneoplastic syndromes matter clinically?", "a": "May be the first sign of an occult tumour, may be lethal themselves, may mimic metastatic disease and confound treatment."}, {"id": "q15", "ch": 2, "t": "qa", "q": "Five classes of carcinogen.", "a": "Chemicals, viruses, ionising and non-ionising radiation, exogenous hormones, microbial agents."}, {"id": "m42", "ch": 2, "t": "mcq", "q": "A neoplasm is best defined as:", "o": ["An abnormal swelling", "A benign tumour only", "Inflammation in a tissue", "An abnormal growth of cells that persists in the absence of the initiating stimulus"], "k": 3, "w": "Autonomy is the defining property."}, {"id": "m43", "ch": 2, "t": "mcq", "q": "A benign neoplasm of glandular tissue is a:", "o": ["Sarcoma", "Carcinoma", "Adenoma", "Lymphoma"], "k": 2, "w": "Adenoma; malignant counterpart is adenocarcinoma."}, {"id": "m44", "ch": 2, "t": "mcq", "q": "Malignant neoplasms are characterised by:", "o": ["Slow growth and well-defined borders", "Frequent mitoses and anaplasia", "Encapsulation and lack of invasion", "Rare metastasis"], "k": 1, "w": "Plus invasion and metastasis as the absolute criteria."}, {"id": "m45", "ch": 2, "t": "mcq", "q": "Anaplasia refers to:", "o": ["Increased differentiation", "Decreased differentiation", "Normal morphology", "Benign growth"], "k": 1, "w": "Lack of differentiation — a reliable indicator of malignancy."}, {"id": "m50", "ch": 2, "t": "mcq", "q": "Which of these '-oma' tumours is malignant?", "o": ["Fibroma", "Lipoma", "Melanoma", "Chondroma"], "k": 2, "w": "Lymphoma, melanoma, mesothelioma, seminoma."}, {"id": "m51", "ch": 2, "t": "mcq", "q": "Malignant neoplasm of mesenchymal tissue is a:", "o": ["Carcinoma", "Adenoma", "Sarcoma", "Papilloma"], "k": 2, "w": "Liposarcoma, osteosarcoma, chondrosarcoma."}, {"id": "m52", "ch": 2, "t": "mcq", "q": "A lung tumour secreting ADH causes SIADH. This is:", "o": ["Local invasion", "Metastasis", "A paraneoplastic syndrome", "Cachexia"], "k": 2, "w": "Lung does not normally make ADH."}, {"id": "m53", "ch": 2, "t": "mcq", "q": "Mitotic figures in the upper third of the epithelium indicate:", "o": ["Normal turnover", "Hyperplasia", "Dysplasia", "Metaplasia"], "k": 2, "w": "Maturation control lost — an architectural feature of dysplasia."}, {"id": "m54", "ch": 2, "t": "mcq", "q": "Which growth pattern suggests malignancy on a mucosal surface?", "o": ["Pedunculated", "Exophytic", "Endophytic, ulcerated, indurated", "Encapsulated"], "k": 2, "w": "Burrowing in, rolled margins, fixed."}, {"id": "c63", "ch": 2, "t": "cloze", "s": "The only absolute discriminators of malignancy are {{invasion}} and {{metastasis}}.", "h": "everything else is a tendency"}, {"id": "c64", "ch": 2, "t": "cloze", "s": "Malignant '-oma' tumours: lymphoma, melanoma, {{mesothelioma}}, {{seminoma}}.", "h": "four exceptions"}, {"id": "c65", "ch": 2, "t": "cloze", "s": "A malignant epithelial tumour is a {{carcinoma}}; a malignant mesenchymal tumour is a {{sarcoma}}.", "h": "nomenclature"}, {"id": "c66", "ch": 2, "t": "cloze", "s": "The two most characteristic architectural features of dysplasia are {{drop-shaped rete ridges}} and {{superficial mitotic figures}}.", "h": "architecture"}, {"id": "c67", "ch": 2, "t": "cloze", "s": "The commonest paraneoplastic syndromes are {{hypercalcaemia}}, Cushing syndrome and non-bacterial thrombotic endocarditis.", "h": "not explained by spread"}, {"id": "q16", "ch": 3, "t": "qa", "q": "Define neoplastic transformation (tumourigenesis) and malignant transformation.", "a": "Tumourigenesis: acquisition of genetic and epigenetic alterations that make a cell's growth autonomous. Malignant transformation: further acquisition of invasion and metastasis."}, {"id": "q17", "ch": 3, "t": "qa", "q": "Initiation, promotion, progression — one line each.", "a": "Initiation: carcinogen induces the mutation. Promotion: stimulation of clonal proliferation of the initiated cell. Progression: process culminating in malignant behaviour."}, {"id": "q18", "ch": 3, "t": "qa", "q": "What does 'clonal' mean and why does it matter?", "a": "Tumour originates from a single transformed cell; all cells inherit the founder's alterations → molecular markers and targeted therapy possible."}, {"id": "q19", "ch": 3, "t": "qa", "q": "Three genetic routes to a transformed cell.", "a": "Oncogene activation; loss of both copies of a tumour suppressor; telomerase expression."}, {"id": "q20", "ch": 3, "t": "qa", "q": "Why two hits for a tumour suppressor but one for an oncogene?", "a": "Suppressor is a brake — one working allele suffices (recessive). Oncogene is an accelerator — one stuck-on allele dominates."}, {"id": "q21", "ch": 3, "t": "qa", "q": "The double-hit model.", "a": "First hit: acquired or inherited loss of one allele; the wild-type allele still suppresses. Second hit: loss of the normal allele → no suppression."}, {"id": "q22", "ch": 3, "t": "qa", "q": "Why do inherited cancer syndromes present early and multifocally?", "a": "The first hit is already in every cell; only one further event in any single cell is needed."}, {"id": "q23", "ch": 3, "t": "qa", "q": "Caretaker vs gatekeeper genes.", "a": "Caretakers repair DNA damage (mismatch repair, BRCA). Gatekeepers arrest or kill cells with damaged DNA (RB, p53)."}, {"id": "q24", "ch": 3, "t": "qa", "q": "p53 — location, normal function, frequency in cancer.", "a": "Short arm of chromosome 17; G1 arrest and repair, or apoptosis if damage is extensive; defective in >70% of cancers."}, {"id": "q25", "ch": 3, "t": "qa", "q": "Three ways p53 function is lost.", "a": "Mutation (nonsense/missense); dominant-negative complexes of mutant and normal protein (one hit suffices — exception to two-hit); binding by viral proteins (HPV E6)."}, {"id": "q26", "ch": 3, "t": "qa", "q": "Chromosomal vs microsatellite instability with an inherited example each.", "a": "Chromosomal: breaks — Fanconi anaemia. Microsatellite: defective mismatch repair — HNPCC (proximal colon)."}, {"id": "q27", "ch": 3, "t": "qa", "q": "Two routes to oncogene activation.", "a": "An altered, excessively active oncoprotein (RAS mutation) or excessive production of a normal oncoprotein (MYC/HER2 amplification, translocation)."}, {"id": "q28", "ch": 3, "t": "qa", "q": "Oncogene classes along the signalling pathway with an example each.", "a": "Growth factor (sis/PDGF); receptor (erbB/EGFR); membrane kinase (src); transducer (ras); transcription factor (myc)."}, {"id": "q29", "ch": 3, "t": "qa", "q": "Three epigenetic mechanisms in cancer.", "a": "Promoter hypermethylation (silences suppressors); histone modification; microRNA dysregulation."}, {"id": "q30", "ch": 3, "t": "qa", "q": "Why is promoter methylation 'as good as deletion', and how does it differ?", "a": "The gene is intact but unread — same loss of protection; but sequencing misses it and it is reversible (drug target)."}, {"id": "q31", "ch": 3, "t": "qa", "q": "List the eight hallmarks of cancer.", "a": "Self-sufficiency in growth signals; insensitivity to growth inhibitors; altered metabolism; evasion of cell death; unlimited replication; sustained angiogenesis; invasion and metastasis; evasion of immune surveillance."}, {"id": "q32", "ch": 3, "t": "qa", "q": "The two enabling characteristics.", "a": "Genomic instability and tumour-promoting inflammation."}, {"id": "q33", "ch": 3, "t": "qa", "q": "What does RB do and how do growth inhibitors act through it?", "a": "Gates G1/S by binding E2F; TGF-β, p16 and contact inhibition keep RB active; cyclin D–CDK4/6 phosphorylate it to release E2F."}, {"id": "q34", "ch": 3, "t": "qa", "q": "Loss of RB1 — which two hallmarks and why?", "a": "Self-sufficiency in growth signals (E2F free, S phase without mitogens) and insensitivity to growth inhibitors (TGF-β, p16, contact inhibition all act through RB)."}, {"id": "q35", "ch": 3, "t": "qa", "q": "The Warburg effect and why a cancer cell 'chooses' it.", "a": "Aerobic glycolysis to lactate despite oxygen — supplies carbon intermediates for building cellular components, not just ATP."}, {"id": "q36", "ch": 3, "t": "qa", "q": "Why can't a tumour exceed 1–2 mm without angiogenesis?", "a": "Beyond that, diffusion cannot supply oxygen and nutrients to the centre; VEGF-driven vessel recruitment is required."}, {"id": "q37", "ch": 3, "t": "qa", "q": "Two factors that determine where metastases appear.", "a": "Anatomy/vascular drainage of the primary, and tropism of the tumour for particular tissues."}, {"id": "q38", "ch": 3, "t": "qa", "q": "How does PD-L1 help a tumour, and how is that exploited?", "a": "PD-L1 on tumour cells switches off T cells (checkpoint); blocking antibodies release the brake on anti-tumour immunity."}, {"id": "q39", "ch": 3, "t": "qa", "q": "How does HPV cause cancer without mutating host genes?", "a": "Viral DNA integrates; E6 inactivates p53, E7 inactivates pRb — both gatekeepers disabled by protein binding."}, {"id": "q40", "ch": 3, "t": "qa", "q": "Acute vs slow transforming retroviruses.", "a": "Acute: carries a cellular oncogene picked up from a prior host. Slow: inserts its promoter next to a cellular oncogene and over-expresses it."}, {"id": "q41", "ch": 3, "t": "qa", "q": "Why is chronic inflammation a cancer risk, mechanistically?", "a": "Inflammatory cells supply growth factors, remove growth suppressors, resist cell death, drive angiogenesis, invasion and immune evasion — six of the eight hallmarks."}, {"id": "m46", "ch": 3, "t": "mcq", "q": "Tumourigenesis is primarily driven by:", "o": ["Inflammation alone", "Genetic and epigenetic alterations", "Infections alone", "Hormonal imbalances alone"], "k": 1, "w": "Sequence changes plus changes in expression, accumulating in one clone."}, {"id": "m47", "ch": 3, "t": "mcq", "q": "In multistep carcinogenesis, initiation involves:", "o": ["Stimulation of clonal proliferation", "Development of metastasis", "Induction of genetic alterations by a carcinogen", "Formation of a benign tumour"], "k": 2, "w": "Promotion is the proliferation; progression is malignant behaviour."}, {"id": "m48", "ch": 3, "t": "mcq", "q": "The double-hit model is most relevant to:", "o": ["Oncogene activation", "Telomerase expression", "Tumour suppressor gene inactivation", "Epigenetic changes"], "k": 2, "w": "Both alleles of a suppressor must be lost."}, {"id": "m49", "ch": 3, "t": "mcq", "q": "Angiogenesis matters in cancer because:", "o": ["It causes mutations", "It activates oncogenes", "It supplies nutrients and oxygen beyond 1–2 mm", "It suppresses the immune system"], "k": 2, "w": "No solid tumour exceeds 1–2 mm without it."}, {"id": "m55", "ch": 3, "t": "mcq", "q": "p53 is located on chromosome:", "o": ["13q", "17p", "11p", "5q"], "k": 1, "w": "Short arm of chromosome 17; mutated in >70% of cancers."}, {"id": "m56", "ch": 3, "t": "mcq", "q": "A mutant p53 protein that inactivates the normal protein it complexes with is an example of:", "o": ["Two-hit loss", "Dominant-negative effect", "Epigenetic silencing", "Viral inactivation"], "k": 1, "w": "The explicit exception to the two-hit model."}, {"id": "m57", "ch": 3, "t": "mcq", "q": "Which oncogene encodes a growth-factor receptor?", "o": ["sis", "erbB", "ras", "myc"], "k": 1, "w": "erbB = EGFR; sis = PDGF; ras = transducer; myc = transcription factor."}, {"id": "m58", "ch": 3, "t": "mcq", "q": "Microsatellite instability results from:", "o": ["Telomerase loss", "Defective mismatch repair", "Nucleotide-excision repair defect", "Chromosome breaks"], "k": 1, "w": "HNPCC/Lynch syndrome."}, {"id": "m59", "ch": 3, "t": "mcq", "q": "HPV E7 inactivates:", "o": ["p53", "pRb", "RAS", "BCL2"], "k": 1, "w": "E6 → p53; E7 → pRb."}, {"id": "m60", "ch": 3, "t": "mcq", "q": "The Warburg effect describes:", "o": ["Loss of contact inhibition", "Aerobic glycolysis to lactate", "Telomere shortening", "Loss of E-cadherin"], "k": 1, "w": "Supplies building blocks for a dividing cell; basis of FDG-PET."}, {"id": "m61", "ch": 3, "t": "mcq", "q": "Tumour cells expressing PD-L1 achieve which hallmark?", "o": ["Sustained angiogenesis", "Evasion of immune surveillance", "Unlimited replication", "Altered metabolism"], "k": 1, "w": "Checkpoint switches off T cells; blocking antibodies reverse it."}, {"id": "m62", "ch": 3, "t": "mcq", "q": "Loss of RB1 releases which transcription factor?", "o": ["p53", "E2F", "MYC", "NF-κB"], "k": 1, "w": "Free E2F commits the cell to S phase without mitogens."}, {"id": "c68", "ch": 3, "t": "cloze", "s": "TP53 sits on chromosome {{17p}} and is defective in more than {{70%}} of cancers.", "h": "guardian of the genome"}, {"id": "c69", "ch": 3, "t": "cloze", "s": "A solid tumour cannot exceed {{1–2 mm}} without angiogenesis.", "h": "diffusion limit"}, {"id": "c70", "ch": 3, "t": "cloze", "s": "Tumour suppressors need {{two}} hits; oncogenes need {{one}}.", "h": "brakes vs accelerator"}, {"id": "c71", "ch": 3, "t": "cloze", "s": "HPV E6 inactivates {{p53}} and E7 inactivates {{pRb}}.", "h": "viral shortcut"}, {"id": "c72", "ch": 3, "t": "cloze", "s": "RB controls the {{G1/S}} checkpoint by binding {{E2F}}.", "h": "portal to DNA replication"}, {"id": "c73", "ch": 3, "t": "cloze", "s": "The three stages of multistep carcinogenesis: {{initiation}}, {{promotion}}, {{progression}}.", "h": "one clonal lineage"}, {"id": "c74", "ch": 3, "t": "cloze", "s": "Hanahan and Weinberg describe {{eight}} hallmarks and {{two}} enabling characteristics.", "h": "framework"}, {"id": "c75", "ch": 3, "t": "cloze", "s": "HNPCC results from defective {{mismatch repair}}; xeroderma pigmentosum from defective {{nucleotide-excision repair}}.", "h": "inherited instability"}, {"ch": 4, "t": "qa", "q": "The four pathways of LOPC carcinogenesis.", "a": "Behavioural (tobacco, betel, alcohol, e-cigarettes); infectious/biological (HPV, microbiome, inflammation); environmental/occupational (UV, dusts, formaldehyde); host and lifestyle (genetics, diet, socioeconomic access).", "id": "q141"}, {"ch": 4, "t": "qa", "q": "Most significant carcinogens in tobacco smoke and how they act.", "a": "Tobacco-specific nitrosamines (NNK, NNN), plus PAHs; they form DNA adducts → mutations; p53 overexpression in premalignant and malignant epithelium.", "id": "q142"}, {"ch": 4, "t": "qa", "q": "Which matters more for oral cancer risk: smoking duration or daily count?", "a": "Duration — 7 years roughly doubles risk (RR 2.01); risk rises disproportionately with intensity.", "id": "q143"}, {"ch": 4, "t": "qa", "q": "Current smokers' relative risk of oral, pharyngeal and overall LOPC.", "a": "3.39× oral cavity, 4.24× pharyngeal, 3.58× overall; mortality 7.86×.", "id": "q144"}, {"ch": 4, "t": "qa", "q": "Smokeless tobacco — carcinogens and risk.", "a": "PAHs, nitrosamines, polonium-210; users absorb 2–3× more nicotine than smokers; ~4× oral cancer risk in South-East Asia.", "id": "q145"}, {"ch": 4, "t": "qa", "q": "Why is betel quid a carcinogen in its own right?", "a": "Risk persists independent of tobacco and alcohol; arecoline activates EMT markers (vimentin); also causes oral submucous fibrosis.", "id": "q146"}, {"ch": 4, "t": "qa", "q": "Three ways alcohol promotes oral cancer.", "a": "Converted to acetaldehyde (carcinogen) by alcohol dehydrogenase; slow clearance in inactive ALDH2 carriers (~44% of Japanese); increases mucosal permeability to other carcinogens.", "id": "q147"}, {"ch": 4, "t": "qa", "q": "Quantify the tobacco–alcohol interaction.", "a": "6–15× above either exposure alone — multiplicative; heavy smoking + heavy drinking ~30× vs neither.", "id": "q148"}, {"ch": 4, "t": "qa", "q": "What do we know about e-cigarettes and oral cancer?", "a": "Fewer carcinogens but not zero; DNA strand breaks regardless of nicotine; 62% of dysregulated transcripts in cancer pathways; no long-term prospective data — causation unproven (Bradford Hill).", "id": "q149"}, {"ch": 4, "t": "qa", "q": "How does HPV-16 cause oropharyngeal cancer?", "a": "E6 inhibits/degrades p53; E7 inactivates pRb — disabling both checkpoints without mutating the genes; tonsil and base of tongue preferentially infected.", "id": "q150"}, {"ch": 4, "t": "qa", "q": "HPV attributable fraction and vaccine effectiveness.", "a": "18–28% of oropharyngeal cancer globally, ~70% in the US; vaccine ~82% effective against HPV-16/18 at 6 years.", "id": "q151"}, {"ch": 4, "t": "qa", "q": "Principal cause of lower-lip cancer and who is at risk.", "a": "UV radiation; fishermen, farmers, gardeners (SIR up to 2.26).", "id": "q152"}, {"ch": 4, "t": "qa", "q": "Occupational exposures linked to pharyngeal cancer.", "a": "Wood dust (2–5× oropharyngeal risk), cement, coal and asbestos dust; formaldehyde, chromium (leather dust), metal particles.", "id": "q153"}, {"ch": 4, "t": "qa", "q": "Host factors in LOPC.", "a": "P450/xenobiotic enzyme polymorphisms; ADH1B/ADH7 variants; p53/pRb inactivation; first-degree relative with LOPC; age.", "id": "q154"}, {"ch": 4, "t": "qa", "q": "Risk reduction after quitting smoking.", "a": "≈35% lower at 1–4 years; ≈50% at 5 years; a further ≈50% at 10 years; never-smoker baseline after ~20 years.", "id": "q155"}, {"ch": 4, "t": "qa", "q": "Primary, secondary and tertiary prevention of oral cancer — one example each.", "a": "Primary: cessation, HPV vaccination, sun protection, diet. Secondary: routine dental screening, visual/tactile examination. Tertiary: follow-up, rehabilitation, managing field cancerisation.", "id": "q156"}, {"ch": 4, "t": "mcq", "q": "The most significant carcinogens in tobacco smoke for oral cancer are:", "o": ["Nicotine", "Tobacco-specific nitrosamines", "Carbon monoxide", "Tar water"], "k": 1, "w": "NNK and NNN form DNA adducts; nicotine itself is mainly addictive.", "id": "m157"}, {"ch": 4, "t": "mcq", "q": "Ethanol is converted to the carcinogen acetaldehyde by:", "o": ["Aldehyde dehydrogenase 2", "Alcohol dehydrogenase", "Cytochrome P450 only", "Catalase"], "k": 1, "w": "ALDH2 then clears acetaldehyde; inactive ALDH2 variants prolong exposure.", "id": "m158"}, {"ch": 4, "t": "mcq", "q": "Combined heavy smoking and heavy drinking raises oral cancer risk by roughly:", "o": ["2×", "5×", "30×", "100×"], "k": 2, "w": "Multiplicative synergy — about 30× vs neither habit.", "id": "m159"}, {"ch": 4, "t": "mcq", "q": "Which statement about betel quid is correct?", "o": ["It is only carcinogenic when combined with tobacco", "Its risk is independent of tobacco and alcohol", "It protects against oral submucous fibrosis", "Its main carcinogen is ethanol"], "k": 1, "w": "Areca nut is carcinogenic in its own right (arecoline, EMT).", "id": "m160"}, {"ch": 4, "t": "mcq", "q": "The principal cause of lower-lip cancer is:", "o": ["HPV 16", "Alcohol", "UV radiation", "Wood dust"], "k": 2, "w": "Outdoor workers are at higher risk; precursor actinic cheilitis.", "id": "m161"}, {"ch": 4, "t": "mcq", "q": "The only major oral/oropharyngeal carcinogen with a preventive vaccine is:", "o": ["Tobacco", "HPV", "EBV", "Candida"], "k": 1, "w": "HPV vaccination ~82% effective against HPV-16/18 at 6 years.", "id": "m162"}, {"ch": 4, "t": "mcq", "q": "Oral cancer risk after quitting smoking returns to that of a never-smoker after about:", "o": ["1 year", "5 years", "10 years", "20 years"], "k": 3, "w": "≈35% lower at 1–4 years, ≈50% at 5, baseline by ~20.", "id": "m163"}, {"ch": 4, "t": "mcq", "q": "Routine visual and tactile oral examination is an example of:", "o": ["Primary prevention", "Secondary prevention", "Tertiary prevention", "Chemoprevention only"], "k": 1, "w": "Secondary prevention = early detection.", "id": "m164"}, {"ch": 4, "t": "mcq", "q": "HPV E7 promotes carcinogenesis by:", "o": ["Degrading p53", "Inactivating pRb", "Activating telomerase only", "Mutating RAS"], "k": 1, "w": "E6 targets p53; E7 binds and inactivates pRb.", "id": "m165"}, {"ch": 4, "t": "cloze", "s": "Cigarette smoke contains more than {{60}} carcinogens; the most significant are the tobacco-specific {{nitrosamines}}.", "h": "NNK, NNN", "id": "c166"}, {"ch": 4, "t": "cloze", "s": "Tobacco carcinogens form DNA {{adducts}}.", "h": "initiation", "id": "c167"}, {"ch": 4, "t": "cloze", "s": "Just {{7}} years of smoking roughly doubles oral cancer risk.", "h": "duration", "id": "c168"}, {"ch": 4, "t": "cloze", "s": "Alcohol is converted to {{acetaldehyde}} by {{alcohol dehydrogenase}}.", "h": "carcinogenic metabolite", "id": "c169"}, {"ch": 4, "t": "cloze", "s": "Tobacco plus alcohol raises risk {{6–15}}× above either alone — the effect is {{multiplicative}}.", "h": "synergy", "id": "c170"}, {"ch": 4, "t": "cloze", "s": "{{UV radiation}} is the principal cause of {{lower-lip}} cancer.", "h": "outdoor workers", "id": "c171"}, {"ch": 4, "t": "cloze", "s": "Arecoline in areca nut activates {{EMT}} markers such as {{vimentin}}.", "h": "betel quid", "id": "c172"}, {"ch": 4, "t": "cloze", "s": "Risk approaches never-smoker baseline about {{20}} years after quitting.", "h": "reversal", "id": "c173"}, {"ch": 5, "t": "qa", "q": "Define arteriosclerosis and contrast it with atherosclerosis.", "a": "Arteriosclerosis: non-inflammatory age-related arterial hardening (intimal fibrosis, elastin loss). Atherosclerosis: chronic inflammatory lipid-driven disease of large and medium arteries; arteriosclerosis contributes to its progression.", "id": "q174"}, {"ch": 5, "t": "qa", "q": "Why does isolated systolic hypertension appear with age?", "a": "Arterial stiffening (elastin replaced by collagen) widens pulse pressure — systolic rises, diastolic falls.", "id": "q175"}, {"ch": 5, "t": "qa", "q": "The five steps of atherosclerosis.", "a": "Endothelial injury → LDL infiltration and oxidation → monocytes become macrophages/foam cells (fatty streak) → smooth muscle migration and matrix → fibrous cap over necrotic lipid core.", "id": "q176"}, {"ch": 5, "t": "qa", "q": "Features of a vulnerable plaque.", "a": "Thin fibrous cap, large lipid core, heavy inflammation (MMPs weakening the cap), little calcification.", "id": "q177"}, {"ch": 5, "t": "qa", "q": "Four clinical consequences of atherosclerosis.", "a": "Stenosis → chronic ischaemia (angina, claudication); rupture → thrombosis (ACS, stroke); atheroembolism (blue toe, retinal, renal); aneurysm.", "id": "q178"}, {"ch": 5, "t": "qa", "q": "Define an aneurysm and name five types.", "a": "Localised permanent dilatation ≥50% of normal diameter. Atherosclerotic (AAA), dissecting, berry (circle of Willis → SAH), Charcot–Bouchard (→ intracerebral haemorrhage), mycotic.", "id": "q179"}, {"ch": 5, "t": "qa", "q": "Diagnostic threshold for hypertension.", "a": "≥140/90 mmHg clinic (≥135/85 home/ambulatory), sustained over several visits or 24-h ABPM.", "id": "q180"}, {"ch": 5, "t": "qa", "q": "Essential vs secondary hypertension, with three secondary causes.", "a": "Essential ~90%, multifactorial; secondary ~10% — renal artery stenosis/CKD, Conn syndrome, phaeochromocytoma, Cushing, coarctation, drugs (NSAIDs, OCP, steroids, ciclosporin).", "id": "q181"}, {"ch": 5, "t": "qa", "q": "RAAS in hypertension.", "a": "Renin → angiotensin I → angiotensin II (ACE, lung endothelium); AII vasoconstricts and stimulates aldosterone → Na⁺ and water retention → ↑ volume.", "id": "q182"}, {"ch": 5, "t": "qa", "q": "Target-organ damage in hypertension.", "a": "Heart: LVH, HF, AF; kidney: hyaline arteriolosclerosis, CKD; brain: lacunar infarcts, haemorrhage, vascular dementia; eye: retinopathy, papilloedema.", "id": "q183"}, {"ch": 5, "t": "qa", "q": "The three vascular pathologies of diabetes.", "a": "Accelerated atherosclerosis; hypertensive vascular disease; microangiopathy (thickened capillary basement membrane) — the hallmark.", "id": "q184"}, {"ch": 5, "t": "qa", "q": "Why do diabetic patients heal poorly?", "a": "Reduced perfusion (micro- and macrovascular), impaired neutrophil function, increased infection risk.", "id": "q185"}, {"ch": 5, "t": "qa", "q": "Giant cell arteritis: patient, oral symptom, danger.", "a": "Over 50, more women, PMR; jaw claudication (masseter ischaemia), temporal headache, scalp tenderness; risk of irreversible blindness — urgent referral.", "id": "q186"}, {"ch": 5, "t": "qa", "q": "Left vs right heart failure — symptoms and dental implications.", "a": "Left: pulmonary congestion — dyspnoea, orthopnoea, PND; treat semi-upright. Right: systemic congestion — oedema, hepatomegaly, raised JVP; reduced hepatic drug clearance.", "id": "q187"}, {"ch": 5, "t": "qa", "q": "Stable angina vs MI.", "a": "Angina: fixed >70% stenosis, exertional, <20 min, relieved by rest/GTN, troponin normal. MI: occlusive thrombus, >20–30 min, not relieved by GTN, troponin raised, necrosis.", "id": "q188"}, {"ch": 5, "t": "qa", "q": "Unstable angina — mechanism and significance.", "a": "Plaque rupture with non-occlusive thrombus; pain at rest or worsening; part of ACS, pre-infarction — no elective care, urgent referral.", "id": "q189"}, {"ch": 5, "t": "qa", "q": "Consequences of MI.", "a": "Arrhythmia (VF — commonest early death), heart failure, cardiogenic shock, fibrinous pericarditis (1–3 days), Dressler syndrome (weeks).", "id": "q190"}, {"ch": 5, "t": "qa", "q": "Stenosis vs regurgitation.", "a": "Stenosis: valve cannot open fully → pressure overload → hypertrophy. Regurgitation: cannot close fully → volume overload → dilatation.", "id": "q191"}, {"ch": 5, "t": "qa", "q": "Infective endocarditis: organism after dental bacteraemia; four embolic signs.", "a": "Viridans streptococci. Splinter haemorrhages, Janeway lesions (painless), Osler nodes (tender), Roth spots.", "id": "q192"}, {"ch": 5, "t": "qa", "q": "Tetralogy of Fallot — four features.", "a": "RV outflow obstruction, VSD, overriding aorta, RV hypertrophy; cyanotic.", "id": "q193"}, {"ch": 5, "t": "qa", "q": "What is Eisenmenger syndrome?", "a": "A left-to-right shunt causes pulmonary hypertension until the shunt reverses to right-to-left and the patient becomes cyanotic.", "id": "q194"}, {"ch": 5, "t": "qa", "q": "Describe primary haemostasis.", "a": "Injury exposes collagen and vWF; platelets adhere via GPIb–vWF; activate (ADP, TXA₂, serotonin; GPIIb/IIIa); fibrinogen bridges → aggregation → temporary plug.", "id": "q195"}, {"ch": 5, "t": "qa", "q": "Extrinsic vs intrinsic pathways and their tests.", "a": "Extrinsic: tissue factor + VII → PT/INR. Intrinsic: XII, XI, IX, VIII → APTT. Common: X → thrombin → fibrin.", "id": "q196"}, {"ch": 5, "t": "qa", "q": "Natural anticoagulants and fibrinolysis.", "a": "Antithrombin (thrombin, Xa, IXa, XIa); protein C + S (Va, VIIIa); TFPI. Fibrinolysis: plasminogen → plasmin via tPA; FDPs.", "id": "q197"}, {"ch": 5, "t": "qa", "q": "Three mechanisms of thrombocytopenia with an example each.", "a": "Decreased production (chemotherapy, leukaemia, aplastic anaemia); increased destruction (ITP, DIC, TTP, heparin); sequestration (hypersplenism in cirrhosis).", "id": "q198"}, {"ch": 5, "t": "qa", "q": "ITP mechanism.", "a": "Autoantibodies to platelet GPIIb/IIIa or GPIb; opsonised platelets destroyed in the spleen. Acute in children post-viral; chronic in adults, women.", "id": "q199"}, {"ch": 5, "t": "qa", "q": "Oral red flags for a bleeding disorder.", "a": "Gingival bleeding out of proportion to plaque; spontaneous oral bleeding; petechiae or blood blisters in a patient not on anticoagulants; prolonged post-extraction bleeding.", "id": "q200"}, {"ch": 5, "t": "qa", "q": "von Willebrand disease: prevalence, functions of vWF, labs, treatment.", "a": "~1%, commonest inherited; vWF mediates platelet adhesion (GPIb) and carries FVIII; platelet-type bleeding; normal count, prolonged bleeding time, ± ↑APTT; desmopressin.", "id": "q201"}, {"ch": 5, "t": "qa", "q": "Haemophilia A vs B.", "a": "A: FVIII (80–85%); B (Christmas): FIX. Both X-linked recessive, males, ↑APTT, normal PT, platelets and bleeding time; deep bleeding (haemarthroses, muscle).", "id": "q202"}, {"ch": 5, "t": "qa", "q": "Haemophilia severity bands.", "a": "Severe <1% (spontaneous joint/muscle bleeds); moderate 1–5% (minor trauma); mild 5–30% (after surgery or extraction).", "id": "q203"}, {"ch": 5, "t": "qa", "q": "Factor XII deficiency.", "a": "Prolonged APTT but no bleeding tendency — do not delay dental care.", "id": "q204"}, {"ch": 5, "t": "qa", "q": "How does liver disease affect haemostasis?", "a": "↓ factor and fibrinogen synthesis; ↓ clearance of activated factors (thrombosis); hypersplenic thrombocytopenia; ↓ vitamin K absorption. PT prolongs early.", "id": "q205"}, {"ch": 5, "t": "qa", "q": "Warfarin vs DOACs.", "a": "Warfarin: vitamin K epoxide reductase → ↓ II, VII, IX, X; INR monitoring; many interactions. DOACs: direct Xa (rivaroxaban, apixaban) or IIa (dabigatran); no INR; timing around dose.", "id": "q206"}, {"ch": 5, "t": "qa", "q": "Mucocutaneous vs deep bleeding — what does each point to?", "a": "Mucocutaneous (petechiae, gums, nose): platelet or vWF defect. Deep (joints, muscles, delayed): clotting-factor defect.", "id": "q207"}, {"ch": 5, "t": "mcq", "q": "The cell type that forms the fatty streak is the:", "o": ["Smooth muscle cell", "Foam cell (lipid-laden macrophage)", "Neutrophil", "Fibroblast"], "k": 1, "w": "Macrophages ingest oxidised LDL and become foam cells.", "id": "m208"}, {"ch": 5, "t": "mcq", "q": "A vulnerable atheromatous plaque characteristically has:", "o": ["A thick fibrous cap and heavy calcification", "A thin cap, large lipid core and heavy inflammation", "No lipid core", "Only smooth muscle cells"], "k": 1, "w": "MMPs from inflammatory cells weaken the thin cap.", "id": "m209"}, {"ch": 5, "t": "mcq", "q": "Hypertension is diagnosed on clinic readings at:", "o": ["≥120/80", "≥130/85", "≥140/90", "≥160/100"], "k": 2, "w": "Sustained over several visits or confirmed by ABPM.", "id": "m210"}, {"ch": 5, "t": "mcq", "q": "Conn syndrome causes hypertension through:", "o": ["Catecholamine excess", "Cortisol excess", "Primary hyperaldosteronism with Na⁺ retention and K⁺ loss", "Renal artery stenosis"], "k": 2, "w": "Phaeochromocytoma = catecholamines; Cushing = cortisol.", "id": "m211"}, {"ch": 5, "t": "mcq", "q": "The hallmark vascular lesion of diabetes is:", "o": ["Aortic dissection", "Microangiopathy with thickened capillary basement membranes", "Berry aneurysm", "Fibrinoid necrosis"], "k": 1, "w": "Retina, glomeruli, vasa nervorum, skin and mucosa.", "id": "m212"}, {"ch": 5, "t": "mcq", "q": "Jaw claudication in a 70-year-old suggests:", "o": ["TMD", "Giant cell arteritis", "Trigeminal neuralgia", "Parotitis"], "k": 1, "w": "Ischaemia of masticatory muscles; risk of blindness — urgent referral.", "id": "m213"}, {"ch": 5, "t": "mcq", "q": "Orthopnoea is a feature of:", "o": ["Right heart failure", "Left heart failure", "Stable angina", "Mitral stenosis only"], "k": 1, "w": "Pulmonary venous congestion worsens lying flat.", "id": "m214"}, {"ch": 5, "t": "mcq", "q": "Which feature distinguishes MI from angina?", "o": ["Pain on exertion", "Relief with GTN", "Raised troponin", "Transient ST depression"], "k": 2, "w": "MI causes myocyte necrosis and troponin release; pain is not relieved by GTN.", "id": "m215"}, {"ch": 5, "t": "mcq", "q": "The organism classically causing infective endocarditis after dental bacteraemia is:", "o": ["Staph. aureus", "Viridans streptococci", "Enterococcus", "Pseudomonas"], "k": 1, "w": "S. aureus causes acute, aggressive IE, often in IV drug users.", "id": "m216"}, {"ch": 5, "t": "mcq", "q": "The most common congenital heart defect is:", "o": ["ASD", "VSD", "PDA", "Tetralogy of Fallot"], "k": 1, "w": "VSD — a left-to-right shunt.", "id": "m217"}, {"ch": 5, "t": "mcq", "q": "The vitamin K-dependent clotting factors are:", "o": ["I, II, V, VIII", "II, VII, IX, X", "VIII, IX, XI, XII", "III, V, VII, XIII"], "k": 1, "w": "Warfarin depletes these (and proteins C and S).", "id": "m218"}, {"ch": 5, "t": "mcq", "q": "The PT/INR mainly tests the:", "o": ["Intrinsic pathway", "Extrinsic pathway", "Platelet count", "Fibrinolytic system"], "k": 1, "w": "Tissue factor + factor VII. APTT tests the intrinsic pathway.", "id": "m219"}, {"ch": 5, "t": "mcq", "q": "Platelet adhesion to subendothelium is mediated by:", "o": ["Fibrinogen and GPIIb/IIIa", "vWF and GPIb", "Thrombin", "Plasmin"], "k": 1, "w": "GPIIb/IIIa with fibrinogen mediates aggregation, not adhesion.", "id": "m220"}, {"ch": 5, "t": "mcq", "q": "Haemophilia A is:", "o": ["Autosomal dominant FIX deficiency", "X-linked recessive FVIII deficiency", "Autosomal vWF deficiency", "Acquired vitamin K deficiency"], "k": 1, "w": "Haemophilia B (Christmas) is FIX deficiency.", "id": "m221"}, {"ch": 5, "t": "mcq", "q": "Laboratory findings in haemophilia A are:", "o": ["↑PT, normal APTT", "↑APTT, normal PT, normal platelets", "↓platelets, ↑bleeding time", "Normal tests"], "k": 1, "w": "Intrinsic pathway defect.", "id": "m222"}, {"ch": 5, "t": "mcq", "q": "The most common inherited bleeding disorder is:", "o": ["Haemophilia A", "Haemophilia B", "von Willebrand disease", "Factor XI deficiency"], "k": 2, "w": "≈1% of the population; platelet-type bleeding; desmopressin.", "id": "m223"}, {"ch": 5, "t": "mcq", "q": "A prolonged APTT with no bleeding history suggests deficiency of factor:", "o": ["VIII", "IX", "XI", "XII"], "k": 3, "w": "FXII deficiency does not cause bleeding — don't delay care.", "id": "m224"}, {"ch": 5, "t": "mcq", "q": "Invasive dental procedures are generally avoided when the platelet count is below:", "o": ["150 × 10⁹/L", "100 × 10⁹/L", "50 × 10⁹/L", "10 × 10⁹/L"], "k": 2, "w": "Spontaneous bleeding below 20 × 10⁹/L.", "id": "m225"}, {"ch": 5, "t": "cloze", "s": "Atherosclerosis begins with {{endothelial injury}} and entry and oxidation of {{LDL}} in the intima.", "h": "step 1–2", "id": "c226"}, {"ch": 5, "t": "cloze", "s": "Lipid-laden macrophages are called {{foam cells}} and form {{fatty streaks}}.", "h": "early lesion", "id": "c227"}, {"ch": 5, "t": "cloze", "s": "Hypertension is ≥{{140/90}} mmHg in the clinic; essential hypertension is about {{90%}} of cases.", "h": "definition", "id": "c228"}, {"ch": 5, "t": "cloze", "s": "An aneurysm is a permanent dilatation of at least {{50%}} of normal diameter.", "h": "definition", "id": "c229"}, {"ch": 5, "t": "cloze", "s": "Stable angina results from a fixed stenosis of more than {{70%}}.", "h": "demand ischaemia", "id": "c230"}, {"ch": 5, "t": "cloze", "s": "The commonest cause of early death after MI is {{ventricular fibrillation}}.", "h": "arrhythmia", "id": "c231"}, {"ch": 5, "t": "cloze", "s": "Primary haemostasis = platelets + {{vWF}}; secondary haemostasis = the {{coagulation cascade}}.", "h": "two stages", "id": "c232"}, {"ch": 5, "t": "cloze", "s": "The vitamin K-dependent factors are {{II}}, {{VII}}, {{IX}} and {{X}}.", "h": "warfarin", "id": "c233"}, {"ch": 5, "t": "cloze", "s": "PT/INR tests the {{extrinsic}} pathway; APTT the {{intrinsic}}.", "h": "lab tests", "id": "c234"}, {"ch": 5, "t": "cloze", "s": "Thrombocytopenia is a platelet count below {{150}} × 10⁹/L; spontaneous bleeding occurs below {{20}}.", "h": "thresholds", "id": "c235"}, {"ch": 5, "t": "cloze", "s": "Haemophilia A is deficiency of factor {{VIII}}; haemophilia B of factor {{IX}}.", "h": "X-linked", "id": "c236"}, {"ch": 5, "t": "cloze", "s": "von Willebrand disease affects about {{1%}} of the population and is treated with {{desmopressin}}.", "h": "commonest inherited", "id": "c237"}, {"ch": 6, "t": "qa", "q": "Central vs peripheral chemoreceptors.", "a": "Central (medulla): ↑CO₂/H⁺ in CSF, the main driver. Peripheral (carotid bodies mainly): ↓PaO₂, also CO₂ and H⁺.", "id": "q238"}, {"ch": 6, "t": "qa", "q": "Why are sedatives and high-flow oxygen risky in severe COPD?", "a": "CNS depressants depress respiratory centres; chronic hypoxia makes patients rely on hypoxic drive, so removing hypoxia or sedating can cause CO₂ retention.", "id": "q239"}, {"ch": 6, "t": "qa", "q": "Cells of the respiratory epithelium and their roles.", "a": "Ciliated columnar (mucociliary clearance), goblet cells (mucus), neuroendocrine cells (carcinoid, small-cell carcinoma), basal cells (stem), submucosal glands.", "id": "q240"}, {"ch": 6, "t": "qa", "q": "Non-respiratory functions of the lung.", "a": "Defence against inhaled substances; metabolism of bradykinin, serotonin, prostaglandins; conversion of angiotensin I to II by endothelial ACE.", "id": "q241"}, {"ch": 6, "t": "qa", "q": "α1-antitrypsin deficiency.", "a": "Unopposed neutrophil elastase destroys alveolar walls → early-onset emphysema.", "id": "q242"}, {"ch": 6, "t": "qa", "q": "Why does maxillary sinusitis mimic toothache, and how do you tell?", "a": "Maxillary roots and superior alveolar nerves border the antrum. Sinusitis: worse on head movement, several teeth tender to percussion, teeth vital, sinus tenderness, imaging changes. ~25% of maxillary sinusitis is dental in origin.", "id": "q243"}, {"ch": 6, "t": "qa", "q": "Clinical definition of chronic bronchitis.", "a": "Productive cough for at least 3 months in each of 2 consecutive years; smoking the major cause.", "id": "q244"}, {"ch": 6, "t": "qa", "q": "Pathogenesis of COPD.", "a": "Impaired mucociliary clearance, mucus hypersecretion (goblet/gland hyperplasia), airway wall oedema and fibrosis → irreversible narrowing → hypoxaemia → pulmonary hypertension, respiratory failure.", "id": "q245"}, {"ch": 6, "t": "qa", "q": "Dental management of COPD.", "a": "Upright position; avoid CNS depressants; oxygen with care; consider steroid cover; look for smoking-related lesions.", "id": "q246"}, {"ch": 6, "t": "qa", "q": "Asthma vs COPD — the key difference.", "a": "Asthma has a reversible component (bronchospasm); COPD narrowing is irreversible.", "id": "q247"}, {"ch": 6, "t": "qa", "q": "Asthma types.", "a": "Extrinsic (allergic/atopic), intrinsic, exercise-induced, drug (aspirin)-induced, infectious.", "id": "q248"}, {"ch": 6, "t": "qa", "q": "Salbutamol vs Symbicort.", "a": "Salbutamol: β2 agonist reliever — relaxes airway smooth muscle. Symbicort: inhaled corticosteroid + LABA for long-term control; use a spacer and rinse mouth (candidosis).", "id": "q249"}, {"ch": 6, "t": "qa", "q": "Define OSA and give the AHI bands.", "a": "Recurrent pharyngeal collapse during sleep despite effort. AHI <5 normal; 5–<15 mild; 15–<30 moderate; ≥30 severe.", "id": "q250"}, {"ch": 6, "t": "qa", "q": "Apnoea vs hypopnoea scoring.", "a": "Apnoea: ≥90% drop ≥10 s. Hypopnoea: ≥30% drop ≥10 s plus ≥3% desaturation or arousal.", "id": "q251"}, {"ch": 6, "t": "qa", "q": "OSA prevalence and diagnosis rate.", "a": "1 in 5 adults mild, 1 in 15 moderate–severe; 80% undiagnosed. Screen with STOP-BANG/Epworth; diagnose with PSG or home study.", "id": "q252"}, {"ch": 6, "t": "qa", "q": "Oral and facial signs of OSA.", "a": "Narrow palate, retrognathia, large tongue/uvula/tonsils, high Mallampati, scalloped tongue, bruxism/parafunction, night-time dryness.", "id": "q253"}, {"ch": 6, "t": "qa", "q": "CPAP vs mandibular advancement splint.", "a": "CPAP: gold standard first-line pneumatic splint, poor compliance. MAS: second-line, advances mandible/tongue and widens velopharynx, better compliance; TMJ and occlusal side effects.", "id": "q254"}, {"ch": 6, "t": "qa", "q": "Key unifying concept of bone disease.", "a": "All bone disease is some form of disordered bone remodelling — loss of coupling between resorption and formation.", "id": "q255"}, {"ch": 6, "t": "qa", "q": "Why are the jaws vulnerable to bone disease?", "a": "High remodelling rate, constant loading, predominantly trabecular bone, rapid response to systemic change, thin mucosa and constant microbial exposure.", "id": "q256"}, {"ch": 6, "t": "qa", "q": "Osteoclast: origin, mechanism, regulation.", "a": "Monocyte–macrophage lineage; seals a resorption lacuna, secretes H⁺ and cathepsins; regulated by PTH, vitamin D and RANK–RANKL–OPG.", "id": "q257"}, {"ch": 6, "t": "qa", "q": "Osteoblast and osteocyte functions.", "a": "Osteoblast (mesenchymal): makes osteoid, alkaline phosphatase, RANKL and OPG. Osteocyte: embedded mechanosensor network, central regulator of remodelling.", "id": "q258"}, {"ch": 6, "t": "qa", "q": "The five phases of bone remodelling.", "a": "Activation → resorption → reversal → formation → mineralisation.", "id": "q259"}, {"ch": 6, "t": "qa", "q": "Four mechanisms of bone pain.", "a": "Periosteal stretching; raised intraosseous pressure; inflammatory mediators; microfractures. (Mineralised matrix itself is not innervated.)", "id": "q260"}, {"ch": 6, "t": "qa", "q": "Requirements for fracture healing and what delays it.", "a": "Blood supply, stability/immobilisation, viable bone ends. Delayed by movement, infection, corticosteroids, poor nutrition, ischaemia.", "id": "q261"}, {"ch": 6, "t": "qa", "q": "Define osteoporosis.", "a": "Reduced bone mass with normal mineralisation; resorption exceeds formation; trabecular bone first; fragility fractures (vertebra, hip, wrist).", "id": "q262"}, {"ch": 6, "t": "qa", "q": "MRONJ diagnostic criteria.", "a": "Exposed (or probe-able) bone in the maxillofacial region >8 weeks; current or previous anti-resorptive therapy; no jaw radiotherapy.", "id": "q263"}, {"ch": 6, "t": "qa", "q": "Bisphosphonates vs denosumab.", "a": "Bisphosphonates bind bone mineral, are taken up by osteoclasts → apoptosis; persist for years. Denosumab: anti-RANKL antibody, prevents osteoclast formation; effect wanes, no proven anti-angiogenic effect.", "id": "q264"}, {"ch": 6, "t": "qa", "q": "MRONJ risk factors.", "a": "High-dose IV (oncology) therapy, duration, extractions (mandible > maxilla), periodontal infection, steroids, chemotherapy, diabetes, renal disease, poor hygiene, anti-angiogenics.", "id": "q265"}, {"ch": 6, "t": "qa", "q": "MRONJ distribution and management.", "a": "Mandible ~65%, maxilla ~28%, both ~6%. Conservative: remove dental infection, hygiene, chlorhexidine, antibiotics if infected, remove mobile sequestra; surgery if refractory.", "id": "q266"}, {"ch": 6, "t": "qa", "q": "Define osteoradionecrosis and give its pathogenesis.", "a": "Exposed necrotic bone in an irradiated field failing to heal ≥3–6 months without tumour. Radiation-induced fibroatrophy: endothelial damage, fibrosis, osteoblast loss → hypovascular, hypoxic, hypocellular bone.", "id": "q267"}, {"ch": 6, "t": "qa", "q": "ORN risk factors and timing.", "a": ">60 Gy; base of tongue/tonsil/hypopharynx tumours; smoking, alcohol, poor hygiene; extractions especially post-RT; mandibular surgery. Peak 4 months–2 years; can occur years later.", "id": "q268"}, {"ch": 6, "t": "qa", "q": "ORN prevention.", "a": "Dental assessment before RT; extractions ideally ≥1 month before; avoid post-RT extractions; hygiene, cessation; lifelong follow-up.", "id": "q269"}, {"ch": 6, "t": "qa", "q": "Define TMD and give its epidemiology.", "a": "Pain and dysfunction of the TMJs and/or masticatory muscles; prevalence 5–12%, incidence ~4%/year, peak 18–45; ~15% become chronic.", "id": "q270"}, {"ch": 6, "t": "qa", "q": "Is occlusion a cause of TMD?", "a": "No — occlusal variables alone are not aetiological. TMD is biopsychosocial (Engel).", "id": "q271"}, {"ch": 6, "t": "qa", "q": "Strongest psychosocial predictor of TMD onset (OPPERA).", "a": "Frequency of somatic symptoms; somatic awareness also predicts acute-to-chronic progression.", "id": "q272"}, {"ch": 6, "t": "qa", "q": "Relationship between sleep and TMD.", "a": "Bidirectional, but poor sleep affects pain more than pain affects sleep; poor sleep predicts first-onset TMD; screen with PSQI (cut-off 5/21).", "id": "q273"}, {"ch": 6, "t": "qa", "q": "DC/TMD axes.", "a": "Axis I: physical diagnoses (myalgia, arthralgia, headache, disc displacements, DJD, subluxation). Axis II: psychosocial and behavioural screening.", "id": "q274"}, {"ch": 6, "t": "qa", "q": "Disc displacement with reduction vs without reduction with limited opening.", "a": "With: anterior disc reduces on opening — click, normal range. Without (closed lock): no reduction, limited opening, deviation to affected side, no click.", "id": "q275"}, {"ch": 6, "t": "qa", "q": "TMJ osteoarthritis vs rheumatoid arthritis.", "a": "OA: non-inflammatory degeneration, crepitus, osteophytes, subchondral sclerosis. RA: autoimmune synovitis (types III and IV), pannus, morning stiffness, condylar resorption → anterior open bite.", "id": "q276"}, {"ch": 6, "t": "mcq", "q": "The primary minute-to-minute driver of ventilation is:", "o": ["Low PaO₂ at the carotid bodies", "Raised CO₂/H⁺ at the central chemoreceptors", "Lung stretch receptors", "Aortic baroreceptors"], "k": 1, "w": "In chronic hypoxia patients may rely more on the hypoxic drive.", "id": "m277"}, {"ch": 6, "t": "mcq", "q": "Chronic bronchitis is defined clinically as productive cough for:", "o": ["2 weeks", "3 months in each of 2 consecutive years", "6 months once", "1 year continuously"], "k": 1, "w": "Smoking is the main cause.", "id": "m278"}, {"ch": 6, "t": "mcq", "q": "The feature that distinguishes asthma from COPD is:", "o": ["Mucus hypersecretion", "Airway wall thickening", "A reversible component", "Smoking as the main cause"], "k": 2, "w": "Asthma bronchospasm reverses with bronchodilators.", "id": "m279"}, {"ch": 6, "t": "mcq", "q": "α1-antitrypsin deficiency causes:", "o": ["Cystic fibrosis", "Early-onset emphysema", "Asthma", "Sarcoidosis"], "k": 1, "w": "Unopposed neutrophil elastase destroys alveolar walls.", "id": "m280"}, {"ch": 6, "t": "mcq", "q": "Moderate OSA corresponds to an AHI of:", "o": ["<5", "5 to <15", "15 to <30", "≥30"], "k": 2, "w": "Mild 5–15, severe ≥30.", "id": "m281"}, {"ch": 6, "t": "mcq", "q": "First-line treatment for OSA is:", "o": ["Mandibular advancement splint", "CPAP", "Tonsillectomy", "Weight loss alone"], "k": 1, "w": "CPAP is the gold standard; MAS is second-line.", "id": "m282"}, {"ch": 6, "t": "mcq", "q": "Osteoclasts derive from the:", "o": ["Mesenchymal stem cell", "Monocyte–macrophage lineage", "Osteocyte", "Fibroblast"], "k": 1, "w": "Osteoblasts are mesenchymal.", "id": "m283"}, {"ch": 6, "t": "mcq", "q": "Denosumab acts by:", "o": ["Binding bone mineral", "Inhibiting RANKL", "Stimulating osteoblasts", "Blocking VEGF"], "k": 1, "w": "An anti-RANKL monoclonal antibody.", "id": "m284"}, {"ch": 6, "t": "mcq", "q": "MRONJ requires exposed bone persisting for more than:", "o": ["2 weeks", "4 weeks", "8 weeks", "6 months"], "k": 2, "w": "With current/previous anti-resorptive therapy and no jaw radiotherapy.", "id": "m285"}, {"ch": 6, "t": "mcq", "q": "The commonest site of MRONJ is the:", "o": ["Maxilla", "Mandible", "Both equally", "Zygoma"], "k": 1, "w": "Mandible ≈65%, maxilla ≈28%, both ≈6%.", "id": "m286"}, {"ch": 6, "t": "mcq", "q": "Osteoradionecrosis bone is best described as:", "o": ["Hypervascular and hypercellular", "Hypovascular, hypoxic and hypocellular", "Normally vascularised but poorly mineralised", "Infected but otherwise normal"], "k": 1, "w": "Radiation-induced fibroatrophy.", "id": "m287"}, {"ch": 6, "t": "mcq", "q": "ORN risk rises particularly with radiation doses above:", "o": ["20 Gy", "40 Gy", "60 Gy", "100 Gy"], "k": 2, "w": "Also base of tongue/tonsil tumours and post-RT extraction.", "id": "m288"}, {"ch": 6, "t": "mcq", "q": "Which statement about TMD aetiology is best supported?", "o": ["Malocclusion is the primary cause", "TMD is biopsychosocial", "TMD is purely muscular", "TMD is genetic only"], "k": 1, "w": "Occlusal variables alone are not aetiological.", "id": "m289"}, {"ch": 6, "t": "mcq", "q": "A TMJ click on opening with normal range indicates:", "o": ["Disc displacement without reduction", "Disc displacement with reduction", "Osteoarthritis only", "Subluxation"], "k": 1, "w": "The disc reduces onto the condyle on opening.", "id": "m290"}, {"ch": 6, "t": "mcq", "q": "'My bite doesn't fit' with morning stiffness suggests TMJ:", "o": ["Osteoarthritis", "Rheumatoid arthritis", "Disc displacement with reduction", "Myalgia"], "k": 1, "w": "Condylar resorption → anterior open bite.", "id": "m291"}, {"ch": 6, "t": "cloze", "s": "Central chemoreceptors respond to raised {{CO₂}}; carotid bodies to low {{PaO₂}}.", "h": "control of breathing", "id": "c292"}, {"ch": 6, "t": "cloze", "s": "Chronic bronchitis = productive cough for {{3 months}} in each of {{2}} consecutive years.", "h": "definition", "id": "c293"}, {"ch": 6, "t": "cloze", "s": "Severe OSA is an AHI of ≥{{30}} events per hour.", "h": "severity", "id": "c294"}, {"ch": 6, "t": "cloze", "s": "About {{80%}} of people with OSA are undiagnosed.", "h": "screening", "id": "c295"}, {"ch": 6, "t": "cloze", "s": "Osteoclasts derive from the {{monocyte–macrophage}} lineage; osteoblasts from {{mesenchymal}} stem cells.", "h": "bone cells", "id": "c296"}, {"ch": 6, "t": "cloze", "s": "Osteoporosis is reduced bone mass with {{normal}} mineralisation.", "h": "vs osteomalacia", "id": "c297"}, {"ch": 6, "t": "cloze", "s": "MRONJ requires exposed bone for more than {{8}} weeks.", "h": "criteria", "id": "c298"}, {"ch": 6, "t": "cloze", "s": "Denosumab is a monoclonal antibody against {{RANKL}}.", "h": "anti-resorptive", "id": "c299"}, {"ch": 6, "t": "cloze", "s": "ORN is necrotic irradiated bone failing to heal for ≥{{3–6}} months; risk rises above {{60}} Gy.", "h": "radiation", "id": "c300"}, {"ch": 6, "t": "cloze", "s": "TMD prevalence is {{5–12%}}, peaking at age {{18–45}}.", "h": "epidemiology", "id": "c301"}, {"ch": 6, "t": "cloze", "s": "DC/TMD Axis {{I}} covers physical diagnoses; Axis {{II}} psychosocial screening.", "h": "dual axis", "id": "c302"}]};
const KEY='doh233recall-L6L9-v1';
const today=()=>Math.floor(Date.now()/864e5);
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');return Object.assign({cards:{},sel:null,night:false,log:[]},s)}catch(e){return{cards:{},sel:null,night:false,log:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function st(id){return S.cards[id]||(S.cards[id]={e:2.5,i:0,d:0,r:0,l:0,n:1})}
function isDue(c){const x=S.cards[c.id];return x&&!x.n&&x.d<=today()}
function isNew(c){const x=S.cards[c.id];return !x||x.n}
function isMastered(c){const x=S.cards[c.id];return x&&!x.n&&x.i>=7}
function rate(c,g){ // 1 again 2 hard 3 good 4 easy
  const x=st(c.id); x.n=0; x.r++;
  if(g===1){x.l++;x.i=0;x.e=Math.max(1.3,x.e-0.2);x.d=today();}
  else if(g===2){x.i=Math.max(1,Math.round(x.i*1.2));x.e=Math.max(1.3,x.e-0.15);x.d=today()+x.i;}
  else if(g===3){x.i=x.i===0?1:x.i===1?3:Math.round(x.i*x.e);x.d=today()+x.i;}
  else{x.i=Math.max(4,Math.round((x.i||1)*(x.e+0.3)));x.e=x.e+0.15;x.d=today()+x.i;}
  S.log.push([today(),c.id,g]); if(S.log.length>3000)S.log.shift(); save();
}
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const chList=Object.keys(D.ch).map(Number);
let sel=new Set(S.sel||chList);
function pool(){return D.cards.filter(c=>sel.has(c.ch))}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function clozeHTML(s){return esc(s).replace(/\{\{(.+?)\}\}/g,(m,a)=>'<span class="cl" tabindex="0">'+a+'</span>')}
function clozeAnswer(s){const m=[...s.matchAll(/\{\{(.+?)\}\}/g)].map(x=>x[1]);return m.join(' · ')}

// ---------- home ----------
function home(){
  S.sel=[...sel];save();
  const main=$('main');main.innerHTML='';
  const P=pool(),due=P.filter(isDue),nw=P.filter(isNew),mast=P.filter(isMastered);
  main.append(el('h1',null,'Recall<span> trainer</span>'),el('p','sub','Spaced-repetition flashcards, tutorial-style MCQs and fill-the-blank cards from the master notes. Rate honestly — the scheduler brings back what you missed and pushes out what you know. Progress is saved in this browser.'));
  const chips=el('div','chips');
  chList.forEach(n=>{const b=el('button','chip'+(sel.has(n)?' on':''),n+' · '+D.ch[n]);b.onclick=()=>{sel.has(n)?sel.delete(n):sel.add(n);if(!sel.size)sel.add(n);home()};chips.append(b)});
  const all=el('button','chip all',sel.size===chList.length?'Clear':'Select all');all.onclick=()=>{sel=sel.size===chList.length?new Set([chList[0]]):new Set(chList);home()};chips.append(all);
  main.append(el('h2',null,'Chapters in play'),chips);
  const modes=el('div','modes');
  const mk=(t,d,n,fn)=>{const b=el('button','mode','<span class="n">'+n+'</span><b>'+t+'</b><span>'+d+'</span>');b.onclick=fn;if(!n){b.style.opacity=.55}modes.append(b)};
  mk('Review due','Cards the scheduler says you are about to forget',due.length,()=>session(shuffle(due.slice()),'Review'));
  mk('Learn new','Unseen cards, 20 at a time, in chapter order',Math.min(20,nw.length),()=>session(nw.slice(0,20),'Learn'));
  mk('MCQ quiz','20 exam-style multiple choice, tutorial questions included','20',()=>session(shuffle(P.filter(c=>c.t==='mcq')).slice(0,20),'Quiz'));
  mk('Fill the blanks','Numbers, names and thresholds — the things that get forgotten','20',()=>session(shuffle(P.filter(c=>c.t==='cloze')).slice(0,20),'Blanks'));
  mk('Cram everything','Every selected card regardless of schedule',P.length,()=>session(shuffle(P.slice()),'Cram'));
  mk('Weakest 20','Cards with the most lapses and lowest ease',Math.min(20,P.filter(c=>S.cards[c.id]&&!S.cards[c.id].n).length),()=>session(P.filter(c=>S.cards[c.id]&&!S.cards[c.id].n).sort((a,b)=>(S.cards[b.id].l-S.cards[a.id].l)||(S.cards[a.id].e-S.cards[b.id].e)).slice(0,20),'Weakest'));
  main.append(el('h2',null,'Study'),modes);
  const g=el('div','grid');
  chList.forEach(n=>{const cs=D.cards.filter(c=>c.ch===n),m=cs.filter(isMastered).length,l=cs.filter(c=>!isNew(c)&&!isMastered(c)).length,d=cs.filter(isDue).length;
    const c=el('div','cc','<div class="n">'+n+'</div><div><b>'+D.ch[n]+'</b><small>'+cs.length+' cards · '+m+' mastered · '+l+' learning · '+(cs.length-m-l)+' new</small><div class="bar"><i class="m" style="width:'+(100*m/cs.length)+'%"></i><i class="l" style="width:'+(100*l/cs.length)+'%"></i></div></div><div class="due"><b>'+d+'</b>due<br><button>Cram</button></div>');
    c.querySelector('button').onclick=()=>session(shuffle(cs.slice()),'Cram '+n);g.append(c)});
  main.append(el('h2',null,'Mastery'),g);
  const t=el('div','tools');
  const ex=el('a','tbtn','Export progress');ex.href='data:application/json,'+encodeURIComponent(JSON.stringify(S));ex.download='doh233-recall-L6-L9-progress.json';
  const im=el('label','tbtn','Import progress<input type="file" accept=".json" hidden>');im.querySelector('input').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{S=Object.assign(S,JSON.parse(x));save();home()}catch(err){alert('Not a valid progress file')}})};
  const rs=el('button','tbtn','Reset all progress');rs.onclick=()=>{if(confirm('Wipe all scheduling data?')){S={cards:{},sel:[...sel],night:S.night,log:[]};save();home()}};
  const nt=el('a','tbtn','Open the master notes');nt.href='doh233_master_notes_L6-L9.html';
  t.append(nt,ex,im,rs);main.append(t);
  const total=D.cards.length,mm=D.cards.filter(isMastered).length; $('#stat').innerHTML='<b>'+D.cards.filter(isDue).length+'</b> due · <b>'+Math.round(100*mm/total)+'%</b> mastered';
  scrollTo(0,0);
}

// ---------- session ----------
function session(q,label){
  if(!q.length){const main=$('main');main.innerHTML='';main.append(el('div','empty','Nothing here yet — try Learn new or Cram.'));const b=el('button','tbtn','Back');b.onclick=home;b.style.margin='14px auto 0';b.style.display='block';main.append(b);return}
  const main=$('main');main.innerHTML='';const w=el('div','sess');main.append(w);
  let total=q.length;let done=0,right=0,again=[],res={1:0,2:0,3:0,4:0},wrong=[];
  const bar=el('div','sbar','<span id="lbl"></span><div class="p"><i></i></div><button class="tbtn" id="quit">End session</button>');w.append(bar);
  bar.querySelector('#quit').onclick=()=>finish();
  const box=el('div');w.append(box);
  function prog(){bar.querySelector('#lbl').textContent=label+' · '+done+' / '+total+(again.length?' (+'+again.length+' to repeat)':'');bar.querySelector('.p i').style.width=(100*done/total)+'%'}
  let cur=null,revealed=false;
  function next(){
    if(!q.length){ if(again.length){q=again;total+=again.length;again=[];} else return finish(); }
    cur=q.shift();revealed=false;render();
  }
  function grade(g){rate(cur,g);res[g]++;done++;if(g===1){again.push(cur);wrong.push(cur)}else right++;prog();next()}
  function render(){
    box.innerHTML='';prog();
    const card=el('div','card');box.append(card);
    const k=el('div','k','Chapter '+cur.ch+' · '+D.ch[cur.ch]+' <a href="doh233_master_notes_L6-L9.html#ch'+cur.ch+'" target="_blank">open notes ↗</a><span class="type">'+({qa:'Recall',mcq:'MCQ',cloze:'Fill the blank'})[cur.t]+'</span>');card.append(k);
    if(cur.t==='qa'){
      card.append(el('div','q',esc(cur.q)));
      const acts=el('div','acts');
      const rv=el('button','reveal','Show answer <small>space</small>');rv.onclick=reveal;acts.append(rv);card.append(acts);
      card.append(el('div','kb','Say the answer out loud first. Then rate how it went.'));
      function reveal(){if(revealed)return;revealed=true;const a=el('div','a','<div class="lab">Answer</div>'+esc(cur.a));card.insertBefore(a,acts);acts.innerHTML='';ratings(acts)}
      card._reveal=reveal;
    } else if(cur.t==='cloze'){
      card.append(el('div','q',clozeHTML(cur.s)));
      card.append(el('div','hint','Hint: '+esc(cur.h)+' · click a blank to peek, or reveal all'));
      card.querySelectorAll('.cl').forEach(s=>s.onclick=()=>s.classList.add('open'));
      const acts=el('div','acts');const rv=el('button','reveal','Reveal <small>space</small>');rv.onclick=reveal;acts.append(rv);card.append(acts);
      function reveal(){if(revealed)return;revealed=true;card.classList.add('revealed');acts.innerHTML='';ratings(acts)}
      card._reveal=reveal;
    } else {
      card.append(el('div','q',esc(cur.q)));
      const opts=el('div','opts');const order=shuffle(cur.o.map((t,i)=>i));
      order.forEach((oi,n)=>{const b=el('button','opt',esc(cur.o[oi]));b.dataset.l='ABCD'[n];b.onclick=()=>pick(oi,b);opts.append(b)});card.append(opts);
      card.append(el('div','kb','Press A–D to answer.'));
      card._opts=opts;
      function pick(oi,b){if(revealed)return;revealed=true;const ok=oi===cur.k;opts.querySelectorAll('.opt').forEach((x,n)=>{x.disabled=true;if(order[n]===cur.k)x.classList.add('ok');else if(x===b&&!ok)x.classList.add('bad')});
        card.append(el('div','why',(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+esc(cur.w)));
        const acts=el('div','acts');const nx=el('button','next','Next <small>space</small>');nx.onclick=()=>grade(ok?3:1);acts.append(nx);card.append(acts);card._next=()=>grade(ok?3:1)}
      card._pick=(n)=>{const b=opts.querySelectorAll('.opt')[n];if(b&&!revealed)pick(order[n],b)};
    }
    box._card=card;
  }
  function ratings(acts){[[1,'Again','forgot · 1'],[2,'Hard','barely · 2'],[3,'Good','got it · 3'],[4,'Easy','knew it cold · 4']].forEach(([g,t,s])=>{const b=el('button','r'+g,t+'<small>'+s+'</small>');b.onclick=()=>grade(g);acts.append(b)})}
  function key(e){const c=box._card;if(!c)return;if(e.target.tagName==='INPUT')return;
    if(e.key===' '||e.key==='Enter'){e.preventDefault();if(cur.t==='mcq'){if(revealed&&c._next)c._next()}else{if(!revealed)c._reveal();}return}
    if(cur.t==='mcq'&&!revealed){const n='abcd'.indexOf(e.key.toLowerCase());const m=n>=0?n:'1234'.indexOf(e.key);if(m>=0)c._pick(m);return}
    if(revealed&&cur.t!=='mcq'&&'1234'.includes(e.key)&&e.key)grade(+e.key)}
  document.onkeydown=key;
  function finish(){document.onkeydown=null;box.innerHTML='';const d=el('div','done');
    d.append(el('h2',null,done?'Session complete':'Session ended'));
    d.append(el('div','nums','<div><b>'+done+'</b>answered</div><div><b>'+(done?Math.round(100*right/done):0)+'%</b>recalled</div><div><b>'+res[1]+'</b>missed</div><div><b>'+res[4]+'</b>easy</div>'));
    const miss=[...new Set(wrong.map(c=>c.id))].map(id=>D.cards.find(c=>c.id===id));
    if(miss.length){const u=el('ul','weak');d.append(el('p',null,'<b>Worth re-reading:</b>'));miss.slice(0,12).forEach(c=>u.append(el('li',null,'Ch '+c.ch+' — '+esc(c.t==='cloze'?c.s.replace(/\{\{|\}\}/g,''):c.q))));d.append(u)}
    const b=el('button','tbtn','Back to dashboard');b.onclick=home;b.style.marginTop='16px';d.append(b);box.append(d);scrollTo(0,0)}
  next();scrollTo(0,0);
}
// night
const root=document.documentElement;if(S.night)root.setAttribute('data-mode','night');
$('#night').onclick=()=>{S.night=!S.night;root.setAttribute('data-mode',S.night?'night':'day');save()};
$('#home').onclick=e=>{e.preventDefault();document.onkeydown=null;home()};
home();
</script>
