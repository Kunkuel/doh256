<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&display=swap');
:root{--paper:#f1f3ef;--sheet:#fafbf8;--ink:#16211c;--ink2:#4a574f;--mute:#7a867e;--rule:#d3dad4;--rule2:#e4e9e4;--green:#1e5a48;--green2:#154236;--tint:#e7efe9;--hl:#ffe45c;--hlb:#f4d33a;--red:#b3402d;--redt:#f6e3df;--okt:#dcefe4}
html[data-mode=night]{--paper:#111614;--sheet:#181f1b;--ink:#e8ece8;--ink2:#b3beb6;--mute:#7f8b83;--rule:#2b352f;--rule2:#212a25;--green:#7fc4a8;--green2:#a4d9c2;--tint:#1c2a24;--hl:#5a4a00;--hlb:#7a6500;--red:#e07a68;--redt:#3a201b;--okt:#1d3a2c}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;font-size:16.5px;line-height:1.55}
a{color:var(--green)}button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:10;height:58px;display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{font-weight:800;font-variation-settings:"wdth" 75;font-size:19px;color:var(--ink);text-decoration:none;white-space:nowrap}.brand small{font-weight:500;color:var(--ink2);font-variation-settings:"wdth" 90;margin-left:8px;font-size:14px}
.top .sp{flex:1}.top .stat{font-size:13px;color:var(--ink2)}.top .stat b{color:var(--ink)}
.tbtn{height:34px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:6px;padding:0 12px;font-size:13.5px;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.tbtn.sq{width:34px;padding:0;justify-content:center}
main{max-width:940px;margin:0 auto;padding:34px 22px 100px}
h1{font-variation-settings:"wdth" 72;font-weight:900;font-size:56px;line-height:.95;letter-spacing:-.03em;margin:0 0 8px}
h1 span{color:var(--green)}.sub{color:var(--ink2);font-size:17px;margin:0 0 26px;max-width:62ch}
h2{font-variation-settings:"wdth" 82;font-weight:800;font-size:22px;margin:30px 0 12px;padding-top:12px;border-top:2px solid var(--ink)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{background:var(--sheet);border:1px solid var(--rule);border-left:5px solid var(--green);padding:14px 16px;text-align:left;color:var(--ink)}
.mode:hover{background:var(--tint)}.mode b{display:block;font-size:17px;font-variation-settings:"wdth" 88;font-weight:800}.mode span{font-size:13.5px;color:var(--ink2)}.mode .n{float:right;font-variation-settings:"wdth" 70;font-weight:900;font-size:30px;color:var(--green);line-height:1;margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{border:1px solid var(--rule);background:var(--sheet);color:var(--ink2);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600}.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips .all{margin-left:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{background:var(--sheet);border:1px solid var(--rule);padding:12px 14px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.cc .n{font-variation-settings:"wdth" 70;font-weight:900;font-size:26px;color:var(--green)}.cc b{display:block;font-size:14.5px}.cc small{color:var(--ink2);font-size:12.5px}
.bar{height:6px;background:var(--rule2);border-radius:3px;overflow:hidden;margin-top:6px;display:flex}.bar i{display:block;height:100%}.bar .m{background:var(--green)}.bar .l{background:var(--hlb)}
.cc .due{font-size:12px;color:var(--ink2);text-align:right}.cc .due b{display:block;font-size:20px;color:var(--ink);font-variation-settings:"wdth" 75}
.cc button{margin-top:4px;font-size:12px;padding:3px 8px;border:1px solid var(--rule);background:transparent;color:var(--green);border-radius:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tools .tbtn{font-weight:500}
/* session */
.sess{max-width:760px;margin:0 auto}
.sbar{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2);margin-bottom:14px}.sbar .p{flex:1;height:6px;background:var(--rule2);border-radius:3px;overflow:hidden}.sbar .p i{display:block;height:100%;background:var(--green);width:0;transition:width .2s}
.card{background:var(--sheet);border:1px solid var(--rule);padding:28px 30px 24px;min-height:300px;position:relative}
.card .k{font-size:12.5px;font-weight:700;color:var(--green);margin-bottom:10px;display:flex;gap:10px;align-items:center}.card .k a{font-weight:500;color:var(--ink2)}.card .k .type{margin-left:auto;font-weight:600;color:var(--mute)}
.card .q{font-size:22px;line-height:1.4;font-weight:600;font-variation-settings:"wdth" 92}
.card .a{margin-top:20px;padding-top:18px;border-top:1px dashed var(--rule);font-size:17.5px;line-height:1.55}
.card .a .lab{font-size:12px;font-weight:700;color:var(--green);margin-bottom:6px}
.cl{background:var(--ink);color:transparent;border-radius:3px;padding:0 .3em;cursor:pointer;user-select:none;min-width:2.4em;display:inline-block}
.cl.open,.card.revealed .cl{background:var(--hl);color:var(--ink);box-shadow:inset 0 -.25em var(--hlb)}
.hint{color:var(--mute);font-size:13.5px;margin-top:10px}
.opts{display:grid;gap:8px;margin-top:18px}
.opt{text-align:left;padding:11px 14px 11px 44px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);position:relative;font-size:16px;line-height:1.4}
.opt::before{content:attr(data-l);position:absolute;left:12px;top:9px;width:22px;height:22px;border-radius:50%;border:2px solid var(--green);color:var(--green);display:grid;place-items:center;font-size:12px;font-weight:800}
.opt:hover{background:var(--tint)}.opt.ok{background:var(--okt);border-color:var(--green)}.opt.bad{background:var(--redt);border-color:var(--red)}.opt.ok::before{background:var(--green);color:var(--paper)}.opt.bad::before{background:var(--red);border-color:var(--red);color:#fff}.opt:disabled{cursor:default}
.why{margin-top:14px;padding:12px 14px;background:var(--tint);border-left:4px solid var(--green);font-size:15px}
.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.acts button{flex:1;min-width:110px;padding:12px 10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-weight:700;font-size:15px;border-radius:6px}
.acts button small{display:block;font-weight:500;font-size:11.5px;color:var(--mute)}
.acts .reveal{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.acts .r1{border-color:var(--red);color:var(--red)}.acts .r3{border-color:var(--green);color:var(--green)}.acts .r4{background:var(--green);color:var(--paper);border-color:var(--green)}
.acts .next{background:var(--green);color:var(--paper);border-color:var(--green)}
.kb{font-size:12.5px;color:var(--mute);margin-top:12px;text-align:center}
.done{text-align:center;padding:40px 20px}.done h2{border:0;font-size:36px}.done .nums{display:flex;justify-content:center;gap:26px;margin:18px 0}.done .nums div b{display:block;font-size:34px;font-variation-settings:"wdth" 70;font-weight:900;color:var(--green)}.done .nums div{font-size:13px;color:var(--ink2)}
.weak{margin:20px auto 0;max-width:640px;text-align:left}.weak li{font-size:14px;margin:4px 0}
.empty{padding:30px;text-align:center;color:var(--ink2);background:var(--sheet);border:1px dashed var(--rule)}
@media(max-width:700px){h1{font-size:40px}.grid{grid-template-columns:1fr}.card{padding:20px 18px}.card .q{font-size:19px}.top{padding:0 12px;gap:8px}.top .stat{display:none}main{padding:22px 14px 80px}}
@media(max-width:700px){.brand small{display:none}}
