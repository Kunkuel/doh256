<!DOCTYPE html><html lang="en" data-mode="day"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOH 233 Recall Trainer — L1–L5 &amp; L7</title>
<meta name="description" content="Spaced-repetition flashcards, MCQs and fill-the-blank cards for DOH 233 midterm revision.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&display=swap');
:root{--paper:#f1f3ef;--sheet:#fafbf8;--ink:#16211c;--ink2:#4a574f;--mute:#7a867e;--rule:#d3dad4;--rule2:#e4e9e4;--green:#1e5a48;--green2:#154236;--tint:#e7efe9;--hl:#ffe45c;--hlb:#f4d33a;--red:#b3402d;--redt:#f6e3df;--okt:#dcefe4}
html[data-mode=night]{--paper:#111614;--sheet:#181f1b;--ink:#e8ece8;--ink2:#b3beb6;--mute:#7f8b83;--rule:#2b352f;--rule2:#212a25;--green:#7fc4a8;--green2:#a4d9c2;--tint:#1c2a24;--hl:#5a4a00;--hlb:#7a6500;--red:#e07a68;--redt:#3a201b;--okt:#1d3a2c}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;font-size:16.5px;line-height:1.55}
a{color:var(--green)}button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:10;height:58px;display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{font-weight:800;font-variation-settings:"wdth" 75;font-size:19px;color:var(--ink);text-decoration:none;white-space:nowrap}.brand small{font-weight:500;color:var(--ink2);font-variation-settings:"wdth" 90;margin-left:8px;font-size:14px}
.top .sp{flex:1}.top .stat{font-size:13px;color:var(--ink2)}.top .stat b{color:var(--ink)}
.tbtn{height:34px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:6px;padding:0 12px;font-size:13.5px;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.tbtn.sq{width:34px;padding:0;justify-content:center}
main{max-width:940px;margin:0 auto;padding:34px 22px 100px}
h1{font-variation-settings:"wdth" 72;font-weight:900;font-size:56px;line-height:.95;letter-spacing:-.03em;margin:0 0 8px}
h1 span{color:var(--green)}.sub{color:var(--ink2);font-size:17px;margin:0 0 26px;max-width:62ch}
h2{font-variation-settings:"wdth" 82;font-weight:800;font-size:22px;margin:30px 0 12px;padding-top:12px;border-top:2px solid var(--ink)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{background:var(--sheet);border:1px solid var(--rule);border-left:5px solid var(--green);padding:14px 16px;text-align:left;color:var(--ink)}
.mode:hover{background:var(--tint)}.mode b{display:block;font-size:17px;font-variation-settings:"wdth" 88;font-weight:800}.mode span{font-size:13.5px;color:var(--ink2)}.mode .n{float:right;font-variation-settings:"wdth" 70;font-weight:900;font-size:30px;color:var(--green);line-height:1;margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{border:1px solid var(--rule);background:var(--sheet);color:var(--ink2);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600}.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips .all{margin-left:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{background:var(--sheet);border:1px solid var(--rule);padding:12px 14px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.cc .n{font-variation-settings:"wdth" 70;font-weight:900;font-size:26px;color:var(--green)}.cc b{display:block;font-size:14.5px}.cc small{color:var(--ink2);font-size:12.5px}
.bar{height:6px;background:var(--rule2);border-radius:3px;overflow:hidden;margin-top:6px;display:flex}.bar i{display:block;height:100%}.bar .m{background:var(--green)}.bar .l{background:var(--hlb)}
.cc .due{font-size:12px;color:var(--ink2);text-align:right}.cc .due b{display:block;font-size:20px;color:var(--ink);font-variation-settings:"wdth" 75}
.cc button{margin-top:4px;font-size:12px;padding:3px 8px;border:1px solid var(--rule);background:transparent;color:var(--green);border-radius:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tools .tbtn{font-weight:500}
/* session */
.sess{max-width:760px;margin:0 auto}
.sbar{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2);margin-bottom:14px}.sbar .p{flex:1;height:6px;background:var(--rule2);border-radius:3px;overflow:hidden}.sbar .p i{display:block;height:100%;background:var(--green);width:0;transition:width .2s}
.card{background:var(--sheet);border:1px solid var(--rule);padding:28px 30px 24px;min-height:300px;position:relative}
.card .k{font-size:12.5px;font-weight:700;color:var(--green);margin-bottom:10px;display:flex;gap:10px;align-items:center}.card .k a{font-weight:500;color:var(--ink2)}.card .k .type{margin-left:auto;font-weight:600;color:var(--mute)}
.card .q{font-size:22px;line-height:1.4;font-weight:600;font-variation-settings:"wdth" 92}
.card .a{margin-top:20px;padding-top:18px;border-top:1px dashed var(--rule);font-size:17.5px;line-height:1.55}
.card .a .lab{font-size:12px;font-weight:700;color:var(--green);margin-bottom:6px}
.cl{background:var(--ink);color:transparent;border-radius:3px;padding:0 .3em;cursor:pointer;user-select:none;min-width:2.4em;display:inline-block}
.cl.open,.card.revealed .cl{background:var(--hl);color:var(--ink);box-shadow:inset 0 -.25em var(--hlb)}
.hint{color:var(--mute);font-size:13.5px;margin-top:10px}
.opts{display:grid;gap:8px;margin-top:18px}
.opt{text-align:left;padding:11px 14px 11px 44px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);position:relative;font-size:16px;line-height:1.4}
.opt::before{content:attr(data-l);position:absolute;left:12px;top:9px;width:22px;height:22px;border-radius:50%;border:2px solid var(--green);color:var(--green);display:grid;place-items:center;font-size:12px;font-weight:800}
.opt:hover{background:var(--tint)}.opt.ok{background:var(--okt);border-color:var(--green)}.opt.bad{background:var(--redt);border-color:var(--red)}.opt.ok::before{background:var(--green);color:var(--paper)}.opt.bad::before{background:var(--red);border-color:var(--red);color:#fff}.opt:disabled{cursor:default}
.why{margin-top:14px;padding:12px 14px;background:var(--tint);border-left:4px solid var(--green);font-size:15px}
.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.acts button{flex:1;min-width:110px;padding:12px 10px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-weight:700;font-size:15px;border-radius:6px}
.acts button small{display:block;font-weight:500;font-size:11.5px;color:var(--mute)}
.acts .reveal{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.acts .r1{border-color:var(--red);color:var(--red)}.acts .r3{border-color:var(--green);color:var(--green)}.acts .r4{background:var(--green);color:var(--paper);border-color:var(--green)}
.acts .next{background:var(--green);color:var(--paper);border-color:var(--green)}
.kb{font-size:12.5px;color:var(--mute);margin-top:12px;text-align:center}
.done{text-align:center;padding:40px 20px}.done h2{border:0;font-size:36px}.done .nums{display:flex;justify-content:center;gap:26px;margin:18px 0}.done .nums div b{display:block;font-size:34px;font-variation-settings:"wdth" 70;font-weight:900;color:var(--green)}.done .nums div{font-size:13px;color:var(--ink2)}
.weak{margin:20px auto 0;max-width:640px;text-align:left}.weak li{font-size:14px;margin:4px 0}
.empty{padding:30px;text-align:center;color:var(--ink2);background:var(--sheet);border:1px dashed var(--rule)}
@media(max-width:700px){h1{font-size:40px}.grid{grid-template-columns:1fr}.card{padding:20px 18px}.card .q{font-size:19px}.top{padding:0 12px;gap:8px}.top .stat{display:none}main{padding:22px 14px 80px}}

<script>
const D={"ch": {"1": "Introduction to Pathology", "2": "Cell injury", "3": "Acute inflammation", "4": "Chronic inflammation", "5": "Healing & repair", "6": "Hypersensitivity", "7": "Autoimmunity & transplantation", "8": "Immunodeficiency", "9": "Neoplasia 1", "10": "Neoplasia 2"}, "cards": [{"id": "q0", "ch": 1, "t": "qa", "q": "Define disease.", "a": "A state of abnormal structure and/or function of cells, tissues, organs or systems — a disturbance of homeostasis."}, {"id": "q1", "ch": 1, "t": "qa", "q": "Symptom vs sign — define each with an example.", "a": "Symptom: subjective, reported by the patient (pain, fatigue). Sign: objective, observed or measured by the clinician (swelling, fever)."}, {"id": "q2", "ch": 1, "t": "qa", "q": "Name the three core questions of pathology, in order.", "a": "Aetiology (cause) → pathogenesis (mechanism) → morphologic and functional change (what is seen and how function is altered)."}, {"id": "q3", "ch": 1, "t": "qa", "q": "Give the three axes on which any disease varies clinically.", "a": "Acute vs chronic; localised vs systemic; reversible vs irreversible."}, {"id": "q4", "ch": 1, "t": "qa", "q": "Cellular vs molecular pathology in one line each.", "a": "Cellular: disease explained by cell injury, adaptation and death as seen under the microscope. Molecular: disease at the level of genes and proteins — the lesion may precede any visible change."}, {"id": "q5", "ch": 1, "t": "qa", "q": "A disease is common in Japan, rare in the USA, and Japanese migrants acquire US rates within a generation. Genetic or environmental?", "a": "Environmental — genes travel with the migrant; the risk did not."}, {"id": "q6", "ch": 1, "t": "qa", "q": "Four reasons pathology matters in clinical practice.", "a": "Accurate diagnosis; evidence-based treatment targeted at mechanism; prevention and public health; monitoring and prognosis."}, {"id": "q7", "ch": 1, "t": "qa", "q": "What is meant by 'multifactorial' causation?", "a": "Multiple genetic variants interacting with environmental exposures, with threshold effects and variable expression — most common chronic diseases."}, {"id": "q8", "ch": 2, "t": "qa", "q": "The four cellular adaptations.", "a": "Hypertrophy, hyperplasia, atrophy, metaplasia. (Apoptosis is cell death, not an adaptation.)"}, {"id": "q9", "ch": 2, "t": "qa", "q": "Hypertrophy vs hyperplasia — definition and one example each.", "a": "Hypertrophy: increase in cell size (cardiac muscle in hypertension). Hyperplasia: increase in cell number (endometrium). The gravid uterus does both."}, {"id": "q10", "ch": 2, "t": "qa", "q": "Why can the heart only hypertrophy?", "a": "Cardiac myocytes are permanent cells and cannot divide, so they can only enlarge."}, {"id": "q11", "ch": 2, "t": "qa", "q": "Labile, stable, permanent — examples of each.", "a": "Labile: oral mucosa, skin, gut lining, marrow. Stable: liver, kidney, fibroblasts. Permanent: neurons, cardiac and skeletal muscle."}, {"id": "q12", "ch": 2, "t": "qa", "q": "Six causes of pathologic atrophy.", "a": "Disuse, denervation, loss of blood supply, pressure, malnutrition, loss of endocrine/functional stimulation."}, {"id": "q13", "ch": 2, "t": "qa", "q": "Define metaplasia and give the classic oesophageal example.", "a": "Reversible replacement of one mature cell type by another better able to withstand a chronic stress. Barrett's oesophagus: squamous → columnar under chronic reflux; ↑ risk of adenocarcinoma."}, {"id": "q14", "ch": 2, "t": "qa", "q": "Why is ischaemia more damaging than hypoxia?", "a": "Ischaemia removes glucose as well as oxygen and stops metabolite removal, so the anaerobic pathway that rescues a hypoxic cell is also cut off."}, {"id": "q15", "ch": 2, "t": "qa", "q": "Three cellular targets of injury.", "a": "Cell and organelle membranes; metabolic pathways/ATP (mitochondria); DNA and proteins."}, {"id": "q16", "ch": 2, "t": "qa", "q": "Microscopic features of reversible injury.", "a": "Cellular swelling (hydropic change), fatty change, dilated ER, membrane blebs — nucleus intact."}, {"id": "q17", "ch": 2, "t": "qa", "q": "The three nuclear changes of irreversible injury.", "a": "Pyknosis (shrunken, dense), karyorrhexis (fragmented), karyolysis (dissolved)."}, {"id": "q18", "ch": 2, "t": "qa", "q": "Apoptosis vs necrosis — the decisive difference and its consequence.", "a": "Membrane intact vs ruptured. Apoptosis packages contents into apoptotic bodies → no inflammation; necrosis leaks contents → inflammation."}, {"id": "q19", "ch": 2, "t": "qa", "q": "Name the anti-apoptotic and pro-apoptotic Bcl-2 family members.", "a": "Anti: Bcl-2, Bcl-xL. Pro: Bak, Bax."}, {"id": "q20", "ch": 2, "t": "qa", "q": "Deterministic vs stochastic radiation effects.", "a": "Deterministic: severity rises with dose, has a threshold (burns, mucositis). Stochastic: only probability rises with dose, no safe threshold (cancer, heritable mutation)."}, {"id": "q21", "ch": 2, "t": "qa", "q": "Why is oral mucosa so sensitive to radiotherapy?", "a": "It is labile, rapidly dividing tissue — as radiosensitive as the tumour, hence mucositis."}, {"id": "q22", "ch": 2, "t": "qa", "q": "Muscle wasting after 6 weeks of bed rest: name it, classify it, mechanism.", "a": "Disuse atrophy; pathologic. Reduced load → protein degradation (ubiquitin–proteasome, autophagy) exceeds synthesis → fibre shrinkage; reversible with reloading."}, {"id": "q23", "ch": 3, "t": "qa", "q": "Define inflammation.", "a": "The connective tissue response to injury: a reaction of blood vessels with accumulation of fluid and leukocytes. Protective but can be harmful."}, {"id": "q24", "ch": 3, "t": "qa", "q": "The five cardinal signs with the mechanism of each.", "a": "Rubor — vasodilation; calor — increased blood flow; tumor — exudate from ↑ permeability; dolor — prostaglandins, bradykinin, pressure; functio laesa — combined effect."}, {"id": "q25", "ch": 3, "t": "qa", "q": "Exudate vs transudate.", "a": "Exudate: high protein, requires altered vessel permeability, inflammatory. Transudate: low protein ultrafiltrate from hydrostatic/osmotic imbalance with normal permeability (heart failure)."}, {"id": "q26", "ch": 3, "t": "qa", "q": "What is pus?", "a": "A purulent exudate rich in neutrophils and cellular debris with dead and living bacteria."}, {"id": "q27", "ch": 3, "t": "qa", "q": "Which cell dominates acute inflammation, and chronic?", "a": "Neutrophils in acute; macrophages, lymphocytes and plasma cells in chronic."}, {"id": "q28", "ch": 3, "t": "qa", "q": "The three tissue events of acute inflammation.", "a": "Changes in vascular flow and calibre; increased vascular permeability; leukocyte emigration."}, {"id": "q29", "ch": 3, "t": "qa", "q": "Sequence of vascular flow changes.", "a": "Transient arteriolar vasoconstriction → vasodilation → stasis (slowing) — stasis lets leukocytes marginate."}, {"id": "q30", "ch": 3, "t": "qa", "q": "Five mechanisms of increased permeability, and the commonest.", "a": "Endothelial gaps (commonest; immediate transient), cytoskeletal reorganisation, direct endothelial injury (immediate sustained), leukocyte-dependent injury, leakage from new vessels."}, {"id": "q31", "ch": 3, "t": "qa", "q": "Where does most inflammatory leakage occur?", "a": "Post-capillary venules (endothelial contraction produces intercellular gaps)."}, {"id": "q32", "ch": 3, "t": "qa", "q": "Leukocyte emigration — the steps.", "a": "Margination → adhesion (selectins, then integrins–ICAM/VCAM) → diapedesis → chemotaxis → phagocytosis. M-A-D-C-P."}, {"id": "q33", "ch": 3, "t": "qa", "q": "Two ways phagocytosis damages the host.", "a": "Regurgitation during feeding (vacuole not closed) and frustrated phagocytosis (non-digestible material) — enzymes released into tissue."}, {"id": "q34", "ch": 3, "t": "qa", "q": "Mediators of vasodilation / permeability / chemotaxis / pain / fever.", "a": "Vasodilation: prostaglandins, histamine, NO. Permeability: histamine, bradykinin, leukotrienes. Chemotaxis: C5a, LTB4, chemokines. Pain: prostaglandins, bradykinin. Fever: prostaglandins."}, {"id": "q35", "ch": 3, "t": "qa", "q": "Why are NSAIDs anti-inflammatory, antipyretic and analgesic at once?", "a": "Prostaglandins mediate vasodilation, fever and pain; NSAIDs inhibit cyclo-oxygenase."}, {"id": "q36", "ch": 3, "t": "qa", "q": "The four outcomes of acute inflammation.", "a": "Resolution; suppuration (abscess); organisation/repair with scar; progression to chronic inflammation."}, {"id": "q37", "ch": 3, "t": "qa", "q": "What does resolution require, and why is it rare?", "a": "A minor injury and labile cells with an intact stromal framework — most injuries fail one of these."}, {"id": "q38", "ch": 3, "t": "qa", "q": "Why is an abscess poorly treated by antibiotics alone?", "a": "Walled off by granulation tissue with an avascular necrotic centre — cells and drugs cannot reach the pus. Incision and drainage."}, {"id": "q39", "ch": 3, "t": "qa", "q": "Regeneration vs repair.", "a": "Regeneration: replacement by parenchymal cell division, function restored. Repair: replacement by connective tissue/collagen (scar), function not fully restored."}, {"id": "q40", "ch": 3, "t": "qa", "q": "Laceration vs surgical incision — why do they heal differently?", "a": "Laceration: ragged, crushed, contaminated edges with tissue loss → second intention. Incision: clean, minimal loss, edges approximated → first intention."}, {"id": "q41", "ch": 4, "t": "qa", "q": "Define chronic inflammation.", "a": "A prolonged response (weeks–months) in which tissue damage continues while the body attempts to heal — destruction and repair run simultaneously."}, {"id": "q42", "ch": 4, "t": "qa", "q": "Why does chronic inflammation occur?", "a": "Persistent irritation: the agent cannot be removed or destroyed, resists digestion, survives in macrophages, or the immune response itself sustains it."}, {"id": "q43", "ch": 4, "t": "qa", "q": "Which antibody class dominates saliva?", "a": "IgA (secretory)."}, {"id": "q44", "ch": 4, "t": "qa", "q": "Match each Ig class to its role: IgA, IgD, IgE, IgG, IgM.", "a": "IgA mucosal/saliva; IgD B-cell receptor; IgE allergy/mast cells; IgG bulk immunity, memory, crosses placenta; IgM first antibody made."}, {"id": "q45", "ch": 4, "t": "qa", "q": "What does the heavy chain determine, and what does the Fc region do?", "a": "Heavy chain sets the class. Fc binds cell receptors: opsonisation, complement lysis, mast-cell degranulation."}, {"id": "q46", "ch": 4, "t": "qa", "q": "MHC I vs MHC II — where found, who reads it.", "a": "MHC I: all nucleated cells → CD8 cytotoxic T cells. MHC II: antigen-presenting cells → CD4 helper T cells."}, {"id": "q47", "ch": 4, "t": "qa", "q": "What do activated CD4+ T cells release, and why are they the 'master regulator'?", "a": "Cytokines (IL-2, IFN-γ, IL-4/5/13, IL-17) that direct every other immune cell."}, {"id": "q48", "ch": 4, "t": "qa", "q": "How does a CD8+ T cell kill?", "a": "Perforin and granzymes/granulysin form pores → lysis; or Fas-mediated apoptosis."}, {"id": "q49", "ch": 4, "t": "qa", "q": "What makes a cell a target for NK cells?", "a": "Loss of MHC class I — normal class I expression protects cells from NK killing."}, {"id": "q50", "ch": 4, "t": "qa", "q": "How do T and B cells differ in antigen recognition?", "a": "T cells need surface-presented antigen on MHC; B cells can be activated by soluble antigen."}, {"id": "q51", "ch": 4, "t": "qa", "q": "Four products of the activated macrophage and their effects.", "a": "ROS/NO (kill cells); proteases (destroy matrix); cytokines (recruit cells); growth factors (fibrosis, angiogenesis)."}, {"id": "q52", "ch": 4, "t": "qa", "q": "When do macrophages accumulate at an injury, and why does that matter?", "a": "About 48 hours — which is why acute inflammation lasts a maximum of ~2 days before becoming mononuclear."}, {"id": "q53", "ch": 4, "t": "qa", "q": "The lymphokine–monokine loop.", "a": "T-cell lymphokines (IFN-γ) activate macrophages; macrophage monokines (IL-1, IL-12, TNF) activate T cells — reciprocal, self-sustaining."}, {"id": "q54", "ch": 4, "t": "qa", "q": "Five causes of chronic inflammation with an example each.", "a": "Persistent infection (TB); prolonged toxin exposure (silica, oxidised LDL); autoimmunity (RA); sterile foreign body (suture); idiopathic (sarcoid, Crohn's)."}, {"id": "q55", "ch": 4, "t": "qa", "q": "Sinus vs fistula.", "a": "Sinus: tract from an abscess to one surface (allows drainage — painless). Fistula: tract joining two epithelial surfaces (oro-antral)."}, {"id": "q56", "ch": 4, "t": "qa", "q": "Define an ulcer.", "a": "Localised loss of epithelium with exposure of the underlying connective tissue."}, {"id": "q57", "ch": 4, "t": "qa", "q": "Define a granuloma. Two cell types within it.", "a": "Aggregate of macrophages transformed into epithelioid cells with a lymphocyte collar. Epithelioid cells (secretory, non-phagocytic) and giant cells (fused macrophages)."}, {"id": "q58", "ch": 4, "t": "qa", "q": "Langhans' vs foreign-body giant cell.", "a": "Langhans': nuclei in a horseshoe. Foreign-body: nuclei scattered."}, {"id": "q59", "ch": 4, "t": "qa", "q": "Granuloma vs granulation tissue.", "a": "Granuloma: destructive aggregate of chronic inflammatory cells. Granulation tissue: healing scaffold of new capillaries and fibroblasts."}, {"id": "q60", "ch": 4, "t": "qa", "q": "Why does gingivitis progress to periodontitis instead of resolving?", "a": "Plaque sits on a non-shedding surface outside the body; the immune system cannot remove it, so the stop condition is never met and host MMPs/RANKL destroy PDL and bone."}, {"id": "q61", "ch": 4, "t": "qa", "q": "Histological difference between gingivitis and periodontitis.", "a": "Gingivitis: neutrophil-dominated, confined to gingiva, junctional epithelium at CEJ, no attachment loss. Periodontitis: mononuclear infiltrate, apical migration of JE (pocket), PDL and bone loss."}, {"id": "q62", "ch": 4, "t": "qa", "q": "What is the rationale for vaccination in terms of specific vs non-specific immunity?", "a": "Install memory so the specific response destroys the organism before the destructive non-specific (inflammatory) response is needed."}, {"id": "q63", "ch": 5, "t": "qa", "q": "Healing vs repair in Underwood's terms.", "a": "Healing = regeneration: restoration by the same specialised cells, no residual defect. Repair = organisation: fibrovascular connective tissue → scar, specialised cells lost."}, {"id": "q64", "ch": 5, "t": "qa", "q": "Two requirements for regeneration.", "a": "Cells capable of division, and an intact stromal framework (and a surviving stem-cell niche)."}, {"id": "q65", "ch": 5, "t": "qa", "q": "Totipotent vs pluripotent.", "a": "Totipotent: all embryonic cells and the placenta. Pluripotent: all three germ layers but not extra-embryonic tissue."}, {"id": "q66", "ch": 5, "t": "qa", "q": "Where are the epidermal and intestinal stem-cell niches, and why there?", "a": "Basal layer and crypt base — furthest from the surface being worn away."}, {"id": "q67", "ch": 5, "t": "qa", "q": "What is contact inhibition and where is it lost?", "a": "Cells stop proliferating when they contact each other; halts regeneration at the right moment. Lost in neoplasia."}, {"id": "q68", "ch": 5, "t": "qa", "q": "Five steps of organisation.", "a": "Fibrin deposition → granulation tissue → removal of dead tissue → contraction → collagen accumulation (scar)."}, {"id": "q69", "ch": 5, "t": "qa", "q": "Which cell mediates wound contraction?", "a": "Myofibroblasts in granulation tissue."}, {"id": "q70", "ch": 5, "t": "qa", "q": "Two harmful consequences of excess contraction.", "a": "Stenosis (stricture of a lumen) and contracture (permanent shortening limiting movement)."}, {"id": "q71", "ch": 5, "t": "qa", "q": "First vs second intention — what actually differs?", "a": "Amount of tissue lost, hence amount of granulation tissue: second intention = gaping edges, abundant granulation tissue, marked contraction, larger scar, higher infection risk. Mechanism is the same."}, {"id": "q72", "ch": 5, "t": "qa", "q": "How quickly does epithelium bridge a sutured incision?", "a": "24–48 hours."}, {"id": "q73", "ch": 5, "t": "qa", "q": "EGF, PDGF, VEGF, TGF-β — main job of each.", "a": "EGF: epithelial regeneration. PDGF: fibroblast/smooth-muscle chemotaxis and proliferation. VEGF: angiogenesis. TGF-β: collagen synthesis, myofibroblasts, fibrosis."}, {"id": "q74", "ch": 5, "t": "qa", "q": "Hypertrophic scar vs keloid.", "a": "Hypertrophic stays within the wound and often regresses; keloid extends beyond it and recurs after excision."}, {"id": "q75", "ch": 5, "t": "qa", "q": "Bone healing sequence.", "a": "Haematoma → granulation tissue → woven-bone callus (fast, weak) → lamellar bone → remodelling."}, {"id": "q76", "ch": 5, "t": "qa", "q": "Why is woven bone made first?", "a": "It can be produced quickly to give provisional stability; lamellar bone is stronger but slow."}, {"id": "q77", "ch": 5, "t": "qa", "q": "Consequence of mobility at a fracture.", "a": "Fibrous union — a false joint (pseudarthrosis)."}, {"id": "q78", "ch": 5, "t": "qa", "q": "How does the CNS respond to injury?", "a": "Gliosis — glial proliferation fills the defect; neurons do not regenerate; function not restored."}, {"id": "q79", "ch": 5, "t": "qa", "q": "Peripheral nerve regeneration — condition and rate.", "a": "Axon regrows along an intact sheath at ~1 mm/day; severed sheath → disordered regrowth, neuroma."}, {"id": "q80", "ch": 5, "t": "qa", "q": "Socket healing timeline: 4 h, 2 d, 8 d, 18 d, 6 wk.", "a": "4 h clot retraction; 2 d fibrinolysis starts (dry-socket risk); 8 d granulation tissue fills socket; 18 d woven bone; 6 wk lamellar remodelling."}, {"id": "q81", "ch": 5, "t": "qa", "q": "Why is dry-socket risk highest around day 2?", "a": "Fibrinolysis has begun but the clot is not yet anchored to the socket wall."}, {"id": "q82", "ch": 5, "t": "qa", "q": "Two separate mechanisms by which steroids impair healing.", "a": "Immunosuppression (worse infection) and direct interference with granulation-tissue formation and hence contraction."}, {"id": "q83", "ch": 5, "t": "qa", "q": "Why does diabetes impair healing?", "a": "Several at once: infection, immune suppression, neutrophil dysfunction, ischaemia (micro/macroangiopathy), neuropathy."}, {"id": "q84", "ch": 5, "t": "qa", "q": "Local factors that impair healing.", "a": "Infection, foreign body, mobility, size/depth of defect, poor apposition, radiation, poor blood supply."}, {"id": "q85", "ch": 6, "t": "qa", "q": "Define hypersensitivity.", "a": "Incidental tissue injury resulting from an immune response intended to destroy foreign antigen."}, {"id": "q86", "ch": 6, "t": "qa", "q": "Three sources of antigen in hypersensitivity, with examples.", "a": "Autoimmunity (SLE); microbes — excessive, persistent, or cross-reacting (rheumatic fever); environmental antigens in atopic people."}, {"id": "q87", "ch": 6, "t": "qa", "q": "The four types in one line each.", "a": "I: IgE–mast cell, minutes. II: IgG/IgM against cell-bound antigen. III: immune complexes of soluble antigen. IV: T-cell mediated, 2–3 days."}, {"id": "q88", "ch": 6, "t": "qa", "q": "Why is type IV the only delayed type?", "a": "It is cell-mediated — T cells must migrate to the site, taking days; antibody in I–III already circulates."}, {"id": "q89", "ch": 6, "t": "qa", "q": "What separates type II from type III?", "a": "Where the antigen is: fixed to a cell (damage local) vs soluble (complexes travel and lodge → multi-system)."}, {"id": "q90", "ch": 6, "t": "qa", "q": "Th2 cytokines in type I and their roles.", "a": "IL-4 (and IL-13) → IgE class switch; IL-5 → eosinophils; IL-13 → mucus."}, {"id": "q91", "ch": 6, "t": "qa", "q": "What actually triggers mast-cell degranulation?", "a": "Cross-linking of adjacent IgE molecules on FcεRI by multivalent antigen — a single binding does nothing."}, {"id": "q92", "ch": 6, "t": "qa", "q": "Immediate vs late phase of type I.", "a": "Immediate (minutes): preformed histamine, proteases, chemokines. Late (2–24 h): newly synthesised leukotrienes, PGD₂, PAF, cytokines → eosinophil/neutrophil infiltrate and tissue damage."}, {"id": "q93", "ch": 6, "t": "qa", "q": "Why do antihistamines fail in severe asthma?", "a": "Leukotrienes and PGD₂ act later, are thousands of times more potent than histamine, and are not blocked by H1 antagonists."}, {"id": "q94", "ch": 6, "t": "qa", "q": "Anaphylaxis first-line management.", "a": "IM adrenaline 300 µg (150 µg under 5 years) into lateral thigh; repeat every 5 min; call ambulance; lie flat with legs raised; oxygen."}, {"id": "q95", "ch": 6, "t": "qa", "q": "Three ways adrenaline reverses anaphylaxis.", "a": "α₁ vasoconstriction (hypotension), β₂ bronchodilation (bronchospasm), β₂ mast-cell stabilisation."}, {"id": "q96", "ch": 6, "t": "qa", "q": "Anaphylactoid reaction — how does it differ?", "a": "Same mediators without IgE (direct mast-cell activation); can occur on first exposure; treated identically."}, {"id": "q97", "ch": 6, "t": "qa", "q": "Chlorhexidine — which hypersensitivity types?", "a": "Type I (anaphylaxis, e.g. after socket irrigation) and type IV (oral contact allergy)."}, {"id": "q98", "ch": 6, "t": "qa", "q": "Three type II mechanisms.", "a": "Complement-mediated lysis/inflammation; opsonisation and phagocytosis (± ADCC); receptor interference — blocking or stimulating."}, {"id": "q99", "ch": 6, "t": "qa", "q": "Myasthenia gravis vs Graves disease as type II.", "a": "Myasthenia: anti-AChR blocks the receptor → weakness. Graves: anti-TSHR stimulates → thyrotoxicosis (sometimes 'type V')."}, {"id": "q100", "ch": 6, "t": "qa", "q": "Drug-induced type II — mechanism.", "a": "Drug bound to red cells or platelets forms a neoepitope; antibody against the drug destroys the cell it is stuck to (bystander lysis)."}, {"id": "q101", "ch": 6, "t": "qa", "q": "Where do immune complexes deposit and why?", "a": "Vessels, glomeruli, joints — wherever flow slows or filters; complement → C5a → neutrophils → damage."}, {"id": "q102", "ch": 6, "t": "qa", "q": "Post-streptococcal glomerulonephritis: mechanism and timing.", "a": "Type III; complexes of streptococcal antigen and antibody deposit in the GBM ~10–12 days after infection; one-shot, usually resolves."}, {"id": "q103", "ch": 6, "t": "qa", "q": "SLE diagnosis — criteria and specific antibodies.", "a": "4 of 11 ACR criteria (≥1 clinical, ≥1 immunological). ANA sensitive not specific; anti-dsDNA and anti-Sm specific."}, {"id": "q104", "ch": 6, "t": "qa", "q": "Describe the malar rash.", "a": "Butterfly erythema over cheeks and nose bridge that spares the nasolabial folds; photosensitive."}, {"id": "q105", "ch": 6, "t": "qa", "q": "Type IV mechanism, cells and timing.", "a": "Sensitised Th1 cells re-exposed → IFN-γ, TNF → macrophage activation (CD8 direct killing) → oedema, necrosis, granuloma if persistent; 2–3 days, peak 48–72 h."}, {"id": "q106", "ch": 6, "t": "qa", "q": "What is a hapten and why does it matter in contact dermatitis?", "a": "A small reactive chemical (nickel, urushiol) that becomes immunogenic only when bound to a skin protein."}, {"id": "q107", "ch": 6, "t": "qa", "q": "Skin-prick test vs patch test.", "a": "Skin-prick: read in minutes, weal and flare, type I. Patch: 48 h occlusion, read day 2 and 4, induration, type IV."}, {"id": "q108", "ch": 6, "t": "qa", "q": "Commonest presentation of toothpaste contact allergy, and how to confirm.", "a": "Cheilitis (dry, cracked lips) often without intra-oral signs; confirm by stop–restart since the allergen is usually 'unspecified flavouring' (cinnamon)."}, {"id": "q109", "ch": 7, "t": "qa", "q": "Autoimmunity vs autoimmune disease.", "a": "Autoimmunity: an immune response against self antigen. Autoimmune disease: tissue damage or dysfunction resulting from it."}, {"id": "q110", "ch": 7, "t": "qa", "q": "How can autoimmunity exist without disease?", "a": "Self-reactive clones escape central deletion in everyone and are held by peripheral tolerance; low-titre autoantibodies are common and harmless. Disease needs susceptibility plus a trigger."}, {"id": "q111", "ch": 7, "t": "qa", "q": "Organ-specific vs non-organ-specific — why is SLE multi-system?", "a": "Its autoantigens (nuclear material) are in every nucleated cell, so the target is everywhere."}, {"id": "q112", "ch": 7, "t": "qa", "q": "Strongest genetic association in autoimmunity, with two examples.", "a": "MHC/HLA alleles: HLA-B27 ankylosing spondylitis; DR3/DR4 type 1 diabetes; DR4 RA."}, {"id": "q113", "ch": 7, "t": "qa", "q": "Which single-gene defects cause autoimmunity and why?", "a": "Apoptosis/tolerance genes — Fas/FasL (ALPS), AIRE (APECED), FOXP3 (IPEX): self-reactive lymphocytes are not deleted or regulated."}, {"id": "q114", "ch": 7, "t": "qa", "q": "Four environmental triggers of autoimmunity.", "a": "Hormones (oestrogen), infection (molecular mimicry, bystander activation), drugs (procainamide, hydralazine), UV light (keratinocyte apoptosis exposes nuclear antigens)."}, {"id": "q115", "ch": 7, "t": "qa", "q": "Define molecular mimicry with an example.", "a": "Microbial antigen resembles a self antigen so the response cross-reacts — streptococcal M protein → rheumatic fever."}, {"id": "q116", "ch": 7, "t": "qa", "q": "Sjögren syndrome: mechanism, antibodies, dental consequences.", "a": "CD4 T cells vs exocrine ductal epithelium; anti-SS-A (Ro), anti-SS-B (La). Xerostomia → cervical caries, candidosis, angular cheilitis; ↑ lymphoma risk."}, {"id": "q117", "ch": 7, "t": "qa", "q": "Which hypersensitivity types cause autoimmune damage?", "a": "II (antibody to cell-bound antigen — Graves, myasthenia), III (complexes — SLE), IV (T cells — type 1 diabetes, Sjögren); often combined."}, {"id": "q118", "ch": 7, "t": "qa", "q": "Autograft, allograft, xenograft.", "a": "Self to self; between individuals of the same species; across species."}, {"id": "q119", "ch": 7, "t": "qa", "q": "HLA class I and II genes.", "a": "Class I: HLA-A, -B, -C. Class II: HLA-DP, -DQ, -DR. (Class III = complement C2, C4.)"}, {"id": "q120", "ch": 7, "t": "qa", "q": "Hyperacute rejection — timing, mechanism, prevention.", "a": "Minutes–hours; preformed antibody to donor MHC/ABO → complement, thrombosis; prevented by ABO matching and cross-match."}, {"id": "q121", "ch": 7, "t": "qa", "q": "Acute rejection — timing, mechanism, treatment.", "a": "Days–weeks; T-cell (type IV) ± antibody, endothelialitis; reversible with immunosuppression."}, {"id": "q122", "ch": 7, "t": "qa", "q": "Chronic rejection — timing, features, response to treatment.", "a": "Months–years; intimal fibrosis, vascular obliteration, interstitial fibrosis; slowly progressive and not responsive to immunosuppression."}, {"id": "q123", "ch": 7, "t": "qa", "q": "What does rejection attack, and why does that matter?", "a": "The graft endothelium → ischaemia and infarction — common to all three patterns."}, {"id": "q124", "ch": 7, "t": "qa", "q": "Two main complications of immunosuppression.", "a": "Infection (CMV, Candida, Cryptococcus, Pneumocystis) and malignancy (Kaposi's sarcoma, lymphoma — virally driven)."}, {"id": "q125", "ch": 7, "t": "qa", "q": "What is GvHD and its oral triad?", "a": "Transplanted immunocompetent cells attack the host (direction of rejection reversed). Oral: lichenoid lesions, salivary hypofunction, sclerosis with limited opening."}, {"id": "q126", "ch": 8, "t": "qa", "q": "Define immunodeficiency and its four presenting features.", "a": "Defects in immune system function; infections that are severe, persistent, unusual and recurrent."}, {"id": "q127", "ch": 8, "t": "qa", "q": "Primary vs secondary immunodeficiency with examples.", "a": "Primary: intrinsic, usually genetic, childhood (XLA, IgA deficiency, DiGeorge, SCID, CGD). Secondary: due to another condition (HIV, drugs/steroids, malignancy, diabetes, malnutrition)."}, {"id": "q128", "ch": 8, "t": "qa", "q": "Four arms of primary immunodeficiency and the organisms each favours.", "a": "Antibody → encapsulated bacteria; T cell → viruses, fungi, intracellular; phagocyte → staph, Gram-negatives, fungi; complement → encapsulated bacteria, Neisseria."}, {"id": "q129", "ch": 8, "t": "qa", "q": "Why do neutropenic patients show few signs of infection?", "a": "The clinical features of infection are the neutrophil response — no pus, little redness or swelling despite severe infection."}, {"id": "q130", "ch": 8, "t": "qa", "q": "Chronic granulomatous disease — defect and consequence.", "a": "Non-functional NADPH oxidase → no respiratory burst → organisms engulfed but not killed → non-caseating granulomas; staph and fungal infections."}, {"id": "q131", "ch": 8, "t": "qa", "q": "HIV transmission routes; the commonest.", "a": "Sexual intercourse (commonest); needle sharing; infected blood/products/organs; occupational needlestick; vertical (perinatal, breastfeeding)."}, {"id": "q132", "ch": 8, "t": "qa", "q": "Needlestick seroconversion risk for HIV, HCV, HBV.", "a": "~0.3%, ~3%, ~30%."}, {"id": "q133", "ch": 8, "t": "qa", "q": "Post-exposure prophylaxis timing.", "a": "Within 72 hours, for 28 days."}, {"id": "q134", "ch": 8, "t": "qa", "q": "HIV entry — receptor and co-receptors.", "a": "gp120 binds CD4; co-receptor CCR5 (early, macrophage-tropic) or CXCR4 (late, T-tropic); gp41 fusion."}, {"id": "q135", "ch": 8, "t": "qa", "q": "HIV life-cycle steps that drugs target.", "a": "Entry (CCR5), fusion (gp41), reverse transcription, integration, protease/assembly."}, {"id": "q136", "ch": 8, "t": "qa", "q": "Why does HIV need combination therapy?", "a": "Up to 10⁸ mutants/day make resistance to any single agent almost immediate; several simultaneous mutations are needed to escape a combination."}, {"id": "q137", "ch": 8, "t": "qa", "q": "Why is losing CD4 cells so devastating?", "a": "The helper T cell coordinates every arm — B cells, macrophages, CD8 cells — so all fail together."}, {"id": "q138", "ch": 8, "t": "qa", "q": "The four stages of HIV in the lecture.", "a": "1 acute seroconversion illness; 2 asymptomatic; 3 persistent generalised lymphadenopathy; 4 AIDS."}, {"id": "q139", "ch": 8, "t": "qa", "q": "Define persistent generalised lymphadenopathy.", "a": "Enlarged nodes at ≥2 extra-inguinal sites for ≥3 months."}, {"id": "q140", "ch": 8, "t": "qa", "q": "Why can a patient be antibody-negative yet highly infectious?", "a": "Seroconversion illness and peak viraemia precede antibody production — the window period."}, {"id": "q141", "ch": 8, "t": "qa", "q": "Two virally driven tumours of AIDS and their viruses.", "a": "Kaposi's sarcoma — HHV-8; non-Hodgkin lymphoma — EBV."}, {"id": "q142", "ch": 8, "t": "qa", "q": "The four oral lesions strongly associated with HIV.", "a": "Erythematous candidosis, oral hairy leukoplakia, herpes simplex, necrotising ulcerative periodontitis."}, {"id": "q143", "ch": 8, "t": "qa", "q": "Oral hairy leukoplakia — cause, appearance, one key distinction.", "a": "EBV; white corrugated bilateral lateral tongue; does not rub off (unlike pseudomembranous candidosis)."}, {"id": "q144", "ch": 8, "t": "qa", "q": "Candidiasis + weight loss + lymphadenopathy — diagnosis and stage?", "a": "HIV infection progressing to AIDS-related complex (stage 3 → 4)."}, {"id": "q145", "ch": 9, "t": "qa", "q": "Define a neoplasm.", "a": "A lesion resulting from the autonomous abnormal growth of cells that persists in the absence of the initiating stimulus."}, {"id": "q146", "ch": 9, "t": "qa", "q": "Why is 'tumour' a loose term?", "a": "It means any swelling — an abscess or haematoma qualifies. Every neoplasm is a tumour, not every tumour a neoplasm."}, {"id": "q147", "ch": 9, "t": "qa", "q": "The only absolute discriminators of malignancy.", "a": "Invasion and metastasis. Everything else is a tendency with exceptions."}, {"id": "q148", "ch": 9, "t": "qa", "q": "Three microscopic features of malignancy.", "a": "Frequent/atypical mitoses; anaplasia (poor differentiation); nuclear pleomorphism, hyperchromatism, high N:C ratio, prominent nucleoli."}, {"id": "q149", "ch": 9, "t": "qa", "q": "Three macroscopic features distinguishing benign from malignant.", "a": "Border (circumscribed/encapsulated vs infiltrative); surface growth (exophytic vs endophytic, ulcerated, indurated); necrosis/haemorrhage (rare vs common)."}, {"id": "q150", "ch": 9, "t": "qa", "q": "Carcinoma vs sarcoma.", "a": "Carcinoma: malignant epithelial. Sarcoma: malignant mesenchymal/connective tissue."}, {"id": "q151", "ch": 9, "t": "qa", "q": "Benign and malignant names for glandular epithelium, fat, cartilage, bone.", "a": "Adenoma/adenocarcinoma; lipoma/liposarcoma; chondroma/chondrosarcoma; osteoma/osteosarcoma."}, {"id": "q152", "ch": 9, "t": "qa", "q": "Four '-oma' names that are malignant.", "a": "Lymphoma, melanoma, mesothelioma, seminoma."}, {"id": "q153", "ch": 9, "t": "qa", "q": "Define differentiation and anaplasia.", "a": "Differentiation: how closely the neoplasm resembles its cells of origin. Anaplasia: lack of differentiation — a reliable indicator of malignancy."}, {"id": "q154", "ch": 9, "t": "qa", "q": "Two most characteristic architectural features of oral epithelial dysplasia.", "a": "Drop-shaped rete ridges and abnormally superficial mitotic figures."}, {"id": "q155", "ch": 9, "t": "qa", "q": "Five ways a benign neoplasm harms.", "a": "Pressure, obstruction, hormone production, transformation to malignancy, anxiety."}, {"id": "q156", "ch": 9, "t": "qa", "q": "What extra effects does a malignant neoplasm add?", "a": "Destruction of adjacent tissue, metastasis, bleeding from ulcerated surfaces, paraneoplastic effects, pain."}, {"id": "q157", "ch": 9, "t": "qa", "q": "Define cachexia.", "a": "Progressive loss of fat and lean mass with weakness, anorexia and anaemia — cytokine-driven."}, {"id": "q158", "ch": 9, "t": "qa", "q": "Define a paraneoplastic syndrome and name the three commonest.", "a": "Symptom complex not explained by spread or by hormones native to the tissue of origin. Hypercalcaemia, Cushing syndrome, non-bacterial thrombotic endocarditis."}, {"id": "q159", "ch": 9, "t": "qa", "q": "Why do paraneoplastic syndromes matter clinically?", "a": "May be the first sign of an occult tumour, may be lethal themselves, may mimic metastatic disease and confound treatment."}, {"id": "q160", "ch": 9, "t": "qa", "q": "Five classes of carcinogen.", "a": "Chemicals, viruses, ionising and non-ionising radiation, exogenous hormones, microbial agents."}, {"id": "q161", "ch": 10, "t": "qa", "q": "Define neoplastic transformation (tumourigenesis) and malignant transformation.", "a": "Tumourigenesis: acquisition of genetic and epigenetic alterations that make a cell's growth autonomous. Malignant transformation: further acquisition of invasion and metastasis."}, {"id": "q162", "ch": 10, "t": "qa", "q": "Initiation, promotion, progression — one line each.", "a": "Initiation: carcinogen induces the mutation. Promotion: stimulation of clonal proliferation of the initiated cell. Progression: process culminating in malignant behaviour."}, {"id": "q163", "ch": 10, "t": "qa", "q": "What does 'clonal' mean and why does it matter?", "a": "Tumour originates from a single transformed cell; all cells inherit the founder's alterations → molecular markers and targeted therapy possible."}, {"id": "q164", "ch": 10, "t": "qa", "q": "Three genetic routes to a transformed cell.", "a": "Oncogene activation; loss of both copies of a tumour suppressor; telomerase expression."}, {"id": "q165", "ch": 10, "t": "qa", "q": "Why two hits for a tumour suppressor but one for an oncogene?", "a": "Suppressor is a brake — one working allele suffices (recessive). Oncogene is an accelerator — one stuck-on allele dominates."}, {"id": "q166", "ch": 10, "t": "qa", "q": "The double-hit model.", "a": "First hit: acquired or inherited loss of one allele; the wild-type allele still suppresses. Second hit: loss of the normal allele → no suppression."}, {"id": "q167", "ch": 10, "t": "qa", "q": "Why do inherited cancer syndromes present early and multifocally?", "a": "The first hit is already in every cell; only one further event in any single cell is needed."}, {"id": "q168", "ch": 10, "t": "qa", "q": "Caretaker vs gatekeeper genes.", "a": "Caretakers repair DNA damage (mismatch repair, BRCA). Gatekeepers arrest or kill cells with damaged DNA (RB, p53)."}, {"id": "q169", "ch": 10, "t": "qa", "q": "p53 — location, normal function, frequency in cancer.", "a": "Short arm of chromosome 17; G1 arrest and repair, or apoptosis if damage is extensive; defective in >70% of cancers."}, {"id": "q170", "ch": 10, "t": "qa", "q": "Three ways p53 function is lost.", "a": "Mutation (nonsense/missense); dominant-negative complexes of mutant and normal protein (one hit suffices — exception to two-hit); binding by viral proteins (HPV E6)."}, {"id": "q171", "ch": 10, "t": "qa", "q": "Chromosomal vs microsatellite instability with an inherited example each.", "a": "Chromosomal: breaks — Fanconi anaemia. Microsatellite: defective mismatch repair — HNPCC (proximal colon)."}, {"id": "q172", "ch": 10, "t": "qa", "q": "Two routes to oncogene activation.", "a": "An altered, excessively active oncoprotein (RAS mutation) or excessive production of a normal oncoprotein (MYC/HER2 amplification, translocation)."}, {"id": "q173", "ch": 10, "t": "qa", "q": "Oncogene classes along the signalling pathway with an example each.", "a": "Growth factor (sis/PDGF); receptor (erbB/EGFR); membrane kinase (src); transducer (ras); transcription factor (myc)."}, {"id": "q174", "ch": 10, "t": "qa", "q": "Three epigenetic mechanisms in cancer.", "a": "Promoter hypermethylation (silences suppressors); histone modification; microRNA dysregulation."}, {"id": "q175", "ch": 10, "t": "qa", "q": "Why is promoter methylation 'as good as deletion', and how does it differ?", "a": "The gene is intact but unread — same loss of protection; but sequencing misses it and it is reversible (drug target)."}, {"id": "q176", "ch": 10, "t": "qa", "q": "List the eight hallmarks of cancer.", "a": "Self-sufficiency in growth signals; insensitivity to growth inhibitors; altered metabolism; evasion of cell death; unlimited replication; sustained angiogenesis; invasion and metastasis; evasion of immune surveillance."}, {"id": "q177", "ch": 10, "t": "qa", "q": "The two enabling characteristics.", "a": "Genomic instability and tumour-promoting inflammation."}, {"id": "q178", "ch": 10, "t": "qa", "q": "What does RB do and how do growth inhibitors act through it?", "a": "Gates G1/S by binding E2F; TGF-β, p16 and contact inhibition keep RB active; cyclin D–CDK4/6 phosphorylate it to release E2F."}, {"id": "q179", "ch": 10, "t": "qa", "q": "Loss of RB1 — which two hallmarks and why?", "a": "Self-sufficiency in growth signals (E2F free, S phase without mitogens) and insensitivity to growth inhibitors (TGF-β, p16, contact inhibition all act through RB)."}, {"id": "q180", "ch": 10, "t": "qa", "q": "The Warburg effect and why a cancer cell 'chooses' it.", "a": "Aerobic glycolysis to lactate despite oxygen — supplies carbon intermediates for building cellular components, not just ATP."}, {"id": "q181", "ch": 10, "t": "qa", "q": "Why can't a tumour exceed 1–2 mm without angiogenesis?", "a": "Beyond that, diffusion cannot supply oxygen and nutrients to the centre; VEGF-driven vessel recruitment is required."}, {"id": "q182", "ch": 10, "t": "qa", "q": "Two factors that determine where metastases appear.", "a": "Anatomy/vascular drainage of the primary, and tropism of the tumour for particular tissues."}, {"id": "q183", "ch": 10, "t": "qa", "q": "How does PD-L1 help a tumour, and how is that exploited?", "a": "PD-L1 on tumour cells switches off T cells (checkpoint); blocking antibodies release the brake on anti-tumour immunity."}, {"id": "q184", "ch": 10, "t": "qa", "q": "How does HPV cause cancer without mutating host genes?", "a": "Viral DNA integrates; E6 inactivates p53, E7 inactivates pRb — both gatekeepers disabled by protein binding."}, {"id": "q185", "ch": 10, "t": "qa", "q": "Acute vs slow transforming retroviruses.", "a": "Acute: carries a cellular oncogene picked up from a prior host. Slow: inserts its promoter next to a cellular oncogene and over-expresses it."}, {"id": "q186", "ch": 10, "t": "qa", "q": "Why is chronic inflammation a cancer risk, mechanistically?", "a": "Inflammatory cells supply growth factors, remove growth suppressors, resist cell death, drive angiogenesis, invasion and immune evasion — six of the eight hallmarks."}, {"id": "m0", "ch": 1, "t": "mcq", "q": "Disease is best defined as:", "o": ["Any condition treated by a doctor", "Abnormal structure and/or function of cells, tissues, organs or systems", "Presence of a pathogen", "A symptom reported by a patient"], "k": 1, "w": "Disease = disturbed homeostasis producing abnormal structure and/or function."}, {"id": "m1", "ch": 1, "t": "mcq", "q": "Pathology is:", "o": ["The study of drugs", "The scientific study of disease", "The study of anatomy", "The study of microbes"], "k": 1, "w": "Pathology explains what disease is, why it occurs and how it affects the body."}, {"id": "m2", "ch": 1, "t": "mcq", "q": "Homeostasis refers to:", "o": ["The body's ability to maintain a stable internal environment", "Cell death", "Tissue overgrowth", "Immune response"], "k": 0, "w": "Disease begins when the homeostatic range is exceeded and not restored."}, {"id": "m3", "ch": 1, "t": "mcq", "q": "Pain and fatigue are examples of:", "o": ["Signs", "Symptoms", "Aetiological factors", "Morphologic changes"], "k": 1, "w": "Symptoms are subjective and reported by the patient; signs are observed."}, {"id": "m4", "ch": 1, "t": "mcq", "q": "Which is an objective finding?", "o": ["Nausea", "Fatigue", "Swelling seen on examination", "Feeling unwell"], "k": 2, "w": "A sign is something the clinician can observe or measure."}, {"id": "m5", "ch": 1, "t": "mcq", "q": "The three core questions of pathology are:", "o": ["Diagnosis, treatment, prognosis", "Aetiology, pathogenesis, morphologic/functional change", "Symptoms, signs, tests", "Genetic, environmental, multifactorial"], "k": 1, "w": "Cause → mechanism → resulting change."}, {"id": "m6", "ch": 2, "t": "mcq", "q": "Which is NOT a cellular adaptation?", "o": ["Hypertrophy", "Hyperplasia", "Apoptosis", "Metaplasia"], "k": 2, "w": "Apoptosis is programmed cell death, not an adaptation."}, {"id": "m7", "ch": 2, "t": "mcq", "q": "Atrophy is:", "o": ["Increase in cell size", "Increase in cell number", "Decrease in cell size and/or number", "Change in cell type"], "k": 2, "w": "Atrophy may be physiologic (development, ageing) or pathologic (disuse, denervation, ischaemia, pressure, malnutrition, loss of stimulation)."}, {"id": "m8", "ch": 2, "t": "mcq", "q": "Cells that divide throughout life are:", "o": ["Permanent", "Stable", "Labile", "Quiescent"], "k": 2, "w": "Labile cells: oral mucosa, skin, gut, marrow."}, {"id": "m9", "ch": 2, "t": "mcq", "q": "Ischaemia primarily affects:", "o": ["Membranes only", "Metabolic pathways only", "DNA only", "Cell and organelle membranes and metabolic pathways"], "k": 3, "w": "ATP loss → pump failure and membrane damage; both targets are hit."}, {"id": "m10", "ch": 3, "t": "mcq", "q": "The suffix -itis denotes:", "o": ["Infection", "Neoplasm", "Inflammation", "Necrosis"], "k": 2, "w": "Pulpitis, gingivitis, pericarditis."}, {"id": "m11", "ch": 3, "t": "mcq", "q": "Which is NOT a cardinal sign of inflammation?", "o": ["Rubor", "Calor", "Dolor", "Numbness"], "k": 3, "w": "The five: rubor, calor, tumor, dolor, functio laesa."}, {"id": "m12", "ch": 3, "t": "mcq", "q": "An exudate rich in leukocytes and cellular debris is:", "o": ["Transudate", "Pus", "Serous fluid", "Lymph"], "k": 1, "w": "Pus = purulent exudate, mainly neutrophils."}, {"id": "m13", "ch": 3, "t": "mcq", "q": "Immediate transient increase in permeability is caused by:", "o": ["Direct endothelial injury", "Leukocyte-dependent injury", "New vessel leakage", "Endothelial gaps"], "k": 3, "w": "Histamine-induced endothelial contraction in post-capillary venules; direct injury gives the immediate sustained response."}, {"id": "m14", "ch": 4, "t": "mcq", "q": "Chronic inflammation is characterised by:", "o": ["Rapid onset", "Neutrophil predominance", "Prolonged duration and tissue damage", "Complete resolution"], "k": 2, "w": "Weeks to months; destruction and healing run simultaneously."}, {"id": "m15", "ch": 4, "t": "mcq", "q": "Which is NOT a characteristic cell of chronic inflammation?", "o": ["Macrophages", "Lymphocytes", "Plasma cells", "Neutrophils"], "k": 3, "w": "Neutrophils belong to acute inflammation (or an acute exacerbation)."}, {"id": "m16", "ch": 4, "t": "mcq", "q": "The key mediator released by activated CD4+ T cells is:", "o": ["Perforin", "Antibody", "Cytokines", "Histamine"], "k": 2, "w": "Cytokines direct macrophages, B cells and other T cells; perforin is CD8."}, {"id": "m17", "ch": 5, "t": "mcq", "q": "Cells with the highest regenerative capacity are:", "o": ["Permanent", "Stable", "Labile", "Stem-free"], "k": 2, "w": "Labile cells divide continuously."}, {"id": "m18", "ch": 5, "t": "mcq", "q": "First-intention healing is characterised by:", "o": ["Large tissue loss", "Abundant granulation tissue", "Close approximation of wound edges", "Marked contraction"], "k": 2, "w": "Surgical incision: minimal loss, apposed edges, fine scar."}, {"id": "m19", "ch": 5, "t": "mcq", "q": "The growth factor primarily responsible for epithelial regeneration is:", "o": ["PDGF", "TGF-β", "EGF", "VEGF"], "k": 2, "w": "EGF/KGF drive keratinocyte proliferation and migration."}, {"id": "m20", "ch": 5, "t": "mcq", "q": "Wound contraction is mediated by:", "o": ["Macrophages", "Endothelial cells", "Myofibroblasts", "Keratinocytes"], "k": 2, "w": "Contractile fibroblasts in granulation tissue draw the wound bed inward."}, {"id": "m21", "ch": 6, "t": "mcq", "q": "Hypersensitivity reactions are:", "o": ["Deficient immune responses", "Normal protective responses", "Immune responses that cause tissue damage", "Non-immune reactions"], "k": 2, "w": "Incidental injury from a response aimed at foreign antigen."}, {"id": "m22", "ch": 6, "t": "mcq", "q": "Type III hypersensitivity is caused by deposition of:", "o": ["IgE on mast cells", "Antibody on cell membranes", "Immune complexes in tissues", "Sensitised T cells"], "k": 2, "w": "Soluble antigen–antibody complexes lodge in vessels, glomeruli and joints."}, {"id": "m23", "ch": 7, "t": "mcq", "q": "Autoimmunity is:", "o": ["Absence of immune response", "An immune response against self-antigens", "Excess IgE production", "Transplant rejection"], "k": 1, "w": "Autoimmune disease is the damage that results from it."}, {"id": "m24", "ch": 7, "t": "mcq", "q": "Chronic transplant rejection is:", "o": ["Mediated by preformed antibody within hours", "Reversible with immunosuppression", "Slowly progressive and not responsive to immunosuppression", "Prevented by cross-matching"], "k": 2, "w": "Months to years; fibrosis and vascular obliteration."}, {"id": "m25", "ch": 8, "t": "mcq", "q": "Immune deficiency is characterised by:", "o": ["Excess immune response", "Defects in immune system function", "Autoantibody production", "Allergy"], "k": 1, "w": "Presents as severe, persistent, unusual, recurrent infection."}, {"id": "m26", "ch": 8, "t": "mcq", "q": "Primary immune deficiency is:", "o": ["Caused by HIV", "An intrinsic defect in the immune system", "Caused by steroids", "Acquired in adulthood only"], "k": 1, "w": "Usually genetic, presenting in childhood."}, {"id": "m27", "ch": 8, "t": "mcq", "q": "The most common mode of HIV transmission is:", "o": ["Needlestick", "Blood transfusion", "Sexual intercourse", "Breastfeeding"], "k": 2, "w": "Sexual transmission dominates worldwide."}, {"id": "m28", "ch": 9, "t": "mcq", "q": "A neoplasm is best defined as:", "o": ["An abnormal swelling", "A benign tumour only", "Inflammation in a tissue", "An abnormal growth of cells that persists in the absence of the initiating stimulus"], "k": 3, "w": "Autonomy is the defining property."}, {"id": "m29", "ch": 9, "t": "mcq", "q": "A benign neoplasm of glandular tissue is a:", "o": ["Sarcoma", "Carcinoma", "Adenoma", "Lymphoma"], "k": 2, "w": "Adenoma; malignant counterpart is adenocarcinoma."}, {"id": "m30", "ch": 9, "t": "mcq", "q": "Malignant neoplasms are characterised by:", "o": ["Slow growth and well-defined borders", "Frequent mitoses and anaplasia", "Encapsulation and lack of invasion", "Rare metastasis"], "k": 1, "w": "Plus invasion and metastasis as the absolute criteria."}, {"id": "m31", "ch": 9, "t": "mcq", "q": "Anaplasia refers to:", "o": ["Increased differentiation", "Decreased differentiation", "Normal morphology", "Benign growth"], "k": 1, "w": "Lack of differentiation — a reliable indicator of malignancy."}, {"id": "m32", "ch": 10, "t": "mcq", "q": "Tumourigenesis is primarily driven by:", "o": ["Inflammation alone", "Genetic and epigenetic alterations", "Infections alone", "Hormonal imbalances alone"], "k": 1, "w": "Sequence changes plus changes in expression, accumulating in one clone."}, {"id": "m33", "ch": 10, "t": "mcq", "q": "In multistep carcinogenesis, initiation involves:", "o": ["Stimulation of clonal proliferation", "Development of metastasis", "Induction of genetic alterations by a carcinogen", "Formation of a benign tumour"], "k": 2, "w": "Promotion is the proliferation; progression is malignant behaviour."}, {"id": "m34", "ch": 10, "t": "mcq", "q": "The double-hit model is most relevant to:", "o": ["Oncogene activation", "Telomerase expression", "Tumour suppressor gene inactivation", "Epigenetic changes"], "k": 2, "w": "Both alleles of a suppressor must be lost."}, {"id": "m35", "ch": 10, "t": "mcq", "q": "Angiogenesis matters in cancer because:", "o": ["It causes mutations", "It activates oncogenes", "It supplies nutrients and oxygen beyond 1–2 mm", "It suppresses the immune system"], "k": 2, "w": "No solid tumour exceeds 1–2 mm without it."}, {"id": "m36", "ch": 2, "t": "mcq", "q": "A patient with chronic reflux has columnar epithelium replacing squamous epithelium in the lower oesophagus. This is:", "o": ["Hyperplasia", "Dysplasia", "Metaplasia", "Anaplasia"], "k": 2, "w": "Barrett's oesophagus — adaptive, but carries risk of dysplasia → adenocarcinoma."}, {"id": "m37", "ch": 2, "t": "mcq", "q": "Which feature indicates a cell has passed the point of no return?", "o": ["Cytoplasmic swelling", "Fatty change", "Loss of the nucleus (karyolysis)", "Dilated endoplasmic reticulum"], "k": 2, "w": "Nuclear changes mark irreversible injury."}, {"id": "m38", "ch": 2, "t": "mcq", "q": "Which is a feature of apoptosis but not necrosis?", "o": ["Inflammatory response", "Membrane rupture", "Cell shrinkage with intact membrane", "Affects groups of cells"], "k": 2, "w": "Apoptotic bodies are phagocytosed silently."}, {"id": "m39", "ch": 3, "t": "mcq", "q": "Pleural fluid with low protein content in a patient with heart failure is a:", "o": ["Purulent exudate", "Fibrinous exudate", "Transudate", "Haemorrhagic exudate"], "k": 2, "w": "Normal permeability; hydrostatic imbalance."}, {"id": "m40", "ch": 3, "t": "mcq", "q": "The step in leukocyte emigration in which the cell squeezes between endothelial cells is:", "o": ["Margination", "Adhesion", "Diapedesis", "Chemotaxis"], "k": 2, "w": "Diapedesis = moving through the vessel wall; chemotaxis follows."}, {"id": "m41", "ch": 3, "t": "mcq", "q": "Which mediator is primarily responsible for fever?", "o": ["Histamine", "Bradykinin", "Prostaglandins", "C5a"], "k": 2, "w": "Via IL-1/TNF → PGE₂ in the hypothalamus."}, {"id": "m42", "ch": 3, "t": "mcq", "q": "A retained suture provoking ongoing inflammation is an example of:", "o": ["Regurgitation during feeding", "Frustrated phagocytosis", "Resolution", "Suppuration"], "k": 1, "w": "Non-digestible material — enzymes discharged externally, indefinitely."}, {"id": "m43", "ch": 4, "t": "mcq", "q": "Which immunoglobulin is dominant in saliva?", "o": ["IgG", "IgM", "IgA", "IgE"], "k": 2, "w": "Secretory IgA at mucosal surfaces."}, {"id": "m44", "ch": 4, "t": "mcq", "q": "Which cell reads MHC class I?", "o": ["CD4+ T cell", "CD8+ T cell", "B cell", "Plasma cell"], "k": 1, "w": "4×2=8, 8×1=8."}, {"id": "m45", "ch": 4, "t": "mcq", "q": "A giant cell with nuclei arranged in a horseshoe is:", "o": ["Foreign-body giant cell", "Langhans' giant cell", "Epithelioid cell", "Osteoclast"], "k": 1, "w": "Classic in TB granulomas."}, {"id": "m46", "ch": 4, "t": "mcq", "q": "A painless draining tract from a periapical abscess to the buccal mucosa is a:", "o": ["Fistula", "Sinus", "Ulcer", "Granuloma"], "k": 1, "w": "One opening; drains, so no pressure and no pain — still needs treatment."}, {"id": "m47", "ch": 4, "t": "mcq", "q": "Which is the first antibody produced in a primary response?", "o": ["IgA", "IgG", "IgM", "IgD"], "k": 2, "w": "IgM early, then IgG."}, {"id": "m48", "ch": 5, "t": "mcq", "q": "Stem cells that can form the embryo and the placenta are:", "o": ["Pluripotent", "Multipotent", "Totipotent", "Unipotent"], "k": 2, "w": "Only totipotent cells form extra-embryonic tissue."}, {"id": "m49", "ch": 5, "t": "mcq", "q": "A patient's oesophagus narrows after a chronic ulcer heals. This is:", "o": ["Contracture", "Stenosis", "Keloid", "Dehiscence"], "k": 1, "w": "Excess contraction in a hollow organ; contracture is a muscle/joint."}, {"id": "m50", "ch": 5, "t": "mcq", "q": "Mobility at a fracture site leads to:", "o": ["Malunion", "Osteomyelitis", "Fibrous union / false joint", "Pathological fracture"], "k": 2, "w": "Movement stops the callus mineralising."}, {"id": "m51", "ch": 5, "t": "mcq", "q": "Which growth factor controls collagen formation and scarring?", "o": ["EGF", "VEGF", "TGF-β", "IL-1"], "k": 2, "w": "TGF-β drives myofibroblasts and collagen — excess → hypertrophic scar/keloid."}, {"id": "m52", "ch": 5, "t": "mcq", "q": "Dry-socket risk peaks around which time after extraction?", "o": ["4 hours", "2 days", "8 days", "6 weeks"], "k": 1, "w": "Fibrinolysis has begun but the clot is not yet anchored."}, {"id": "m53", "ch": 6, "t": "mcq", "q": "Which cytokine drives B-cell class switching to IgE?", "o": ["IL-2", "IL-4", "IFN-γ", "IL-17"], "k": 1, "w": "IL-4 (and IL-13) from Th2 cells."}, {"id": "m54", "ch": 6, "t": "mcq", "q": "The most potent bronchoconstrictors released in the late phase of type I are:", "o": ["Histamine", "Leukotrienes C4/D4", "Tryptase", "Heparin"], "k": 1, "w": "Several thousand times histamine's potency."}, {"id": "m55", "ch": 6, "t": "mcq", "q": "First-line drug in anaphylaxis:", "o": ["IV hydrocortisone", "Oral antihistamine", "IM adrenaline", "Nebulised salbutamol"], "k": 2, "w": "300 µg IM, repeat every 5 min; others are adjuncts."}, {"id": "m56", "ch": 6, "t": "mcq", "q": "Anti-TSH-receptor antibodies that stimulate the thyroid cause:", "o": ["Hashimoto thyroiditis", "Graves disease", "Myasthenia gravis", "Pemphigoid"], "k": 1, "w": "Receptor-stimulating type II (sometimes called type V)."}, {"id": "m57", "ch": 6, "t": "mcq", "q": "A rash appears 10–12 days after a streptococcal sore throat, with haematuria. Mechanism?", "o": ["Type I", "Type II", "Type III", "Type IV"], "k": 2, "w": "Post-streptococcal GN — immune complexes in the glomerulus."}, {"id": "m58", "ch": 6, "t": "mcq", "q": "The test for type IV contact allergy is:", "o": ["Skin-prick test read at 20 min", "RAST", "Patch test read at 48 and 96 h", "Serum IgE"], "k": 2, "w": "Delayed reaction needs delayed reading."}, {"id": "m59", "ch": 6, "t": "mcq", "q": "Which antibody is specific for SLE?", "o": ["ANA", "Rheumatoid factor", "Anti-dsDNA", "Anti-SS-A"], "k": 2, "w": "ANA is sensitive but not specific; anti-dsDNA and anti-Sm are specific."}, {"id": "m60", "ch": 7, "t": "mcq", "q": "Anti-SS-A (Ro) and anti-SS-B (La) are associated with:", "o": ["Rheumatoid arthritis", "Sjögren syndrome", "Graves disease", "Myasthenia gravis"], "k": 1, "w": "CD4 T-cell destruction of exocrine ducts → dry eyes and mouth."}, {"id": "m61", "ch": 7, "t": "mcq", "q": "Rheumatic fever after streptococcal infection illustrates:", "o": ["Bystander lysis", "Molecular mimicry", "Hapten formation", "Immune complex deposition"], "k": 1, "w": "Streptococcal M protein resembles cardiac antigen."}, {"id": "m62", "ch": 7, "t": "mcq", "q": "Hyperacute rejection is mediated by:", "o": ["Sensitised T cells", "Preformed antibody", "Chronic fibrosis", "NK cells"], "k": 1, "w": "Minutes–hours; prevented by cross-matching."}, {"id": "m63", "ch": 7, "t": "mcq", "q": "HLA-B27 is strongly associated with:", "o": ["SLE", "Type 1 diabetes", "Ankylosing spondylitis", "Coeliac disease"], "k": 2, "w": "~90-fold relative risk; the autoimmune disease with male predominance."}, {"id": "m64", "ch": 7, "t": "mcq", "q": "Gingival overgrowth in a transplant patient is most likely due to:", "o": ["Tacrolimus", "Ciclosporin", "Prednisolone", "Azathioprine"], "k": 1, "w": "Ciclosporin (also calcium-channel blockers, phenytoin)."}, {"id": "m65", "ch": 8, "t": "mcq", "q": "Chronic granulomatous disease results from a defect in:", "o": ["Complement C3", "NADPH oxidase", "T-cell receptor", "IgA production"], "k": 1, "w": "No respiratory burst → organisms survive inside phagocytes."}, {"id": "m66", "ch": 8, "t": "mcq", "q": "HIV gp120 binds:", "o": ["CD8", "CD4", "MHC I", "CCR5 only"], "k": 1, "w": "CD4 plus a co-receptor (CCR5/CXCR4)."}, {"id": "m67", "ch": 8, "t": "mcq", "q": "A white corrugated lesion on the lateral tongue that does not rub off in an HIV-positive patient is:", "o": ["Pseudomembranous candidosis", "Oral hairy leukoplakia", "Lichen planus", "Squamous papilloma"], "k": 1, "w": "EBV-driven; marker of immunosuppression."}, {"id": "m68", "ch": 8, "t": "mcq", "q": "Kaposi's sarcoma is caused by:", "o": ["EBV", "HPV-16", "HHV-8", "CMV"], "k": 2, "w": "Purple lesions on palate and gingiv const KEY='doh233recall-v1';
const today=()=>Math.floor(Date.now()/864e5);
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');return Object.assign({cards:{},sel:null,night:false,log:[]},s)}catch(e){return{cards:{},sel:null,night:false,log:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function st(id){return S.cards[id]||(S.cards[id]={e:2.5,i:0,d:0,r:0,l:0,n:1})}
function isDue(c){const x=S.cards[c.id];return x&&!x.n&&x.d<=today()}
function isNew(c){const x=S.cards[c.id];return !x||x.n}
function isMastered(c){const x=S.cards[c.id];return x&&!x.n&&x.i>=7}
function rate(c,g){ // 1 again 2 hard 3 good 4 easy
  const x=st(c.id); x.n=0; x.r++;
  if(g===1){x.l++;x.i=0;x.e=Math.max(1.3,x.e-0.2);x.d=today();}
  else if(g===2){x.i=Math.max(1,Math.round(x.i*1.2));x.e=Math.max(1.3,x.e-0.15);x.d=today()+x.i;}
  else if(g===3){x.i=x.i===0?1:x.i===1?3:Math.round(x.i*x.e);x.d=today()+x.i;}
  else{x.i=Math.max(4,Math.round((x.i||1)*(x.e+0.3)));x.e=x.e+0.15;x.d=today()+x.i;}
  S.log.push([today(),c.id,g]); if(S.log.length>3000)S.log.shift(); save();
}
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const chList=Object.keys(D.ch).map(Number);
let sel=new Set(S.sel||chList);
function pool(){return D.cards.filter(c=>sel.has(c.ch))}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function clozeHTML(s){return esc(s).replace(/\{\{(.+?)\}\}/g,(m,a)=>'<span class="cl" tabindex="0">'+a+'</span>')}
function clozeAnswer(s){const m=[...s.matchAll(/\{\{(.+?)\}\}/g)].map(x=>x[1]);return m.join(' · ')}

    c.querySelector('button').onclick=()=>session(shuffle(cs.slice()),'Cram '+n);g.append(c)});

  const rs=el('button','tbtn','Reset all progress');rs.onclick=()=>{if(confirm('Wipe all scheduling data?')){S={cards:{},sel:[...sel],night:S.night,log:[]};save();home()}};

// ---------- session ----------
function session(q,label){
  if(!q.length){const main=$('main');main.innerHTML='';main.append(el('div','empty','Nothing here yet — try Learn new or Cram.'));const b=el('button','tbtn','Back');b.onclick=home;b.style.margin='14px auto 0';b.style.display='block';main.append(b);return}
  const main=$('main');main.innerHTML='';const w=el('div','sess');main.append(w);
  let total=q.length;let done=0,right=0,again=[],res={1:0,2:0,3:0,4:0},wrong=[];
  const bar=el('div','sbar','<span id="lbl"></span><div class="p"><i></i></div><button class="tbtn" id="quit">End session</button>');w.append(bar);
  bar.querySelector('#quit').onclick=()=>finish();
  const box=el('div');w.append(box);
  function prog(){bar.querySelector('#lbl').textContent=label+' · '+done+' / '+total+(again.length?' (+'+again.length+' to repeat)':'');bar.querySelector('.p i').style.width=(100*done/total)+'%'}
  let cur=null,revealed=false;
  function next(){
    if(!q.length){ if(again.length){q=again;total+=again.length;again=[];} else return finish(); }
    cur=q.shift();revealed=false;render();
  }
  function grade(g){rate(cur,g);res[g]++;done++;if(g===1){again.push(cur);wrong.push(cur)}else right++;prog();next()}
  function render(){
    box.innerHTML='';prog();
    const card=el('div','card');box.append(card);
    const k=el('div','k','Chapter '+cur.ch+' · '+D.ch[cur.ch]+' <a href="doh233_master_notes_L1-L5.html#ch'+cur.ch+'" target="_blank">open notes ↗</a><span class="type">'+({qa:'Recall',mcq:'MCQ',cloze:'Fill the blank'})[cur.t]+'</span>');card.append(k);
    if(cur.t==='qa'){
      card.append(el('div','q',esc(cur.q)));
      const acts=el('div','acts');
      const rv=el('button','reveal','Show answer <small>space</small>');rv.onclick=reveal;acts.append(rv);card.append(acts);
      card.append(el('div','kb','Say the answer out loud first. Then rate how it went.'));
      function reveal(){if(revealed)return;revealed=true;const a=el('div','a','<div class="lab">Answer</div>'+esc(cur.a));card.insertBefore(a,acts);acts.innerHTML='';ratings(acts)}
      card._reveal=reveal;
    } else if(cur.t==='cloze'){
      card.append(el('div','q',clozeHTML(cur.s)));
      card.append(el('div','hint','Hint: '+esc(cur.h)+' · click a blank to peek, or reveal all'));
      card.querySelectorAll('.cl').forEach(s=>s.onclick=()=>s.classList.add('open'));
      const acts=el('div','acts');const rv=el('button','reveal','Reveal <small>space</small>');rv.onclick=reveal;acts.append(rv);card.append(acts);
      function reveal(){if(revealed)return;revealed=true;card.classList.add('revealed');acts.innerHTML='';ratings(acts)}
      card._reveal=reveal;
    } else {
      card.append(el('div','q',esc(cur.q)));
      const opts=el('div','opts');const order=shuffle(cur.o.map((t,i)=>i));
      order.forEach((oi,n)=>{const b=el('button','opt',esc(cur.o[oi]));b.dataset.l='ABCD'[n];b.onclick=()=>pick(oi,b);opts.append(b)});card.append(opts);
      card.append(el('div','kb','Press A–D to answer.'));
      card._opts=opts;
      function pick(oi,b){if(revealed)return;revealed=true;const ok=oi===cur.k;opts.querySelectorAll('.opt').forEach((x,n)=>{x.disabled=true;if(order[n]===cur.k)x.classList.add('ok');else if(x===b&&!ok)x.classList.add('bad')});
        card.append(el('div','why',(ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+esc(cur.w)));
        const acts=el('div','acts');const nx=el('button','next','Next <small>space</small>');nx.onclick=()=>grade(ok?3:1);acts.append(nx);card.append(acts);card._next=()=>grade(ok?3:1)}
      card._pick=(n)=>{const b=opts.querySelectorAll('.opt')[n];if(b&&!revealed)pick(order[n],b)};
    }
    box._card=card;
  }
  function ratings(acts){[[1,'Again','forgot · 1'],[2,'Hard','barely · 2'],[3,'Good','got it · 3'],[4,'Easy','knew it cold · 4']].forEach(([g,t,s])=>{const b=el('button','r'+g,t+'<small>'+s+'</small>');b.onclick=()=>grade(g);acts.append(b)})}
  function key(e){const c=box._card;if(!c)return;if(e.target.tagName==='INPUT')return;
    if(e.key===' '||e.key==='Enter'){e.preventDefault();if(cur.t==='mcq'){if(revealed&&c._next)c._next()}else{if(!revealed)c._reveal();}return}
    if(cur.t==='mcq'&&!revealed){const n='abcd'.indexOf(e.key.toLowerCase());const m=n>=0?n:'1234'.indexOf(e.key);if(m>=0)c._pick(m);return}
    if(revealed&&cur.t!=='mcq'&&'1234'.includes(e.key)&&e.key)grade(+e.key)}
  document.onkeydown=key;
  function finish(){document.onkeydown=null;box.innerHTML='';const d=el('div','done');
    d.append(el('h2',null,done?'Session complete':'Session ended'));
    d.append(el('div','nums','<div><b>'+done+'</b>answered</div><div><b>'+(done?Math.round(100*right/done):0)+'%</b>recalled</div><div><b>'+res[1]+'</b>missed</div><div><b>'+res[4]+'</b>easy</div>'));
    const miss=[...new Set(wrong.map(c=>c.id))].map(id=>D.cards.find(c=>c.id===id));
    if(miss.length){const u=el('ul','weak');d.append(el('p',null,'<b>Worth re-reading:</b>'));miss.slice(0,12).forEach(c=>u.append(el('li',null,'Ch '+c.ch+' — '+esc(c.t==='cloze'?c.s.replace(/\{\{|\}\}/g,''):c.q))));d.append(u)}
    const b=el('button','tbtn','Back to dashboard');b.onclick=home;b.style.marginTop='16px';d.append(b);box.append(d);scrollTo(0,0)}
  next();scrollTo(0,0);
}
// night
const root=document.documentElement;if(S.night)root.setAttribute('data-mode','night');
$('#night').onclick=()=>{S.night=!S.night;root.setAttribute('data-mode',S.night?'night':'day');save()};
$('#home').onclick=e=>{e.preventDefault();document.onkeydown=null;home()};
home();
</script>
